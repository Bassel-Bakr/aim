name: Check

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A second push to a pull request makes the run already going on it pointless. The weekly link
# check is not cancelled: nothing supersedes it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/aim-theme.test.mjs
      - run: pip install -r requirements.txt
      - run: python scripts/check_pages.py
      - run: python scripts/check_contrast.py
      - run: zensical build --clean

  links:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,403,429
            --exclude "^https://(x|twitter)\.com/"
            --exclude "^https://discord\.(gg|com)/"
            "docs/**/*.md"
          fail: true
