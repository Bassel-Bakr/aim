<svg viewBox="0 0 600 326" class="fig-fit" role="img" aria-labelledby="fig-grouping-title"><title id="fig-grouping-title">Two panels, Run A and Run B, each putting the same nine shots on the same target on the same clock. The shots land one at a time, and a ring around the aim point resizes after every shot to follow how far from the middle the shots are sitting. In Run A the ring stays wide the whole way through, wobbling but never closing. In Run B the ring opens just as wide and then closes in as the later shots land near the aim point. Only once both runs have finished does the hit count appear under each of them, and it is the same number under both.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimGrpMark0{0%{opacity:0}4.5%{opacity:0}6.1%{opacity:1}94%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes aimGrpMark1{0%{opacity:0}10.3%{opacity:0}11.9%{opacity:1}94%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes aimGrpMark2{0%{opacity:0}16.1%{opacity:0}17.7%{opacity:1}94%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes aimGrpMark3{0%{opacity:0}21.9%{opacity:0}23.5%{opacity:1}94%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes aimGrpMark4{0%{opacity:0}27.7%{opacity:0}29.3%{opacity:1}94%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes aimGrpMark5{0%{opacity:0}33.5%{opacity:0}35.1%{opacity:1}94%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes aimGrpMark6{0%{opacity:0}39.3%{opacity:0}40.9%{opacity:1}94%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes aimGrpMark7{0%{opacity:0}45.1%{opacity:0}46.7%{opacity:1}94%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes aimGrpMark8{0%{opacity:0}50.9%{opa