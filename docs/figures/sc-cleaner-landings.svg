ansform:translateX(360px)}100%{transform:translateX(360px)}}@keyframes aimRes3423c4S{0%{transform:translateX(0px)}77.08%{transform:translateX(464px)}100%{transform:translateX(464px)}}.aim-res-3423c4{animation-duration:4.8s;animation-timing-function:linear;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){.aim-res-3423c4{animation-play-state:paused;animation-delay:-1.18s!important}.aim-res-3423c4-s{opacity:0}}</style><rect x="8" y="8" width="584" height="140" rx="12" class="fig-panel"/><text x="22" y="32"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Cleaner landings</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">overshoot</tspan></text><path d="M78 78H474" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><g class="fig-target"><circle cx="452" cy="78" r="9"/></g><text x="22" y="78.0" class="fig-tense-fill" text-anchor="start" font-size="12" font-weight="700" dominant-baseline="central">before</text><g class="aim-res-3423c4" style="animation-name:aimRes3423c4A"><circle cx="92.0" cy="78.0" r="8" class="fig-tense-stroke" stroke-width="2.2" fill="none"/><path d="M79.0 78.0H88.0M96.0 78.0H105.0M92.0 65.0V74.0M92.0 82.0V91.0" class="fig-tense-stroke" stroke-width="2.2"/></g><path d="M78 124H474" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><g class="fig-target"><circle cx="452" cy="124" r="9"/></g><text x="22" y="124.0" class="fig-balanced-fill" text-anchor="start" font-size="12" font-weight="700" dominant-baseline="central">after</text><g class="aim-res-3423c4" style="animation-name:aimRes3423c4B"><circle cx="92.0" cy="124.0" r="8" class="fig-balanced-stroke" stroke-width="2.2" fill="none"/><path d="M79.0 124.0H88.0M96.0 124.0H105.0M92.0 111.0V120.0M92.0 128.0V137.0" class="fig-balanced-stroke" stroke-width="2.2"/></g><path d="M440 155v9" class="fig-tense-stroke" stroke-width="2.6"/><path d="M305 164v9" class="fig-balanced-stroke" stroke-width="2.6"/><rect x="