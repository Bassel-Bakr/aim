<svg viewBox="0 0 600 164" class="fig-fit" role="img" aria-labelledby="fig-sc-pacing-keeps-dropping-title"><title id="fig-sc-pacing-keeps-dropping-title">Pacing keeps dropping. The crosshair leaves the start and reaches the target. Braking starts late, close to the target, so hauling the crosshair back is the longest part of the shot. The crosshair shakes a little as it arrives. The trigger goes at 90 per cent of the shot, before the crosshair has settled. A faint trail shows how far it got, and a ring or a crossed ring marks where the shot went: the shot lands on the target. The bar underneath is real time on one scale, split into the flick, the braking and the settle, and this shot takes 132 milliseconds from the start to the trigger.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>.aim-iss-t-pacing_keeps_dropping,.aim-iss-m-pacing_keeps_dropping{animation-duration:3.4s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes aimIssTravel_pacing_keeps_dropping{0%{transform:translate(0px,0)}2.381%{transform:translate(8.36px,0)}4.762%{transform:translate(33.44px,0)}7.143%{transform:translate(74.6px,0)}9.524%{transform:translate(120.1px,0)}11.9%{transform:translate(165.7px,0)}14.29%{transform:translate(211.2px,0)}16.67%{transform:translate(256.8px,0)}19.05%{transform:translate(298.3px,0.06218px)}21.43%{transform:translate(322.2px,-1.47px)}23.81%{transform:translate(331.6px,1.515px)}26.19%{transform:translate(333.7px,1.612px)}28.57%{transform:translate(340.6px,-2.964px)}30.95%{transform:translate(346px,0.7672px)}33.33%{transform:translate(340.6px,2.349px)}35.71%{transform:translate(334.1px,-2.652px)}38.1%{transform:translate(338.2px,-0.2204px)}40.48%{transform:translate(345.5px,2.829px)}42.86%{transform:translate(342.9px,-2.05px)}45.24%{transform:translate(335.2px,-1.16px)}47.62%{transform:translate(336.9px,2.34px)}50%{transform:translate(342.4px,-0.7101px)}52.38%{transform:translate(341.8px,-0.7675px)}54.76%{transform:translate(339.4px,0.5131px)}57.14%{transform:translate(340px,0)}100%{transform:translate(340px,0)}}@keyframes aimIssFire_pacing_keeps_dropping{0%,30.95%{opacity:0}32.95%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.aim-iss-t-pacing_keeps_dropping{animation-play-state:paused;animation-delay:-0.918s!important}.aim-iss-m-pacing_keeps_dropping{animation:none!important;opacity:1!important}}</style><rect x="8" y="6" width="584" height="152" rx="12" class="fig-panel"/><text x="20" y="28"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Pacing keeps dropping</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">brakes late</tspan></text><path d="M62 82H560" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><path d="M80 68v28" class="fig-grid-stroke" stroke-width="1.5"/><path d="M80 82H420" class="fig-tense-stroke" stroke-width="8" opacity="0.2" fill="none" stroke-linecap="round"/><circle cx="420" cy="82" r="10" class="fig-target"/><g class="aim-iss-m-pacing_keeps_dropping" style="animation-name:aimIssFire_pacing_keeps_dropping;opacity:0"><circle cx="426" cy="82.77" r="14" class="fig-balanced-stroke" fill="none" stroke-width="2.6"/></g><g class="aim-iss-t-pacing_keeps_dropping" style="animation-name:aimIssTravel_pacing_keeps_dropping"><circle cx="80" cy="82" r="8" class="fig-tense-stroke" stroke-width="2.2" fill="none"/><path d="M67 82H76M84 82H93M80 69V78M80 86V95" class="fig-tense-stroke" stroke-width="2.2"/></g><rect x="80" y="112" width="89" height="14" rx="6" class="fig-ink-fill" opacity="0.7"/><text x="124.5" y="119" class="fig-surface" text-anchor="middle" font-size="11" font-weight="700" dominant-baseline="central">Flick</text><rect x="171" y="112" width="39.6" height="14" rx="6" class="fig-tense-fill" opacity="1.0"/><rect x="212.6" y="112" width="37" height="14" rx="6" class="fig-tense-fill" opacity="0.45"/><path d="M232 107v24" class="fig-ink-stroke" stroke-width="2"/><text x="260.6" y="123" class="fig-tense-fill" text-anchor="start" font-size="12" font-weight="600">132 ms</text><text x="20" y="148" class="fig-muted fig-caption" text-anchor="start" font-size="12" font-weight="600">shakes as it arrives</text><text x="580" y="148" class="fig-muted fig-caption" text-anchor="end" font-size="12" font-weight="600">trigger at 90%, shot lands</text></svg>
