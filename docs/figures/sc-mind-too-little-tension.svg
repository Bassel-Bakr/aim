<svg viewBox="0 0 600 164" class="fig-fit" role="img" aria-labelledby="fig-sc-mind-too-little-tension-title"><title id="fig-sc-mind-too-little-tension-title">Too little arm tension. The crosshair leaves the start and stalls 14 per cent short of the target and never arrives. Braking starts far out, so the last stretch is a crawl. The crosshair shakes a little as it arrives. The trigger goes once the motion is done. A faint trail shows how far it got, and a ring or a crossed ring marks where the shot went: the shot misses. The bar underneath is real time on one scale, split into the flick, the braking and the settle, and this shot takes 293 milliseconds from the start to the trigger.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>.aim-iss-t-mind_too_little_tension,.aim-iss-m-mind_too_little_tension{animation-duration:3.4s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes aimIssTravel_mind_too_little_tension{0%{transform:translate(0px,0)}2.381%{transform:translate(5.358px,0)}4.762%{transform:translate(21.43px,0)}7.143%{transform:translate(45.26px,0)}9.524%{transform:translate(69.45px,0)}11.9%{transform:translate(93.63px,0)}14.29%{transform:translate(117.8px,0)}16.67%{transform:translate(137.8px,0)}19.05%{transform:translate(153.8px,-1.471px)}21.43%{transform:translate(166.8px,-2.969px)}23.81%{transform:translate(175.8px,-1.687px)}26.19%{transform:translate(184.1px,0.6934px)}28.57%{transform:translate(193.1px,2.623px)}30.95%{transform:translate(203.5px,2.844px)}33.33%{transform:translate(215.4px,1.214px)}35.71%{transform:translate(228px,-1.207px)}38.1%{transform:translate(240.2px,-2.842px)}40.48%{transform:translate(250.7px,-2.626px)}42.86%{transform:translate(258.5px,-0.7007px)}45.24%{transform:translate(263.5px,1.681px)}47.62%{transform:translate(266.4px,2.968px)}50%{transform:translate(268.3px,2.323px)}52.38%{transform:translate(270.6px,0.1647px)}54.76%{transform:translate(274.2px,-2.101px)}57.14%{transform:translate(279.3px,-2.998px)}59.52%{transform:translate(285.5px,-1.943px)}61.9%{transform:translate(291.5px,0.3767px)}64.29%{transform:translate(295.9px,2.452px)}66.67%{transform:translate(297.9px,2.93px)}69.05%{transform:translate(297px,1.501px)}71.43%{transform:translate(294px,-0.9058px)}73.81%{transform:translate(290.4px,-2.723px)}76.19%{transform:translate(287.5px,-2.767px)}78.57%{transform:translate(286.4px,-1.009px)}80.95%{transform:translate(288.5px,1.124px)}83.33%{transform:translate(291.2px,1.744px)}85.71%{transform:translate(293.1px,1.006px)}88.1%{transform:translate(293.3px,0.09715px)}90.48%{transform:translate(292.4px,0)}100%{transform:translate(292.4px,0)}}@keyframes aimIssFire_mind_too_little_tension{0%,78.57%{opacity:0}80.57%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.aim-iss-t-mind_too_little_tension{animation-play-state:paused;animation-delay:-2.37s!important}.aim-iss-m-mind_too_little_tension{animation:none!important;opacity:1!important}}</style><rect x="8" y="6" width="584" height="152" rx="12" class="fig-panel"/><text x="20" y="28"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Too little arm tension</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">brakes far too early</tspan></text><path d="M62 82H560" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><path d="M80 68v28" class="fig-grid-stroke" stroke-width="1.5"/><path d="M80 82H372.4" class="fig-loose-stroke" stroke-width="8" opacity="0.2" fill="none" stroke-linecap="round"/><circle cx="420" cy="82" r="10" class="fig-target"/><text x="372.4" y="58" class="fig-loose-fill" text-anchor="middle" font-size="12" font-weight="700">never gets there</text><g class="aim-iss-m-mind_too_little_tension" style="animation-name:aimIssFire_mind_too_little_tension;opacity:0"><path d="M357.9 72.49l17 17M374.9 72.49l-17 17" class="fig-loose-stroke" stroke-width="2.8" fill="none" stroke-linecap="round"/></g><g class="aim-iss-t-mind_too_little_tension" style="animation-name:aimIssTravel_mind_too_little_tension"><circle cx="80" cy="82" r="8" class="fig-loose-stroke" stroke-width="2.2" fill="none"/><path d="M67 82H76M84 82H93M80 69V78M80 86V95" class="fig-loose-stroke" stroke-width="2.2"/></g><rect x="80" y="112" width="73.4" height="14" rx="6" class="fig-ink-fill" opacity="0.7"/><text x="116.7" y="119" class="fig-surface" text-anchor="middle" font-size="11" font-weight="700" dominant-baseline="central">Flick</text><rect x="155.4" y="112" width="264.5" height="14" rx="6" class="fig-loose-fill" opacity="1.0"/><text x="287.65" y="119" class="fig-surface" text-anchor="middle" font-size="11" font-weight="700" dominant-baseline="central">Brake</text><rect x="421.9" y="112" width="37" height="14" rx="6" class="fig-loose-fill" opacity="0.45"/><text x="469.9" y="123" class="fig-loose-fill" text-anchor="start" font-size="12" font-weight="600">293 ms</text><text x="20" y="148" class="fig-muted fig-caption" text-anchor="start" font-size="12" font-weight="600">shakes as it arrives</text><text x="580" y="148" class="fig-muted fig-caption" text-anchor="end" font-size="12" font-weight="600">shot misses short</text></svg>
