<svg viewBox="0 0 600 232" class="fig-fit" role="img" aria-labelledby="fig-settle-title"><title id="fig-settle-title">One shot drawn as a bar of time. On the first bar the beat arrives partway through the first micro-correction and the trigger goes at 310 milliseconds. The second bar keeps correcting instead, taking 510 milliseconds for the same shot. A dashed line marks where the beat falls across both.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimSetSweep{0%{transform:translate(0,0)}82%{transform:translate(410px,0)}100%{transform:translate(410px,0)}}.aim-set-anim{animation-duration:4.2s;animation-timing-function:linear;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){.aim-set-anim{animation-play-state:paused;animation-delay:-1.72s!important}}</style><rect x="8" y="8" width="584" height="216" rx="12" class="fig-panel"/><text x="24" y="48"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Commit</tspan></text><text x="24" y="68" class="fig-muted" text-anchor="start" font-size="13" font-weight="500">the beat arrives, the shot goes</text><rect x="150.0" y="76" width="109.4" height="30" rx="6" class="fig-ink-fill" opacity="0.7"/><text x="204.70967741935485" y="91" class="fig-surface" text-anchor="middle" font-size="12" font-weight="700" dominant-baseline="central">Flick</text><rect x="262.4" y="76" width="56.5" height="30" rx="6" class="fig-balanced-fill" opacity="0.8"/><text x="290.6774193548387" y="91" class="fig-surface" text-anchor="middle" font-size="10" font-weight="700" dominant-baseline="central">Confirm</text><rect x="321.9" y="76" width="30.1" height="30" rx="6" class="fig-tense-fill" opacity="0.75"/><text x="336.9677419354839" y="91" class="fig-surface" text-anchor="middle" font-size="12" font-weight="700" dominant-baseline="central">½</text><path d="M358.0 71v40" class="fig-accent-stroke" stroke-width="3"/><text x="369.0" y="96" class="fig-muted" text-anchor="start" font-size="13" font-weight="600">310 ms</text><text x="24" y="132"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Fine-tune</tspan></text><text x="24" y="152" class="fig-muted" text-anchor="start" font-size="13" font-weight="500">micro, confirm, micro again</text><rect x="150.0" y="160" width="109.4" height="30" rx="6" class="fig-ink-fill" opacity="0.7"/><text x="204.70967741935485" y="175" class="fig-surface" text-anchor="middle" font-size="12" font-weight="700" dominant-baseline="central">Flick</text><rect x="262.4" y="160" width="56.5" height="30" rx="6" class="fig-balanced-fill" opacity="0.8"/><text x="290.6774193548387" y="175" class="fig-surface" text-anchor="middle" font-size="10" font-weight="700" dominant-baseline="central">Confirm</text><rect x="321.9" y="160" width="63.1" height="30" rx="6" class="fig-tense-fill" opacity="0.75"/><text x="353.5" y="175" class="fig-surface" text-anchor="middle" font-size="12" font-weight="700" dominant-baseline="central">Micro</text><rect x="388.1" y="160" width="56.5" height="30" rx="6" class="fig-balanced-fill" opacity="0.8"/><text x="416.3225806451613" y="175" class="fig-surface" text-anchor="middle" font-size="10" font-weight="700" dominant-baseline="central">Confirm</text><rect x="447.6" y="160" width="56.5" height="30" rx="6" class="fig-tense-fill" opacity="0.75"/><text x="475.83870967741933" y="175" class="fig-surface" text-anchor="middle" font-size="12" font-weight="700" dominant-baseline="central">Micro</text><path d="M510.1 155v40" class="fig-accent-stroke" stroke-width="3"/><text x="521.0967741935483" y="180" class="fig-muted" text-anchor="start" font-size="13" font-weight="600">540 ms</text><path d="M355.0 40V202" class="fig-tense-stroke" stroke-width="2" stroke-dasharray="5 4"/><text x="361.0" y="36" class="fig-tense-fill" text-anchor="start" font-size="13" font-weight="700">the beat</text><g class="aim-set-anim" style="animation-name:aimSetSweep"><path d="M150 62V198" class="fig-ink-stroke" stroke-width="1.5" opacity="0.35"/></g><text x="150" y="220" class="fig-muted" text-anchor="start" font-size="13" font-weight="600">one shot, start to trigger</text></svg>
