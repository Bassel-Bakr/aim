<svg viewBox="0 0 760 300" class="fig-fit" role="img" aria-labelledby="fig-headbox-title"><title id="fig-headbox-title">Two characters, one without a head box and one with. A marked line shows where a camera height offset of zero sits: the middle of the body when there is no head, the middle of the head when there is. A body shot on each is marked as doing no damage under Headshot Only.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimHbxShot{0%{opacity:0}8%{opacity:1}56%{opacity:1}64%{opacity:0}100%{opacity:0}}.aim-hbx-shot{opacity:0;animation-name:aimHbxShot;animation-iteration-count:infinite;animation-duration:4.8s}@media (prefers-reduced-motion:reduce){.aim-hbx-shot{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="228" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">No head</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">eyes sit at the body's middle</tspan></text><rect x="164" y="92" width="52" height="96" rx="12" class="fig-target"/><path d="M98 140H156" class="fig-cool-stroke" stroke-width="2" stroke-dasharray="5 4"/><text x="94" y="144" class="fig-cool-fill" text-anchor="end" font-size="12" font-weight="600">offset 0</text><g class="aim-hbx-shot"><circle cx="194" cy="148" r="6" class="fig-accent-fill"/><text x="282" y="152" class="fig-tense-fill" text-anchor="middle" font-size="12" font-weight="700">no damage</text></g><text x="190" y="258" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">under Headshot Only</text><rect x="392" y="46" width="356" height="228" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Has head</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">eyes sit at the head's middle</tspan></text><rect x="544" y="132" width="52" height="96" rx="12" class="fig-target"/><circle cx="570" cy="110" r="20" class="fig-target"/><path d="M478 110H536" class="fig-cool-stroke" stroke-width="2" stroke-dasharray="5 4"/><text x="474" y="114" class="fig-cool-fill" text-anchor="end" font-size="12" font-weight="600">offset 0</text><g class="aim-hbx-shot"><circle cx="574" cy="188" r="6" class="fig-accent-fill"/><text x="662" y="192" class="fig-tense-fill" text-anchor="middle" font-size="12" font-weight="700">no damage</text></g><text x="570" y="258" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">under Headshot Only</text></svg>
