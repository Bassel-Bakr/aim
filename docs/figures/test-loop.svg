<svg viewBox="0 0 760 280" class="fig-fit" role="img" aria-labelledby="fig-testloop-title"><title id="fig-testloop-title">Two panels, each looping between an edit step and a play step. On the left the edit is a profile change and the outcome on save is kept. On the right the edit is made in the Session Manager and the outcome on save is discarded.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimLoopStep{0%{opacity:0.25}6%{opacity:1}30%{opacity:1}36%{opacity:0.25}100%{opacity:0.25}}.aim-loop-step{opacity:0.25;animation-name:aimLoopStep;animation-iteration-count:infinite;animation-duration:6.4s}@keyframes aimLoopDrop{0%{opacity:0}62%{opacity:0}68%{opacity:1}92%{opacity:1}100%{opacity:0}}.aim-loop-drop{opacity:0;animation-name:aimLoopDrop;animation-iteration-count:infinite;animation-duration:6.4s}@media (prefers-reduced-motion:reduce){.aim-loop-step,.aim-loop-drop{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="206" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Edit a profile</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">Play applies it, no save needed</tspan></text><g class="aim-loop-step" style="animation-delay:0.00s"><rect x="40" y="104" width="92" height="44" rx="9" class="fig-panel fig-ink-stroke" stroke-width="2"/><text x="86" y="126" class="fig-ink" text-anchor="middle" font-size="14" font-weight="600" dominant-baseline="central">edit</text></g><path d="M136 126H148" class="fig-grid-stroke" stroke-width="2"/><g class="aim-loop-step" style="animation-delay:1.02s"><rect x="144" y="104" width="92" height="44" rx="9" class="fig-panel fig-ink-stroke" stroke-width="2"/><text x="190" y="126" class="fig-ink" text-anchor="middle" font-size="14" font-weight="600" dominant-baseline="central">play</text></g><path d="M86 152V178H190V152" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="5 5" fill="none"/><path d="M244 126H256" class="fig-grid-stroke" stroke-width="2"/><g class="aim-loop-drop"><rect x="256" y="104" width="96" height="44" rx="9" class="fig-panel fig-balanced-stroke" stroke-width="2"/><text x="304" y="126" class="fig-balanced-fill" text-anchor="middle" font-size="13" font-weight="700" dominant-baseline="central">kept</text></g><text x="304" y="172" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">on save</text><rect x="392" y="46" width="356" height="206" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Edit the Session Manager</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">the save drops it</tspan></text><g class="aim-loop-step" style="animation-delay:0.00s"><rect x="420" y="104" width="92" height="44" rx="9" class="fig-panel fig-ink-stroke" stroke-width="2"/><text x="466" y="126" class="fig-ink" text-anchor="middle" font-size="14" font-weight="600" dominant-baseline="central">edit</text></g><path d="M516 126H528" class="fig-grid-stroke" stroke-width="2"/><g class="aim-loop-step" style="animation-delay:1.02s"><rect x="524" y="104" width="92" height="44" rx="9" class="fig-panel fig-ink-stroke" stroke-width="2"/><text x="570" y="126" class="fig-ink" text-anchor="middle" font-size="14" font-weight="600" dominant-baseline="central">play</text></g><path d="M466 152V178H570V152" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="5 5" fill="none"/><path d="M624 126H636" class="fig-grid-stroke" stroke-width="2"/><g class="aim-loop-drop"><rect x="636" y="104" width="96" height="44" rx="9" class="fig-panel fig-tense-stroke" stroke-width="2"/><text x="684" y="126" class="fig-tense-fill" text-anchor="middle" font-size="13" font-weight="700" dominant-baseline="central">discarded</text></g><text x="684" y="172" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">on save</text></svg>
