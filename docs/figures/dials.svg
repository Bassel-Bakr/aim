<svg viewBox="0 0 760 250" class="fig-fit" role="img" aria-labelledby="fig-dials-title"><title id="fig-dials-title">Three panels, each with a crosshair and a target, and a bar showing how much the shot demands. A baseline panel. A panel where the target is smaller at the same distance. A panel where the target is the baseline size but further away. The second and third panels show the same raised demand as each other.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>.aim-dial-anim{animation-timing-function:linear;animation-iteration-count:infinite;animation-duration:3.4s}@media (prefers-reduced-motion:reduce){.aim-dial-anim{animation-play-state:paused;animation-delay:-1.16s!important}}@keyframes aimDialRunBaseline{0%{transform:translate(0,0)}39.68%{transform:translate(122.0px,0)}100%{transform:translate(122.0px,0)}}.aim-dial-Baseline{animation-name:aimDialRunBaseline}@keyframes aimDialRunSmallertarget{0%{transform:translate(0,0)}62%{transform:translate(122.0px,0)}100%{transform:translate(122.0px,0)}}.aim-dial-Smallertarget{animation-name:aimDialRunSmallertarget}@keyframes aimDialRunFurtheraway{0%{transform:translate(0,0)}62%{transform:translate(174.0px,0)}100%{transform:translate(174.0px,0)}}.aim-dial-Furtheraway{animation-name:aimDialRunFurtheraway}</style><rect x="12" y="42" width="234" height="192" rx="12" class="fig-panel"/><text x="28" y="30" class="fig-ink" text-anchor="start" font-size="15" font-weight="700">Baseline</text><path d="M38 112H159.9626168224299" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="5 5"/><circle cx="159.9626168224299" cy="112" r="17" class="fig-target"/><g class="aim-dial-anim aim-dial-Baseline"><circle cx="38" cy="112" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M25 112H34M42 112H51M38 99V108M38 116V125" class="fig-ink-stroke" stroke-width="2.2"/></g><rect x="28" y="182" width="96" height="12" rx="6" class="fig-accent-fill"/><text x="28" y="216" class="fig-muted" text-anchor="start" font-size="13" font-weight="500">demand</text><rect x="263" y="42" width="234" height="192" rx="12" class="fig-panel"/><text x="279" y="30" class="fig-ink" text-anchor="start" font-size="15" font-weight="700">Smaller target</text><path d="M289 112H410.96261682242994" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="5 5"/><circle cx="410.96261682242994" cy="112" r="10" class="fig-target"/><g class="aim-dial-anim aim-dial-Smallertarget"><circle cx="289" cy="112" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M276 112H285M293 112H302M289 99V108M289 116V125" class="fig-ink-stroke" stroke-width="2.2"/></g><rect x="279" y="182" width="150" height="12" rx="6" class="fig-accent-fill"/><text x="279" y="216" class="fig-muted" text-anchor="start" font-size="13" font-weight="500">demand</text><rect x="514" y="42" width="234" height="192" rx="12" class="fig-panel"/><text x="530" y="30" class="fig-ink" text-anchor="start" font-size="15" font-weight="700">Further away</text><path d="M540 112H714.0" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="5 5"/><circle cx="714.0" cy="112" r="17" class="fig-target"/><g class="aim-dial-anim aim-dial-Furtheraway"><circle cx="540" cy="112" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M527 112H536M544 112H553M540 99V108M540 116V125" class="fig-ink-stroke" stroke-width="2.2"/></g><rect x="530" y="182" width="150" height="12" rx="6" class="fig-accent-fill"/><text x="530" y="216" class="fig-muted" text-anchor="start" font-size="13" font-weight="500">demand</text></svg>
