<svg viewBox="0 0 760 280" class="fig-fit" role="img" aria-labelledby="fig-feedback-title"><title id="fig-feedback-title">The same shot on the same target, twice. With hit markers on, four marks appear around the crosshair and the shot is labelled a hit. With them off there is no mark and the label asks whether it landed.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimFbkShot{0%{opacity:0}10%{opacity:1}44%{opacity:1}52%{opacity:0}100%{opacity:0}}.aim-fbk-shot{opacity:0;animation-name:aimFbkShot;animation-iteration-count:infinite;animation-duration:4.4s}@keyframes aimFbkMark{0%{opacity:0}16%{opacity:1}40%{opacity:1}48%{opacity:0}100%{opacity:0}}.aim-fbk-mark{opacity:0;animation-name:aimFbkMark;animation-iteration-count:infinite;animation-duration:4.4s}@media (prefers-reduced-motion:reduce){.aim-fbk-shot,.aim-fbk-mark{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="204" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Markers on</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">you know instantly</tspan></text><circle cx="190" cy="142" r="34" class="fig-target"/><circle cx="200" cy="134" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M187 134H196M204 134H213M200 121V130M200 138V147" class="fig-ink-stroke" stroke-width="2.2"/><g class="aim-fbk-mark"><path d="M184 118l-12 -12M216 118l12 -12M184 150l-12 12M216 150l12 12" class="fig-accent-stroke" stroke-width="3" stroke-linecap="round"/></g><g class="aim-fbk-shot"><text x="190" y="216" class="fig-accent-text" text-anchor="middle" font-size="14" font-weight="700">hit</text></g><text x="190" y="250" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">feedback on every shot</text><rect x="392" y="46" width="356" height="204" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Markers off</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">you have to watch the target</tspan></text><circle cx="570" cy="142" r="34" class="fig-target"/><circle cx="580" cy="134" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M567 134H576M584 134H593M580 121V130M580 138V147" class="fig-ink-stroke" stroke-width="2.2"/><g class="aim-fbk-shot"><text x="570" y="216" class="fig-muted" text-anchor="middle" font-size="14" font-weight="700">did that land?</text></g><text x="570" y="250" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">closer to a game, harder to read</text></svg>
