<svg viewBox="0 0 760 270" class="fig-fit" role="img" aria-labelledby="fig-piercing-title"><title id="fig-piercing-title">Two panels with three targets lined up. With piercing off the shot stops at the first target and the other two are left faded. With piercing on the shot passes through all three.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimPieRay{0%{transform:scaleX(0);opacity:0}8%{opacity:1}46%{transform:scaleX(1);opacity:1}62%{transform:scaleX(1);opacity:1}70%{opacity:0}100%{opacity:0}}.aim-pie-ray{transform-box:fill-box;transform-origin:left center;opacity:0;animation-name:aimPieRay;animation-iteration-count:infinite;animation-duration:4.4s}@keyframes aimPieHit{0%{opacity:0}100%{opacity:1}}@media (prefers-reduced-motion:reduce){.aim-pie-ray{opacity:1;transform:none!important;animation:none!important}}</style><rect x="12" y="46" width="356" height="198" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Piercing off</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">the first target stops it</tspan></text><circle cx="154" cy="150" r="19" class="fig-target" opacity="1"/><circle cx="240" cy="150" r="19" class="fig-target" opacity="0.35"/><circle cx="326" cy="150" r="19" class="fig-target" opacity="0.35"/><g class="aim-pie-ray"><path d="M58 150H154" class="fig-accent-stroke" stroke-width="4" stroke-linecap="round"/></g><circle cx="58" cy="150" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M45 150H54M62 150H71M58 137V146M58 154V163" class="fig-ink-stroke" stroke-width="2.2"/><text x="190" y="222" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">two left standing</text><rect x="392" y="46" width="356" height="198" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Piercing on</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">one shot, three targets</tspan></text><circle cx="534" cy="150" r="19" class="fig-target" opacity="1"/><circle cx="620" cy="150" r="19" class="fig-target" opacity="1"/><circle cx="706" cy="150" r="19" class="fig-target" opacity="1"/><g class="aim-pie-ray"><path d="M438 150H706" class="fig-accent-stroke" stroke-width="4" stroke-linecap="round"/></g><circle cx="438" cy="150" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M425 150H434M442 150H451M438 137V146M438 154V163" class="fig-ink-stroke" stroke-width="2.2"/><text x="570" y="222" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">all three take damage</text></svg>
