<svg viewBox="0 0 760 280" class="fig-fit" role="img" aria-labelledby="fig-weakest-title"><title id="fig-weakest-title">Six subcategory scores drawn as bars of similar height. The shortest bar is highlighted and labelled as the one to build a scenario for, even though several others are close to it.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimWeakGrow{0%{transform:scaleY(0)}18%{transform:scaleY(1)}100%{transform:scaleY(1)}}.aim-weak-bar{transform-box:fill-box;transform-origin:center bottom;animation-name:aimWeakGrow;animation-iteration-count:infinite;animation-duration:5.0s}@keyframes aimWeakPick{0%{opacity:0}52%{opacity:0}60%{opacity:1}100%{opacity:1}}.aim-weak-pick{opacity:0;animation-name:aimWeakPick;animation-iteration-count:infinite;animation-duration:5.0s}@media (prefers-reduced-motion:reduce){.aim-weak-bar{animation:none!important}.aim-weak-pick{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="736" height="208" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Your last benchmark</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">lowest relative, not worst feeling</tspan></text><rect x="72" y="110.8" width="56" height="95.2" rx="4" class="fig-grid-fill aim-weak-bar" style="animation-delay:0.00s"/><text x="100" y="226" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">static</text><rect x="180" y="119.4" width="56" height="86.6" rx="4" class="fig-grid-fill aim-weak-bar" style="animation-delay:0.09s"/><text x="208" y="226" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">dynamic</text><rect x="288" y="142.6" width="56" height="63.4" rx="4" class="fig-accent-fill aim-weak-bar" style="animation-delay:0.18s"/><text x="316" y="226" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">precise</text><rect x="396" y="115.7" width="56" height="90.3" rx="4" class="fig-grid-fill aim-weak-bar" style="animation-delay:0.27s"/><text x="424" y="226" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">reactive</text><rect x="504" y="107.2" width="56" height="98.8" rx="4" class="fig-grid-fill aim-weak-bar" style="animation-delay:0.36s"/><text x="532" y="226" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">speed</text><rect x="612" y="121.8" width="56" height="84.2" rx="4" class="fig-grid-fill aim-weak-bar" style="animation-delay:0.45s"/><text x="640" y="226" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">evasive</text><g class="aim-weak-pick"><path d="M316 240V254" class="fig-accent-stroke" stroke-width="2"/><text x="316" y="272" class="fig-accent-text" text-anchor="middle" font-size="13" font-weight="700">build for this one</text></g></svg>
