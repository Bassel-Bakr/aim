<svg viewBox="0 0 760 290" class="fig-fit" role="img" aria-labelledby="fig-lockfov-title"><title id="fig-lockfov-title">Two panels, each showing two readers side by side at ninety and at a hundred and three degrees of field of view. Unlocked, the target is visibly smaller for the wider field of view. Locked to a range, both targets are the same size.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimLfvIn{0%{opacity:0}8%{opacity:1}100%{opacity:1}}.aim-lfv-in{opacity:0;animation-name:aimLfvIn;animation-iteration-count:infinite;animation-duration:5.2s}@media (prefers-reduced-motion:reduce){.aim-lfv-in{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="216" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Unlocked</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">each reader gets a different drill</tspan></text><g class="aim-lfv-in" style="animation-delay:0.00s"><circle cx="112" cy="150" r="34" class="fig-target"/></g><circle cx="112" cy="150" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M99 150H108M116 150H125M112 137V146M112 154V163" class="fig-ink-stroke" stroke-width="2.2"/><text x="112" y="214" class="fig-muted" text-anchor="middle" font-size="13" font-weight="600">90 FOV</text><g class="aim-lfv-in" style="animation-delay:0.50s"><circle cx="268" cy="150" r="21" class="fig-target"/></g><circle cx="268" cy="150" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M255 150H264M272 150H281M268 137V146M268 154V163" class="fig-ink-stroke" stroke-width="2.2"/><text x="268" y="214" class="fig-muted" text-anchor="middle" font-size="13" font-weight="600">103 FOV</text><text x="190" y="256" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">the wider view shrinks the target</text><rect x="392" y="46" width="356" height="216" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Locked to a range</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">the same angular target for all</tspan></text><g class="aim-lfv-in" style="animation-delay:0.00s"><circle cx="492" cy="150" r="34" class="fig-target"/></g><circle cx="492" cy="150" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M479 150H488M496 150H505M492 137V146M492 154V163" class="fig-ink-stroke" stroke-width="2.2"/><text x="492" y="214" class="fig-muted" text-anchor="middle" font-size="13" font-weight="600">90 FOV</text><g class="aim-lfv-in" style="animation-delay:0.50s"><circle cx="648" cy="150" r="34" class="fig-target"/></g><circle cx="648" cy="150" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M635 150H644M652 150H661M648 137V146M648 154V163" class="fig-ink-stroke" stroke-width="2.2"/><text x="648" y="214" class="fig-muted" text-anchor="middle" font-size="13" font-weight="600">103 FOV</text><text x="570" y="256" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">the clamp holds both the same</text></svg>
