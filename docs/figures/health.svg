<svg viewBox="0 0 760 290" class="fig-fit" role="img" aria-labelledby="fig-health-title"><title id="fig-health-title">Two panels with the same target and crosshair. On the left a single pip fills and the target dies to one hit. On the right three pips fill one after another, so the shot has to stay on the target after the first hit lands.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimHpShot{0%{opacity:0}5%{opacity:1}22%{opacity:1}26%{opacity:0}100%{opacity:0}}.aim-hp-shot{opacity:0;animation-name:aimHpShot;animation-iteration-count:infinite;animation-duration:5.0s}@media (prefers-reduced-motion:reduce){.aim-hp-shot{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="228" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">One hit</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">acquisition only</tspan></text><circle cx="190" cy="140" r="30" class="fig-target"/><circle cx="190" cy="140" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M177 140H186M194 140H203M190 127V136M190 144V153" class="fig-ink-stroke" stroke-width="2.2"/><rect x="179.0" y="196" width="22" height="10" rx="5" class="fig-grid-fill"/><rect x="179.0" y="196" width="22" height="10" rx="5" class="fig-accent-fill aim-hp-shot" style="animation-delay:0.00s"/><text x="190" y="232" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">1 hit to kill</text><rect x="392" y="46" width="356" height="228" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Three hits</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">acquire, then stay on it</tspan></text><circle cx="570" cy="140" r="30" class="fig-target"/><circle cx="570" cy="140" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M557 140H566M574 140H583M570 127V136M570 144V153" class="fig-ink-stroke" stroke-width="2.2"/><rect x="527.0" y="196" width="22" height="10" rx="5" class="fig-grid-fill"/><rect x="527.0" y="196" width="22" height="10" rx="5" class="fig-accent-fill aim-hp-shot" style="animation-delay:0.00s"/><rect x="559.0" y="196" width="22" height="10" rx="5" class="fig-grid-fill"/><rect x="559.0" y="196" width="22" height="10" rx="5" class="fig-accent-fill aim-hp-shot" style="animation-delay:0.45s"/><rect x="591.0" y="196" width="22" height="10" rx="5" class="fig-grid-fill"/><rect x="591.0" y="196" width="22" height="10" rx="5" class="fig-accent-fill aim-hp-shot" style="animation-delay:0.90s"/><text x="570" y="232" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">3 hits to kill</text></svg>
