<svg viewBox="0 0 760 300" class="fig-fit" role="img" aria-labelledby="fig-profileswap-title"><title id="fig-profileswap-title">Three steps lighting in turn: a bot running a Mimic dodge profile, taking damage, and being moved to a profile that uses Ignore. A dashed branch notes that where no such profile exists the replacement is picked at random.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimSwpStep{0%{opacity:0.2}6%{opacity:1}34%{opacity:1}40%{opacity:0.2}100%{opacity:0.2}}.aim-swp-step{opacity:0.2;animation-name:aimSwpStep;animation-iteration-count:infinite;animation-duration:6.4s}@media (prefers-reduced-motion:reduce){.aim-swp-step{opacity:1;animation:none!important}}</style><defs><marker id="fig-swp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="fig-grid-fill"/></marker></defs><rect x="12" y="46" width="736" height="224" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">A damage reaction ejects the bot</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">only under Mimic or Oppose</tspan></text><g class="aim-swp-step" style="animation-delay:0.00s"><rect x="48" y="104" width="190" height="66" rx="10" class="fig-panel fig-ink-stroke" stroke-width="2"/><text x="143" y="132" class="fig-ink" text-anchor="middle" font-size="14" font-weight="700">Mimic profile</text><text x="143" y="154" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">it is answering you</text></g><path d="M246 137H264" class="fig-grid-stroke" stroke-width="2" marker-end="url(#fig-swp-arrow)"/><g class="aim-swp-step" style="animation-delay:1.02s"><rect x="272" y="104" width="190" height="66" rx="10" class="fig-panel fig-tense-stroke" stroke-width="2"/><text x="367" y="132" class="fig-tense-fill" text-anchor="middle" font-size="14" font-weight="700">takes damage</text><text x="367" y="154" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">reaction fires</text></g><path d="M470 137H488" class="fig-grid-stroke" stroke-width="2" marker-end="url(#fig-swp-arrow)"/><g class="aim-swp-step" style="animation-delay:2.05s"><rect x="496" y="104" width="190" height="66" rx="10" class="fig-panel fig-balanced-stroke" stroke-width="2"/><text x="591" y="132" class="fig-balanced-fill" text-anchor="middle" font-size="14" font-weight="700">an Ignore profile</text><text x="591" y="154" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">preferred</text></g><g><path d="M591 176V212H400" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#fig-swp-arrow)"/><text x="392" y="216" class="fig-muted" text-anchor="end" font-size="13" font-weight="600">none available? it picks at random</text></g></svg>
