<svg viewBox="0 0 760 300" class="fig-fit" role="img" aria-labelledby="fig-tradeoff-title"><title id="fig-tradeoff-title">A curve of accuracy against pace. It stays high while pace is low, then falls away steeply. A marker rides along it, and a band over the middle marks the range where accuracy is worth building before pace is pushed further.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>.aim-trd-anim{animation-timing-function:linear;animation-iteration-count:infinite;animation-duration:6.0s}@media (prefers-reduced-motion:reduce){.aim-trd-anim{animation-play-state:paused;animation-delay:-3.72s!important}}@keyframes aimTrdRide{0%{transform:translate(0.0px,-142.9px)}2.5%{transform:translate(14.1px,-142.8px)}5%{transform:translate(28.2px,-142.7px)}7.5%{transform:translate(42.3px,-142.4px)}10%{transform:translate(56.4px,-141.9px)}12.5%{transform:translate(70.5px,-141.4px)}15%{transform:translate(84.6px,-140.7px)}17.5%{transform:translate(98.7px,-139.8px)}20%{transform:translate(112.8px,-138.8px)}22.5%{transform:translate(126.9px,-137.7px)}25%{transform:translate(141.0px,-136.4px)}27.5%{transform:translate(155.1px,-135.0px)}30%{transform:translate(169.2px,-133.4px)}32.5%{transform:translate(183.3px,-131.7px)}35%{transform:translate(197.4px,-129.8px)}37.5%{transform:translate(211.5px,-127.8px)}40%{transform:translate(225.6px,-125.6px)}42.5%{transform:translate(239.7px,-123.2px)}45%{transform:translate(253.8px,-120.7px)}47.5%{transform:translate(267.9px,-118.0px)}50%{transform:translate(282.0px,-115.2px)}52.5%{transform:translate(296.1px,-112.2px)}55%{transform:translate(310.2px,-109.1px)}57.5%{transform:translate(324.3px,-105.