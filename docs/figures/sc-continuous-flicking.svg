<svg viewBox="0 0 600 178" class="fig-fit" role="img" aria-labelledby="fig-sc-continuous-flicking-title"><title id="fig-sc-continuous-flicking-title">Four flicks across four targets at unequal distances. The crosshair barely rests between them, and each gap lasts as long as its own flick needs rather than as long as a beat allows.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimTecContinuousFlickingSweep{0%{transform:translate(0,0)}100%{transform:translate(484px,0)}}@keyframes aimTecContinuousFlickingHit{0%{opacity:0;transform:scale(.35)}4%{opacity:.95;transform:scale(1)}18%{opacity:0;transform:scale(1.85)}100%{opacity:0;transform:scale(1.85)}}.aim-tec-continuous-flicking-m{animation-name:aimTecContinuousFlickingHit;fill:none;stroke-width:2.4;opacity:0}@keyframes aimTecContinuousFlickingFade{0%{opacity:0}2.93%{opacity:1}92.7%{opacity:1}96.6%{opacity:0}100%{opacity:0}}@keyframes aimTecContinuousFlickingGo{0%{transform:translate(0px,0)}2.632%{transform:translate(23px,0)}5.263%{transform:translate(46px,0)}7.895%{transform:translate(68px,0)}10.53%{transform:translate(86px,0)}13.16%{transform:translate(99px,0)}15.79%{transform:translate(107px,0)}18.42%{transform:translate(108px,0)}21.05%{transform:translate(145px,0)}23.68%{transform:translate(187px,0)}26.32%{transform:translate(228px,0)}28.95%{transform:translate(267px,0)}31.58%{transform:translate(302px,0)}34.21%{transform:translate(331px,0)}36.84%{transform:translate(355px,0)}39.47%{transform:translate(370px,0)}42.11%{transform:translate(378px,0)}44.74%{transform:translate(372px,0)}47.37%{transform:translate(341px,0)}50%{transform:translate(310px,0)}52.63%{transform:translate(281px,0)}55.26%{transform:translate(255px,0)}57.89%{transform:translate(234px,0)}60.53%{transform:translate(218px,0)}63.16%{transform:translate(210px,0)}65.79%{transform:translate(208px,0)}68.42%{transform:translate(241px,0)}71.05%{transform:translate(280px,0)}73.68%{transform:translate(318px,0)}76.32%{transform:translate(353px,0)}78.95%{transform:translate(385px,0)}81.58%{transform:translate(411px,0)}84.21%{transform:translate(432px,0)}86.84%{transform:translate(444px,0)}89.47%{transform:translate(448px,0)}100%{transform:translate(448px,0)}}.aim-tec-continuous-flicking,.aim-tec-continuous-flicking-m{animation-duration:4.09s;animation-timing-function:linear;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){.aim-tec-continuous-flicking{animation-play-state:paused;animation-delay:-1.26s!important}.aim-tec-continuous-flicking-m{animation:none!important;opacity:1!important}}</style><rect x="8" y="8" width="584" height="162" rx="12" class="fig-panel"/><text x="24" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Continuous flicking</tspan></text><path d="M96 71V62H544V71" class="fig-grid-stroke" stroke-width="1.6" fill="none"/><text x="320.0" y="55" class="fig-muted fig-phase" text-anchor="middle" font-size="12" font-weight="600">one run, no stops</text><path d="M64 96H566" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><path d="M96 87v18" class="fig-grid-stroke" stroke-width="2"/><g class="fig-target"><circle cx="204" cy="96" r="11"/><circle cx="474" cy="96" r="11"/><circle cx="304" cy="96" r="11"/><circle cx="544" cy="96" r="11"/></g><g class="fig-muted fig-phase" text-anchor="middle" font-size="11" font-weight="600"><text x="204" y="118">1</text><text x="474" y="118">2</text><text x="304" y="118">3</text><text x="544" y="118">4</text></g><rect x="76" y="126" width="484" height="16" rx="8" class="fig-grid-fill" opacity="0.16"/><g class="fig-balanced-fill" opacity="0.9"><rect x="76" y="126" width="82.6" height="16" rx="5"/><rect x="166.6" y="126" width="115.4" height="16" rx="5"/><rect x="290" y="126" width="98.1" height="16" rx="5"/><rect x="396.1" y="126" width="110.9" height="16" rx="5"/></g><g class="fig-balanced-fill" opacity="0.32"><rect x="160.1" y="126" width="5" height="16" rx="5"/><rect x="283.5" y="126" width="5" height="16" rx="5"/><rect x="389.6" y="126" width="5" height="16" rx="5"/><rect x="508.5" y="126" width="5" height="16" rx="5"/></g><g class="aim-tec-continuous-flicking" style="animation-name:aimTecContinuousFlickingSweep"><path d="M76 121v26" class="fig-ink-stroke" stroke-width="1.5" opacity="0.4"/></g><text x="76" y="160" class="fig-muted fig-caption" text-anchor="start" font-size="12" font-weight="600">the gaps are set by where the targets are, not by a beat</text><g class="fig-balanced-stroke"><circle cx="204" cy="96" r="15" class="aim-tec-continuous-flicking-m" style="animation-delay:-3.38s;transform-origin:204px 96px"/><circle cx="474" cy="96" r="15" class="aim-tec-continuous-flicking-m" style="animation-delay:-2.34s;transform-origin:474px 96px"/><circle cx="304" cy="96" r="15" class="aim-tec-continuous-flicking-m" style="animation-delay:-1.44s;transform-origin:304px 96px"/><circle cx="544" cy="96" r="15" class="aim-tec-continuous-flicking-m" style="animation-delay:-0.44s;transform-origin:544px 96px"/></g><g class="aim-tec-continuous-flicking" style="animation-name:aimTecContinuousFlickingFade"><g class="aim-tec-continuous-flicking" style="animation-name:aimTecContinuousFlickingGo"><circle cx="96.0" cy="96" r="8" class="fig-balanced-stroke" stroke-width="2.2" fill="none"/><path d="M83.0 96H92.0M100.0 96H109.0M96.0 83V92M96.0 100V109" class="fig-balanced-stroke" stroke-width="2.2"/></g></g></svg>
