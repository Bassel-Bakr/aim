ames aimScn4swsHit{0%{opacity:0}3%{opacity:1}100%{opacity:1}}.aim-scn-4sws-hit{opacity:0;stroke-width:2;fill:none;animation-name:aimScn4swsHit;animation-duration:2.99s;animation-timing-function:linear;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){.aim-scn-4sws{animation-play-state:paused;animation-delay:-0.65s!important}.aim-scn-4sws-hit{opacity:1;animation:none!important}}</style><rect x="12" y="34" width="576" height="138" rx="12" class="fig-panel"/><text x="28" y="24"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Wide wall, few small targets</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">4 small, wide</tspan></text><polygon points="70.7 130.7 323.5 73.2 523.7 126.1 331.5 117.1" class="fig-accent-stroke" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7"/><circle cx="70.7" cy="130.7" r="7" class="fig-target"/><circle cx="323.5" cy="73.2" r="7" class="fig-target"/><circle cx="523.7" cy="126.1" r="7" class="fig-target"/><circle cx="331.5" cy="117.1" r="7" class="fig-target"/><circle cx="70.7" cy="130.7" r="11.5" class="fig-accent-stroke aim-scn-4sws-hit" style="animation-delay:0.58s"/><circle cx="323.5" cy="73.2" r="11.5" class="fig-accent-stroke aim-scn-4sws-hit" style="animation-delay:1.33s"/><circle cx="523.7" cy="126.1" r="11.5" class="fig-accent-stroke aim-scn-4sws-hit" style="animation-delay:2.08s"/><circle cx="331.5" cy="117.1" r="11.5" class="fig-accent-stroke aim-scn-4sws-hit" style="animation-delay:2.83s"/><g class="aim-scn-4sws"><circle cx="331.4587059309549" cy="117.12844483194604" r="8" class="fig-accent-stroke" stroke-width="2.2" fill="none"/><path d="M318.4587059309549 117.12844483194604H327.4587059309549M335.4587059309549 117.12844483194604H344.4587059309549M331.4587059309549 104.12844483194604V113.12844483194604M331.4587059309549 121.12844483194604V130.12844483194604" class="fig-accent-stroke" stroke-width="2.2"/></g></