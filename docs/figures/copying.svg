<svg viewBox="0 0 760 280" class="fig-fit" role="img" aria-labelledby="fig-copying-title"><title id="fig-copying-title">An existing scenario on the left. Unpacking it produces a character profile, a bot profile and a dodge profile. Replacing one of them produces your own scenario on the right.</title><defs><marker id="fig-copy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="fig-grid-fill"/></marker></defs><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style></style><rect x="12" y="46" width="736" height="208" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Every scenario starts as a copy</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">the editor offers no blank one</tspan></text><rect x="44" y="110" width="150" height="66" rx="10" class="fig-grid-stroke" stroke-width="2" fill="none"/><text x="119" y="138" class="fig-ink" text-anchor="middle" font-size="14" font-weight="700">Existing</text><text x="119" y="160" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">scenario</text><path d="M202 143H262" class="fig-grid-stroke" stroke-width="2" marker-end="url(#fig-copy-arrow)"/><text x="232" y="124" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">unpack</text><g><rect x="276" y="96" width="150" height="32" rx="8" class="fig-panel fig-grid-stroke" stroke-width="2"/><text x="351" y="112" class="fig-muted" text-anchor="middle" font-size="13" font-weight="600" dominant-baseline="central">character</text></g><g><rect x="276" y="136" width="150" height="32" rx="8" class="fig-panel fig-grid-stroke" stroke-width="2"/><text x="351" y="152" class="fig-muted" text-anchor="middle" font-size="13" font-weight="600" dominant-baseline="central">bot</text></g><g><rect x="276" y="176" width="150" height="32" rx="8" class="fig-panel fig-grid-stroke" stroke-width="2"/><text x="351" y="192" class="fig-muted" text-anchor="middle" font-size="13" font-weight="600" dominant-baseline="central">dodge</text></g><path d="M436 143H496" class="fig-grid-stroke" stroke-width="2" marker-end="url(#fig-copy-arrow)"/><text x="466" y="124" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">replace</text><g><rect x="510" y="110" width="176" height="66" rx="10" class="fig-panel fig-accent-stroke" stroke-width="2.4"/><text x="598" y="138" class="fig-accent-text" text-anchor="middle" font-size="14" font-weight="700">Your scenario</text><text x="598" y="160" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">one profile changed</text></g></svg>
