<svg viewBox="0 0 760 280" class="fig-fit" role="img" aria-labelledby="fig-interrupt-title"><title id="fig-interrupt-title">Two bars of the same length, each a sixty second run. The first is continuous aiming. The second is broken by three blocks of ability time, which the drill is not measuring aim during.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimIntFill{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}.aim-int-bar{transform-box:fill-box;transform-origin:left center;animation-name:aimIntFill;animation-iteration-count:infinite;animation-duration:6.0s;animation-timing-function:linear}@media (prefers-reduced-motion:reduce){.aim-int-bar{animation:none!important;transform:none!important}}</style><rect x="12" y="46" width="736" height="208" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Sixty seconds, twice</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">one of them is not all aiming</tspan></text><text x="60" y="92" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Aim only</text><rect x="60" y="108" width="640" height="34" rx="6" class="fig-grid-fill" opacity="0.35"/><rect x="60" y="108" width="640" height="34" rx="6" class="fig-balanced-fill" opacity="0.5"/><rect x="60" y="108" width="640" height="34" rx="6" class="fig-accent-fill aim-int-bar" opacity="0.18"/><text x="60" y="170" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">With an ability</text><rect x="60" y="186" width="640" height="34" rx="6" class="fig-grid-fill" opacity="0.35"/><rect x="60" y="186" width="640" height="34" rx="6" class="fig-balanced-fill" opacity="0.5"/><rect x="200.8" y="186" width="64.0" height="34" class="fig-tense-fill" opacity="0.85"/><rect x="392.8" y="186" width="64.0" height="34" class="fig-tense-fill" opacity="0.85"/><rect x="572.0" y="186" width="64.0" height="34" class="fig-tense-fill" opacity="0.85"/><rect x="60" y="186" width="640" height="34" rx="6" class="fig-accent-fill aim-int-bar" opacity="0.18"/><text x="400" y="258" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">red is time the drill is not measuring your aim</text></svg>
