<svg viewBox="0 0 600 180" class="fig-fit" role="img" aria-labelledby="fig-sc-create-clusters-title"><title id="fig-sc-create-clusters-title">Six targets, three loose and three sitting close together. The crosshair takes the loose ones first, a ring closes round the three that are left, and those fall in three short hops. Every dot is one tick of one clock, so where the dots crowd the crosshair was slow.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimSym2Runs7{0%{transform:translate(0px,0px)}2.941%{transform:translate(14px,-6px)}5.882%{transform:translate(39px,-18px)}8.824%{transform:translate(52px,-24px)}14.71%{transform:translate(52px,-24px)}17.65%{transform:translate(73px,-14px)}20.59%{transform:translate(113px,6px)}23.53%{transform:translate(150px,24px)}26.47%{transform:translate(162px,30px)}29.41%{transform:translate(162px,30px)}32.35%{transform:translate(163px,29px)}35.29%{transform:translate(190px,16px)}38.24%{transform:translate(233px,-6px)}41.18%{transform:translate(272px,-25px)}44.12%{transform:translate(286px,-32px)}47.06%{transform:translate(286px,-32px)}50%{transform:translate(287px,-32px)}52.94%{transform:translate(313px,-28px)}55.88%{transform:translate(355px,-21px)}58.82%{transform:translate(388px,-15px)}61.76%{transform:translate(394px,-14px)}64.71%{transform:translate(394px,-14px)}67.65%{transform:translate(397px,-12px)}70.59%{transform:translate(415px,1px)}73.53%{transform:translate(428px,10px)}79.41%{transform:translate(428px,10px)}82.35%{transform:translate(437px,2px)}85.29%{transform:translate(454px,-14px)}88.24%{transform:translate(460px,-20px)}100%{transform:translate(460px,-20px)}}@ke