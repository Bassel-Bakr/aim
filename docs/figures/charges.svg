<svg viewBox="0 0 760 280" class="fig-fit" role="img" aria-labelledby="fig-charges-title"><title id="fig-charges-title">Two rows of ability charges drawn as rings. In the first a single charge is spent and stays empty. In the second one of three is spent and an empty ring fills again as the charge timer returns it.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimChgUse{0%{opacity:1}24%{opacity:1}28%{opacity:0.2}100%{opacity:0.2}}.aim-chg-spent{animation-name:aimChgUse;animation-iteration-count:infinite;animation-duration:6.0s}@keyframes aimChgBack{0%{opacity:0.2}62%{opacity:0.2}70%{opacity:1}100%{opacity:1}}.aim-chg-back{opacity:0.2;animation-name:aimChgBack;animation-iteration-count:infinite;animation-duration:6.0s}@media (prefers-reduced-motion:reduce){.aim-chg-spent,.aim-chg-back{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="204" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">One charge</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">one interruption, then nothing</tspan></text><circle cx="190.0" cy="128" r="16" class="fig-grid-stroke" stroke-width="2" fill="none"/><circle cx="190.0" cy="128" r="11" class="fig-accent-fill aim-chg-spent"/><text x="190" y="176" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">1 of 1 on spawn</text><text x="190" y="250" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">spent, and gone</text><rect x="392" y="46" width="356" height="204" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Three charges</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">three, and a timer refilling them</tspan></text><circle cx="524.0" cy="128" r="16" class="fig-grid-stroke" stroke-width="2" fill="none"/><circle cx="524.0" cy="128" r="11" class="fig-accent-fill aim-chg-spent"/><circle cx="570.0" cy="128" r="16" class="fig-grid-stroke" stroke-width="2" fill="none"/><circle cx="570.0" cy="128" r="11" class="fig-accent-fill "/><circle cx="616.0" cy="128" r="16" class="fig-grid-stroke" stroke-width="2" fill="none"/><circle cx="616.0" cy="128" r="11" class="fig-accent-fill aim-chg-back" opacity="0.2"/><text x="570" y="176" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">2 of 3 on spawn</text><text x="570" y="250" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">spent, and the timer brings one back</text></svg>
