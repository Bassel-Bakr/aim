<svg viewBox="0 0 760 290" class="fig-fit" role="img" aria-labelledby="fig-deliberate-title"><title id="fig-deliberate-title">Three steps in a row, lighting one after another: a defined goal, feedback on each attempt, and getting harder as you improve. A return arrow runs from the third back to the first, labelled as a new goal rather than more of the same.</title><defs><marker id="fig-del-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="fig-grid-fill"/></marker></defs><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimDelStep{0%{opacity:0.22}8%{opacity:1}30%{opacity:1}38%{opacity:0.22}100%{opacity:0.22}}.aim-del-step{opacity:0.22;animation-name:aimDelStep;animation-iteration-count:infinite;animation-duration:6.0s}@media (prefers-reduced-motion:reduce){.aim-del-step{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="736" height="214" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">What makes practice purposeful</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">drop a step and it is reps</tspan></text><g class="aim-del-step" style="animation-delay:0.00s"><rect x="56" y="100" width="188" height="66" rx="10" class="fig-panel fig-ink-stroke" stroke-width="2"/><text x="150" y="128" class="fig-ink" text-anchor="middle" font-size="14" font-weight="700">a defined goal</text><text x="150" y="150" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">one demand, named</text></g><path d="M252 133H272" class="fig-grid-stroke" stroke-width="2" marker-end="url(#fig-del-arrow)"/><g class="aim-del-step" style="animation-delay:1.20s"><rect x="280" y="100" width="188" height="66" rx="10" class="fig-panel fig-ink-stroke" stroke-width="2"/><text x="374" y="128" class="fig-ink" text-anchor="middle" font-size="14" font-weight="700">feedback each attempt</text><text x="374" y="150" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">a stat or a replay</text></g><path d="M476 133H496" class="fig-grid-stroke" stroke-width="2" marker-end="url(#fig-del-arrow)"/><g class="aim-del-step" style="animation-delay:2.40s"><rect x="504" y="100" width="188" height="66" rx="10" class="fig-panel fig-ink-stroke" stroke-width="2"/><text x="598" y="128" class="fig-ink" text-anchor="middle" font-size="14" font-weight="700">harder as you improve</text><text x="598" y="150" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">or it stops teaching</text></g><path d="M694 174V212H150V174" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#fig-del-arrow)"/><text x="420" y="232" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">then a new goal, not more of the same</text></svg>
