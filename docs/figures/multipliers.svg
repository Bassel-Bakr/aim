<svg viewBox="0 0 760 300" class="fig-fit" role="img" aria-labelledby="fig-multipliers-title"><title id="fig-multipliers-title">Two score calculations from the same subtotal of one thousand. Applying one multiplier gives eight hundred. Applying accuracy and damage efficiency together gives six hundred and forty, and is marked as advised against.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimMulStep{0%{opacity:0}6%{opacity:1}100%{opacity:1}}.aim-mul-step{opacity:0;animation-name:aimMulStep;animation-iteration-count:infinite;animation-duration:6.4s}@keyframes aimMulWarn{0%{opacity:0}62%{opacity:0}70%{opacity:1}100%{opacity:1}}.aim-mul-warn{opacity:0;animation-name:aimMulWarn;animation-iteration-count:infinite;animation-duration:6.4s}@media (prefers-reduced-motion:reduce){.aim-mul-step,.aim-mul-warn{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="224" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">One multiplier</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">misses charged once</tspan></text><g class="aim-mul-step" style="animation-delay:0.00s"><text x="52" y="104" class="fig-ink" text-anchor="start" font-size="16" font-weight="700">1000</text><text x="142" y="104" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">subtotal</text></g><g class="aim-mul-step" style="animation-delay:0.50s"><text x="52" y="148" class="fig-ink" text-anchor="start" font-size="16" font-weight="700">x 0.8</text><text x="142" y="148" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">accuracy</text></g><path d="M48 174H312" class="fig-grid-stroke" stroke-width="2"/><g class="aim-mul-step" style="animation-delay:1.00s"><text x="52" y="204" class="fig-balanced-fill" text-anchor="start" font-size="20" font-weight="700">800</text></g><rect x="392" y="46" width="356" height="224" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Both checked</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">the same misses, twice</tspan></text><g class="aim-mul-step" style="animation-delay:0.00s"><text x="432" y="104" class="fig-ink" text-anchor="start" font-size="16" font-weight="700">1000</text><text x="522" y="104" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">subtotal</text></g><g class="aim-mul-step" style="animation-delay:0.50s"><text x="432" y="148" class="fig-ink" text-anchor="start" font-size="16" font-weight="700">x 0.8</text><text x="522" y="148" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">accuracy</text></g><g class="aim-mul-step" style="animation-delay:1.00s"><text x="432" y="192" class="fig-ink" text-anchor="start" font-size="16" font-weight="700">x 0.8</text><text x="522" y="192" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">damage efficiency</text></g><path d="M428 218H692" class="fig-grid-stroke" stroke-width="2"/><g class="aim-mul-step" style="animation-delay:1.50s"><text x="432" y="248" class="fig-tense-fill" text-anchor="start" font-size="20" font-weight="700">640</text></g><g class="aim-mul-warn"><text x="570" y="266" class="fig-tense-fill" text-anchor="middle" font-size="13" font-weight="700">the editor advises against this</text></g></svg>
