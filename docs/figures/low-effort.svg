<svg viewBox="0 0 760 290" class="fig-fit" role="img" aria-labelledby="fig-loweffort-title"><title id="fig-loweffort-title">Two uploads of the same original scenario. The one that changed only the title is marked removed. The one that added a demand the original lacked is marked as staying.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimLowIn{0%{opacity:0}6%{opacity:1}100%{opacity:1}}.aim-low-in{opacity:0;animation-name:aimLowIn;animation-iteration-count:infinite;animation-duration:6.0s}@media (prefers-reduced-motion:reduce){.aim-low-in{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="218" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Renamed only</tspan></text><g class="aim-low-in" style="animation-delay:0.00s"><rect x="40" y="88" width="300" height="48" rx="9" class="fig-panel fig-grid-stroke" stroke-width="2"/><text x="190" y="108" class="fig-muted" text-anchor="middle" font-size="12" font-weight="600">the original</text><text x="190" y="126" class="fig-muted" text-anchor="middle" font-size="11" font-weight="500">someone else's work</text></g><g class="aim-low-in" style="animation-delay:0.50s"><rect x="40" y="150" width="300" height="48" rx="9" class="fig-panel fig-grid-stroke" stroke-width="2"/><text x="190" y="170" class="fig-muted" text-anchor="middle" font-size="12" font-weight="600">your upload</text><text x="190" y="188" class="fig-muted" text-anchor="middle" font-size="11" font-weight="500">nothing but the title</text></g><g><rect x="120" y="218" width="140" height="36" rx="9" class="fig-panel fig-tense-stroke" stroke-width="2"/><text x="190" y="236" class="fig-tense-fill" text-anchor="middle" font-size="14" font-weight="700" dominant-baseline="central">removed</text></g><rect x="392" y="46" width="356" height="218" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Actually changed</tspan></text><g class="aim-low-in" style="animation-delay:0.00s"><rect x="420" y="88" width="300" height="48" rx="9" class="fig-panel fig-grid-stroke" stroke-width="2"/><text x="570" y="108" class="fig-muted" text-anchor="middle" font-size="12" font-weight="600">the original</text><text x="570" y="126" class="fig-muted" text-anchor="middle" font-size="11" font-weight="500">someone else's work</text></g><g class="aim-low-in" style="animation-delay:0.50s"><rect x="420" y="150" width="300" height="48" rx="9" class="fig-panel fig-grid-stroke" stroke-width="2"/><text x="570" y="170" class="fig-muted" text-anchor="middle" font-size="12" font-weight="600">your upload</text><text x="570" y="188" class="fig-muted" text-anchor="middle" font-size="11" font-weight="500">a demand the original lacked</text></g><g><rect x="500" y="218" width="140" height="36" rx="9" class="fig-panel fig-balanced-stroke" stroke-width="2"/><text x="570" y="236" class="fig-balanced-fill" text-anchor="middle" font-size="14" font-weight="700" dominant-baseline="central">stays</text></g></svg>
