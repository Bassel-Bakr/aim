<svg viewBox="0 0 600 180" class="fig-fit" role="img" aria-labelledby="fig-sc-smooth-means-pacing-title"><title id="fig-sc-smooth-means-pacing-title">The crosshair covers the distance in even steps instead of one burst, so its trail dots sit at almost equal spacing all the way across and the last stretch is a crawl. The shot goes only once it has stopped. Every dot is one tick of one clock, so where the dots crowd the crosshair was slow.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimSym2Runs1{0%{transform:translate(0px,0px)}2.381%{transform:translate(14.5px,0px)}4.762%{transform:translate(51.5px,0px)}7.143%{transform:translate(101.6px,0px)}9.524%{transform:translate(155.1px,0px)}11.9%{transform:translate(202.5px,0px)}14.29%{transform:translate(234.2px,0px)}16.67%{transform:translate(242.2px,0px)}19.05%{transform:translate(246.9px,0px)}21.43%{transform:translate(256.3px,0px)}23.81%{transform:translate(268.8px,0px)}26.19%{transform:translate(282.7px,0px)}28.57%{transform:translate(296.6px,0px)}30.95%{transform:translate(308.7px,0px)}33.33%{transform:translate(317.4px,0px)}35.71%{transform:translate(321.3px,0px)}38.1%{transform:translate(322px,0px)}40.48%{transform:translate(324.3px,0px)}42.86%{transform:translate(327.8px,0px)}45.24%{transform:translate(332.2px,0px)}47.62%{transform:translate(337.2px,0px)}50%{transform:translate(342.4px,0px)}52.38%{transform:translate(347.4px,0px)}54.76%{transform:translate(351.9px,0px)}57.14%{transform:translate(355.6px,0px)}59.52%{transform:translate(358.1px,0px)}61.9%{transform:translate(359.1px,0px)}64.29%{transform:translate(359.5px,0px)}66.67%{transform:translate(360.5px,0px)}69.05%{transform:translate(362.1px,0px)}71.43%{transform:translate(364.1px,0px)}73.81%{transform:translate(366.4px,0px)}76.19%{transform:translate(368.7px,0px)}78.57%{transform:translate(371.1px,0px)}80.95%{transform:translate(373.4px,0px)}83.33%{transform:translate(375.3px,0px)}85.71%{transform:translate(376.8px,0px)}88.1%{transform:translate(377.7px,0px)}90.48%{transform:translate(378px,0px)}100%{transform:translate(378px,0px)}}@keyframes aimSym2Shots1{0%{opacity:0}96%{opacity:0}96.5%{opacity:1}100%{opacity:1}}.aim-sym2-run,.aim-sym2-take,.aim-sym2-mark{animation-duration:3.8s;animation-timing-function:linear;animation-iteration-count:infinite;animation-delay:-1.6s}@media(prefers-reduced-motion:reduce){.aim-sym2-run,.aim-sym2-take{animation-play-state:paused}.aim-sym2-mark{animation:none!important;opacity:1!important}}</style><rect x="1" y="1" width="598" height="178" rx="12" class="fig-panel"/><text x="22" y="28"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Smooth means steady pacing</tspan></text><text x="22" y="47" class="fig-muted fig-note" text-anchor="start" font-size="13" font-weight="500">an even drag the whole way, which is what gets called smooth</text><path d="M72 106H540" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><path d="M92 97v18" class="fig-grid-stroke" stroke-width="1.5"/><path d="M92 98L159.2 98L280 98L334.2 98L352.2 98L384.1 98L409.4 98L414.6 98L422.7 98L434.4 98L445.3 98L451 98L452.5 98L456.8 98L462.3 98L467.3 98L469.9 98L470 98L470 98" class="fig-accent-stroke" stroke-width="1.5" fill="none" opacity=".28" stroke-linejoin="round"/><g class="fig-accent-fill" opacity=".5"><circle cx="159.2" cy="98" r="2.2"/><circle cx="280" cy="98" r="2.2"/><circle cx="334.2" cy="98" r="2.2"/><circle cx="352.2" cy="98" r="2.2"/><circle cx="384.1" cy="98" r="2.2"/><circle cx="409.4" cy="98" r="2.2"/><circle cx="414.6" cy="98" r="2.2"/><circle cx="422.7" cy="98" r="2.2"/><circle cx="434.4" cy="98" r="2.2"/><circle cx="