<svg viewBox="0 0 760 372" class="fig-fit" role="img" aria-labelledby="fig-bdodgefields-title"><title id="fig-bdodgefields-title">Bot Dodge tab, every field. One strip per field, each naming the setting, describing it, and demonstrating a low and a high state side by side.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimbdodgefields0o0{0%{opacity:0.15}12%{opacity:1}100%{opacity:1}}.aim-bdodgefields0-0{opacity:0.15;animation-name:aimbdodgefields0o0;animation-duration:4.0s;animation-iteration-count:infinite}@keyframes aimbdodgefields0o1{0%{opacity:0.15}12%{opacity:1}100%{opacity:1}}.aim-bdodgefields0-1{opacity:0.15;animation-name:aimbdodgefields0o1;animation-duration:4.0s;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){[class*='aim-bdodgefields0-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@media (prefers-reduced-motion:reduce){[class*='aim-bdodgefields1-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}</style><text x="12" y="26" class="fig-ink" text-anchor="start" font-size="16" font-weight="700">Bot Dodge tab, every field</text><text x="12" y="44" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">The dodges attached, and at what weight.</text><g transform="translate(0,52)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Dodge Profile</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">Which dodge profile this bot may</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">use. This is where all of a</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">target's motion comes from.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">nothing chosen</text><rect x="320.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="324.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-bdodgefields0-0" style="animation-delay:0.00s"/><rect x="354.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="388.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="422.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">a dodge profile</text><rect x="566.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="570.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-bdodgefields0-1" style="animation-delay:0.00s"/><rect x="600.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="604.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-bdodgefields0-1" style="animation-delay:0.20s"/><rect x="634.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="638.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-bdodgefields0-1" style="animation-delay:0.40s"/><rect x="668.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/></g><g transform="translate(0,212)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Dodge Weighting</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">How often this dodge is picked</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">against the others attached</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">here. Weighted evenly, which</text><text x="12" y="120" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">drill you get is luck.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">one dodge, mostly</text><rect x="314.0" y="62" width="140" height="28" rx="6" class="fig-grid-fill" opacity="0.4"/><rect x="314.0" y="62" width="126" height="28" rx="6" class="fig-accent-fill"/><text x="377.0" y="81" class="fig-muted" text-anchor="middle" font-size="11" font-weight="700">90%</text><text x="384.0" y="114" class="fig-muted" text-anchor="middle" font-size="10" font-weight="600">one profile, mostly</text><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">a coin flip</text><rect x="560.0" y="62" width="140" height="28" rx="6" class="fig-grid-fill" opacity="0.4"/><rect x="560.0" y="62" width="70" height="28" rx="6" class="fig-accent-fill"/><text x="595.0" y="81" class="fig-muted" text-anchor="middle" font-size="11" font-weight="700">50%</text><text x="630.0" y="114" class="fig-muted" text-anchor="middle" font-size="10" font-weight="600">a coin flip each time</text></g></svg>
