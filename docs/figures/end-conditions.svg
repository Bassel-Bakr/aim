<svg viewBox="0 0 760 300" class="fig-fit" role="img" aria-labelledby="fig-endconditions-title"><title id="fig-endconditions-title">Three bars filling at once: a time limit, a kill count and a damage total. The damage bar reaches its mark first and is labelled as the condition that ends the run.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimEndFill{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}.aim-end-bar{transform-box:fill-box;transform-origin:left center;animation-name:aimEndFill;animation-iteration-count:infinite;animation-duration:6.0s;animation-timing-function:linear}@keyframes aimEndStop{0%{opacity:0}100%{opacity:1}}.aim-end-stop{opacity:0;animation-name:aimEndStop;animation-iteration-count:infinite;animation-duration:6.0s;animation-timing-function:steps(1,end)}@media (prefers-reduced-motion:reduce){.aim-end-bar{animation:none!important;transform:none!important}.aim-end-stop{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="736" height="224" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Three ways to end a run</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">the first one to fire wins</tspan></text><text x="36" y="100" class="fig-ink" text-anchor="start" font-size="13" font-weight="700">Time limit</text><text x="36" y="118" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">60 seconds</text><rect x="210" y="86" width="460" height="20" rx="6" class="fig-grid-fill" opacity="0.4"/><rect x="210" y="86" width="460.0" height="20" rx="6" class="fig-accent-fill aim-end-bar" style="animation-duration:6.00s"/><g class="aim-end-stop" style="animation-delay:6.00s"><path d="M670.0 78V114" class="fig-tense-stroke" stroke-width="3"/></g><text x="36" y="154" class="fig-ink" text-anchor="start" font-size="13" font-weight="700">End after num kills</text><text x="36" y="172" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">reached at 70%</text><rect x="210" y="140" width="460" height="20" rx="6" class="fig-grid-fill" opacity="0.4"/><rect x="210" y="140" width="322.0" height="20" rx="6" class="fig-accent-fill aim-end-bar" style="animation-duration:4.20s"/><g class="aim-end-stop" style="animation-delay:4.20s"><path d="M532.0 132V168" class="fig-tense-stroke" stroke-width="3"/></g><text x="36" y="208" class="fig-ink" text-anchor="start" font-size="13" font-weight="700">End after damage</text><text x="36" y="226" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">reached at 45%</text><rect x="210" y="194" width="460" height="20" rx="6" class="fig-grid-fill" opacity="0.4"/><rect x="210" y="194" width="207.0" height="20" rx="6" class="fig-accent-fill aim-end-bar" style="animation-duration:2.70s"/><g class="aim-end-stop" style="animation-delay:2.70s"><path d="M417.0 186V222" class="fig-tense-stroke" stroke-width="3"/></g><text x="417.0" y="266" class="fig-tense-fill" text-anchor="middle" font-size="13" font-weight="700">this one ends the run</text></svg>
