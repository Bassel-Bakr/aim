<svg viewBox="0 0 760 212" class="fig-fit" role="img" aria-labelledby="fig-sunpackfields-title"><title id="fig-sunpackfields-title">Unpack tab, every field. One strip per field, each naming the setting, describing it, and demonstrating a low and a high state side by side.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@media (prefers-reduced-motion:reduce){[class*='aim-sunpackfields0-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}</style><text x="12" y="26" class="fig-ink" text-anchor="start" font-size="16" font-weight="700">Unpack tab, every field</text><text x="12" y="44" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">Getting the profiles back out as files.</text><g transform="translate(0,52)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Unpack</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">Extracts the scenario's profiles</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">back out as files you can edit.</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">It is how you undo a change to a</text><text x="12" y="120" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">profile, and how you take one</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">it stays packed</text><rect x="314.0" y="56" width="48" height="40" rx="5" class="fig-grid-fill" opacity="0.6"/><text x="338.0" y="80" class="fig-muted" text-anchor="middle" font-size="9" font-weight="600">pack</text><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">profiles written out</text><rect x="560.0" y="56" width="48" height="40" rx="5" class="fig-grid-fill" opacity="0.6"/><text x="584.0" y="80" class="fig-muted" text-anchor="middle" font-size="9" font-weight="600">pack</text><rect x="627.0" y="60" width="18" height="26" rx="3" class="fig-cool-fill"/><rect x="653.0" y="62" width="18" height="26" rx="3" class="fig-cool-fill"/><rect x="679.0" y="64" width="18" height="26" rx="3" class="fig-cool-fill"/><path d="M612.0 76H624.0" class="fig-accent-stroke" stroke-width="2.4"/></g></svg>
