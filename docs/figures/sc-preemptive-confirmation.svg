<svg viewBox="0 0 600 194" class="fig-fit" role="img" aria-labelledby="fig-sc-preemptive-confirmation-title"><title id="fig-sc-preemptive-confirmation-title">Pre-emptive hit confirmation, drawn as the same reach run twice on one clock. The upper run lands, then hovers over the target before the shot goes. The lower run confirms as it lands and fires on arrival. The marks on the clock below are when each run takes its shots, planted as the clock passes them, so the lower row is already finished while the upper run is still working.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimRes1b3cafA{0%{transform:translate(0px,0px)}4.67%{transform:translate(2px,0px)}5.84%{transform:translate(14px,0px)}7.59%{transform:translate(45px,0px)}9.34%{transform:translate(89px,0px)}15.2%{transform:translate(267px,0px)}16.9%{transform:translate(312px,0px)}18.7%{transform:translate(344px,0px)}19.9%{transform:translate(357px,0px)}25.1%{transform:translate(365px,4px)}36.8%{transform:translate(357px,-2px)}49.1%{transform:translate(360px,0px)}72.4%{transform:translate(360px,0px)}77.1%{transform:translate(360px,0px)}100%{transform:translate(360px,0px)}}@keyframes aimRes1b3cafB{0%{transform:translate(0px,0px)}4.67%{transform:translate(2px,0px)}5.84%{transform:translate(14px,0px)}7.59%{transform:translate(45px,0px)}9.34%{transform:translate(89px,0px)}15.2%{transform:translate(267px,0px)}16.9%{transform:translate(312px,0px)}18.7%{transform:translate(344px,0px)}19.9%{transform:translate(357px,0px)}22.8%{transform:translate(362px,1px)}27.4%{transform:translate(360px,0px)}50.8%{transform:translate(360px,0px)}74.2%{transform:translate(360px,0px)}77.1%{transform:translate(360px,0px)}100%{transform:translate(360px,0px)}}@keyframes aimRes1b3cafS{0%{transform:translateX(0px)}77.08%{transform:translateX(464px)}100%{transform:translateX(464px)}}.aim-res-1b3caf{animation-duration:4.8s;animation-timing-function:linear;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){.aim-res-1b3caf{animation-play-state:paused;animation-delay:-1.23s!important}.aim-res-1b3caf-s{opacity:0}}</style><rect x="8" y="8" width="584" height="140" rx="12" class="fig-panel"/><text x="22" y="32"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Pre-emptive hit confirmation</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">confirm lag</tspan></text><path d="M78 78H474" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><g class="fig-target"><circle cx="452" cy="78" r="9"/></g><text x="22" y="78.0" class="fig-tense-fill" text-anchor="start" font-size="12" font-weight="700" dominant-baseline="central">before</text><g class="aim-res-1b3caf" style="animation-name:aimRes1b3cafA"><circle cx="92.0" cy="78.0" r="8" class="fig-tense-stroke" stroke-width="2.2" fill="none"/><path d="M79.0 78.0H88.0M96.0 78.0H105.0M92.0 65.0V74.0M92.0 82.0V91.0" class="fig-tense-stroke" stroke-width="2.2"/></g><path d="M78 124H474" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><g class="fig-target"><circle cx="452" cy="124" r="9"/></g><text x="22" y="124.0" class="fig-balanced-fill" text-anchor="start" font-size="12" font-weight="700" dominant-baseline="central">after</text><g class="aim-res-1b3caf" style="animation-name:aimRes1b3cafB"><circle cx="92.0" cy="124.0" r="8" class="fig-balanced-stroke" stroke-width="2.2" fill="none"/><path d="M79.0 124.0H88.0M96.0 124.0H105.0M92.0 111.0V120.0M92.0 128.0V137.0" class="fig-balanced-stroke" stroke-width="2.2"/></g><path d="M403 155v9" class="fig-tense-stroke" stroke-width="2.6"/><path d="M280 164v9" class="fig-balanced-stroke" 