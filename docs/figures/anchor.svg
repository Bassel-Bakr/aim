<svg viewBox="0 0 760 290" class="fig-fit" role="img" aria-labelledby="fig-anchor-title"><title id="fig-anchor-title">On the left a familiar scenario with five runs of history and today\u2019s run below its average. On the right a new scenario with a single run and nothing to compare it against. A note concludes that because the known run was low today, the new scenario\u2019s score is not evidence about its design.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimAncIn{0%{opacity:0}8%{opacity:1}100%{opacity:1}}.aim-anc-in{opacity:0;animation-name:aimAncIn;animation-iteration-count:infinite;animation-duration:5.6s}@keyframes aimAncRead{0%{opacity:0}54%{opacity:0}62%{opacity:1}100%{opacity:1}}.aim-anc-read{opacity:0;animation-name:aimAncRead;animation-iteration-count:infinite;animation-duration:5.6s}@media (prefers-reduced-motion:reduce){.aim-anc-in,.aim-anc-read{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="736" height="218" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">One session, two scenarios</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">the known one is the reading</tspan></text><circle cx="96" cy="134.0" r="5" class="fig-grid-fill"/><circle cx="130" cy="125.0" r="5" class="fig-grid-fill"/><circle cx="164" cy="138.0" r="5" class="fig-grid-fill"/><circle cx="198" cy="122.0" r="5" class="fig-grid-fill"/><circle cx="232" cy="130.0" r="5" class="fig-grid-fill"/><path d="M92 130.0H272" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="5 5" opacity="0.8"/><text x="180" y="226" class="fig-ink" text-anchor="middle" font-size="14" font-weight="700">known scenario</text><text x="180" y="246" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">five runs of history</text><g class="aim-anc-in"><circle cx="266" cy="141.0" r="8" class="fig-accent-fill"/></g><text x="266" y="226" class="fig-accent-text" text-anchor="middle" font-size="13" font-weight="700">today</text><path d="M330 90V210" class="fig-grid-stroke" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/><g class="aim-anc-in" style="animation-delay:0.7s"><circle cx="470" cy="136.0" r="8" class="fig-accent-fill"/></g><text x="470" y="226" class="fig-ink" text-anchor="middle" font-size="14" font-weight="700">new scenario</text><text x="470" y="246" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">one run, no history</text><g class="aim-anc-read"><text x="620" y="140" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">known run low today</text><text x="620" y="164" class="fig-balanced-fill" text-anchor="middle" font-size="14" font-weight="700">so the new one is not</text><text x="620" y="186" class="fig-balanced-fill" text-anchor="middle" font-size="14" font-weight="700">the design's fault</text></g></svg>
