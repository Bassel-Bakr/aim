<svg viewBox="0 0 760 372" class="fig-fit" role="img" aria-labelledby="fig-walsofields-title"><title id="fig-walsofields-title">Also Shoot, every field. One strip per field, each naming the setting, describing it, and demonstrating a low and a high state side by side.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimwalsofields0b0{0%{opacity:0;transform:translate(0,0)}6%{opacity:1;transform:translate(0,0)}54%{opacity:1;transform:translate(90px,0)}60%{opacity:0;transform:translate(90px,0)}100%{opacity:0;transform:translate(90px,0)}}.aim-walsofields0-0{opacity:0;animation-name:aimwalsofields0b0;animation-duration:4.0s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes aimwalsofields0b1{0%{opacity:0;transform:translate(0,0)}6%{opacity:1;transform:translate(0,0)}54%{opacity:1;transform:translate(90px,0)}60%{opacity:0;transform:translate(90px,0)}100%{opacity:0;transform:translate(90px,0)}}.aim-walsofields0-1{opacity:0;animation-name:aimwalsofields0b1;animation-duration:4.0s;animation-timing-function:linear;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){[class*='aim-walsofields0-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@keyframes aimwalsofields1a0{0%{transform:scaleY(1)}34%{transform:scaleY(1.0)}70%{transform:scaleY(1.0)}100%{transform:scaleY(1)}}.aim-walsofields1-0{transform-box:fill-box;transform-origin:center bottom;animation-name:aimwalsofields1a0;animation-duration:4.0s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes aimwalsofields1a1{0%{transform:scaleY(1)}34%{transform:scaleY(0.5)}70%{transfo