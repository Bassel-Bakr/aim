<svg viewBox="0 0 600 194" class="fig-fit" role="img" aria-labelledby="fig-sc-improved-overall-pacing-title"><title id="fig-sc-improved-overall-pacing-title">Improved overall pacing, drawn as the same reach run twice on one clock. The upper run parks on each target and waits there before the next flick. The lower run leaves again as soon as the shot has gone. The marks on the clock below are when each run takes its shots, planted as the clock passes them, so the lower row is already finished while the upper run is still working.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimRes92b855A{0%{transform:translateX(0px)}3.5%{transform:translateX(1px)}5.26%{transform:translateX(16px)}9.34%{transform:translateX(80px)}11.1%{transform:translateX(95px)}31%{transform:translateX(96px)}32.1%{transform:translateX(107px)}33.9%{transform:translateX(139px)}36.8%{transform:translateX(203px)}38%{transform:translateX(221px)}39.1%{transform:translateX(228px)}58.4%{transform:translateX(228px)}59.6%{transform:translateX(237px)}61.3%{transform:translateX(268px)}64.2%{transform:translateX(333px)}65.4%{transform:translateX(352px)}66.6%{transform:translateX(360px)}77.1%{transform:translateX(360px)}100%{transform:translateX(360px)}}@keyframes aimRes92b855B{0%{transform:translateX(0px)}3.5%{transform:translateX(1px)}5.26%{transform:translateX(16px)}9.34%{transform:translateX(80px)}11.1%{transform:translateX(95px)}19.3%{transform:translateX(96px)}20.4%{transform:translateX(105px)}22.2%{transform:translateX(135px)}25.1%{transform:translateX(201px)}26.3%{transform:translateX(219px)}27.4%{transform:translateX(228px)}35.6%{transform:translateX(229px)}36.8%{transform:translateX(241px)}38.5%{transform:translateX(274px)}41.5%{transform:translateX(339px)}42.6%{transform:translateX(355px)}43.8%{transform:translateX(360px)}67.2%{transform:translateX(360px)}77.1%{transform:translateX(360px)}100%{transform:translateX(360px)}}@keyframes aimRes92b855S{0%{transform:translateX(0px)}77.08%{transform:translateX(464px)}100%{transform:translateX(464px)}}.aim-res-92b855{animation-duration:4.8s;animation-timing-function:linear;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){.aim-res-92b855{animation-play-state:paused;animation-delay:-1.35s!important}.aim-res-92b855-s{opacity:0}}</style><rect x="8" y="8" width="584" height="140" rx="12" class="fig-panel"/><text x="22" y="32"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Improved overall pacing</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">gap between shots</tspan></text><path d="M78 78H474" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><g class="fig-target"><circle cx="188" cy="78" r="9"/><circle cx="320" cy="78" r="9"/><circle cx="452" cy="78" r="9"/></g><text x="22" y="78.0" class="fig-tense-fill" text-anchor="start" font-size="12" font-weight="700" dominant-baseline="central">before</text><g class="aim-res-92b855" style="animation-name:aimRes92b855A"><circle cx="92.0" cy="78.0" r="8" class="fig-tense-stroke" stroke-width="2.2" fill="none"/><path d="M79.0 78.0H88.0M96.0 78.0H105.0M92.0 65.0V74.0M92.0 82.0V91.0" class="fig-tense-stroke" stroke-width="2.2"/></g><path d="M78 124H474" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><g class="fig-target"><circle cx="188" cy="124" r="9"/><circle cx="320" cy="124" r="9"/><circle cx="452" cy="124" r="9"/></g><text x="22" y="124.0" class="fig-balanced-fill" text-anchor="start" font-size="12" font-weight="700" dominant-baseline="central">after</text><g class="aim-res-92b855" style="animation-name:aimRes92b855B"><cir