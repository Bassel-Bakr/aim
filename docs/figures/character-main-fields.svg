<svg viewBox="0 0 760 1492" class="fig-fit" role="img" aria-labelledby="fig-mainfields-title"><title id="fig-mainfields-title">Main tab, every field. One strip per field, each naming the setting, describing it, and demonstrating a low and a high state side by side.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@media (prefers-reduced-motion:reduce){[class*='aim-mainfields0-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@media (prefers-reduced-motion:reduce){[class*='aim-mainfields1-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@media (prefers-reduced-motion:reduce){[class*='aim-mainfields2-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@media (prefers-reduced-motion:reduce){[class*='aim-mainfields3-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@media (prefers-reduced-motion:reduce){[class*='aim-mainfields4-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@media (prefers-reduced-motion:reduce){[class*='aim-mainfields5-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@media (prefers-reduced-motion:reduce){[class*='aim-mainfields6-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@media (prefers-reduced-motion:reduce){[class*='aim-mainfields7-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@media (prefers-reduced-motion:reduce){[class*='aim-mainfields8-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}</style><text x="12" y="26" class="fig-ink" text-anchor="start" font-size="16" font-weight="700">Main tab, every field</text><text x="12" y="44" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">Identity, health, and the respawn timing.</text><g transform="translate(0,52)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Profile Name</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">What this character profile is</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">called. Bots and players both</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">wear one.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">unnamed</text><rect x="318.0" y="62" width="132" height="28" rx="5" class="fig-panel fig-grid-stroke" stroke-width="1.6"/><text x="384.0" y="110" class="fig-muted" text-anchor="middle" font-size="10" font-weight="500">blank</text><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">named</text><rect x="564.0" y="62" width="132" height="28" rx="5" class="fig-panel fig-grid-stroke" stroke-width="1.6"/><rect x="576.0" y="72" width="22" height="8" rx="3" class="fig-muted" opacity="0.75"/><rect x="606.0" y="72" width="18" height="8" rx="3" class="fig-muted" opacity="0.75"/><rect x="636.0" y="72" width="14" height="8" rx="3" class="fig-muted" opacity="0.75"/><text x="630.0" y="110" class="fig-muted" text-anchor="middle" font-size="10" font-weight="500">carries a name</text></g><g transform="translate(0,212)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Health</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">How much damage the character</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">takes before dying. One hit</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">makes a scenario about</text><text x="12" y="120" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">acquisition; more makes it about</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">one shot and it drops</text><rect x="314.0" y="55" width="140" height="18" rx="5" class="fig-grid-fill" opacity="0.45"/><rect x="314.0" y="55" width="140" height="18" rx="5" class="fig-tense-fill"/><path d="M320 86V102" class="fig-tense-stroke" stroke-width="2.6"/><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">several shots</text><rect x="560.0" y="55" width="140" height="18" rx="5" class="fig-grid-fill" opacity="0.45"/><rect x="560.0" y="55" width="140" height="18" rx="5" class="fig-tense-fill"/><path d="M566 86V102" class="fig-tense-stroke" stroke-width="2.6"/><path d="M592 86V102" class="fig-tense-stroke" stroke-width="2.6"/><path d="M617 86V102" class="fig-tense-stroke" stroke-width="2.6"/><path d="M643 86V102" class="fig-tense-stroke" stroke-width="2.6"/><path d="M668 86V102" class="fig-tense-stroke" stroke-width="2.6"/><text x="630.0" y="122" class="fig-muted" text-anchor="middle" font-size="10" font-weight="600">5 shots to drop it</text></g><g transform="translate(0,372)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Min Respawn Delay</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">Delay until respawn is possible.</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">Bots always use this; players</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">may press fire or jump during</text><text x="12" y="120" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">it.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">back at once</text><rect x="310.0" y="60" width="148" height="20" rx="5" class="fig-grid-fill" opacity="0.4"/><rect x="310.0" y="60" width="27" height="20" rx="5" class="fig-grid-fill" opacity="0.9"/><text x="323.32" y="94" class="fig-muted" text-anchor="middle" font-size="8" font-weight="600">cannot respawn yet</text><path d="M336.6 54V82" class="fig-accent-stroke" stroke-width="2.4"/><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">held down a while</text><rect x="556.0" y="60" width="148" height="20" rx="5" class="fig-grid-fill" opacity="0.4"/><rect x="556.0" y="60" width="107" height="20" rx="5" class="fig-grid-fill" opacity="0.9"/><text x="609.28" y="94" class="fig-muted" text-anchor="middle" font-size="8" font-weight="600">cannot respawn yet</text><path d="M662.6 54V82" class="fig-accent-stroke" stroke-width="2.4"/></g><g transform="translate(0,532)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Max Respawn Delay</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">Delay after death until the</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">player is forced to respawn.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">forced up at once</text><rect x="310.0" y="60" width="148" height="20" rx="5" class="fig-grid-fill" opacity="0.4"/><rect x="310.0" y="60" width="36" height="20" rx="5" class="fig-grid-fill" opacity="0.9"/><text x="327.76" y="94" class="fig-muted" text-anchor="middle" font-size="8" font-weight="600">your choice to wait</text><path d="M345.5 54V82" class="fig-accent-stroke" stroke-width="2.4"/><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">you may lie there</text><rect x="556.0" y="60" width="148" height="20" rx="5" class="fig-grid-fill" opacity="0.4"/><rect x="556.0" y="60" width="118" height="20" rx="5" class="fig-grid-fill" opacity="0.9"/><text x="615.2" y="94" class="fig-muted" text-anchor="middle" font-size="8" font-weight="600">your choice to wait</text><path d="M674.4 54V82" class="fig-accent-stroke" stroke-width="2.4"/></g><g transform="translate(0,692)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Respawn Anim Duration</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">How long the respawn animation</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">runs before control returns.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">control returns at once</text><rect x="310.0" y="60" width="148" height="20" rx="5" class="fig-grid-fill" opacity="0.4"/><rect x="310.0" y="60" width="24" height="20" rx="5" class="fig-grid-fill" opacity="0.9"/><text x="321.84" y="94" class="fig-muted" text-anchor="middle" font-size="8" font-weight="600">standing up</text><path d="M333.7 54V82" class="fig-accent-stroke" stroke-width="2.4"/><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">a long animation</text><rect x="556.0" y="60" width="148" height="20" rx="5" class="fig-grid-fill" opacity="0.4"/><rect x="556.0" y="60" width="98" height="20" rx="5" class="fig-grid-fill" opacity="0.9"/><text x="604.84" y="94" class="fig-muted" text-anchor="middle" font-size="8" font-weight="600">standing up</text><path d="M653.7 54V82" class="fig-accent-stroke" stroke-width="2.4"/></g><g transform="translate(0,852)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Headshot Only</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">If checked, body shots do no</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">damage. It uses the head box</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">from the Boxes tab.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">body counts</text><rect x="371.0" y="70" width="26" height="40" rx="6" class="fig-target"/><circle cx="420.0" cy="58" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M407.0 58H416.0M424.0 58H433.0M420.0 45V54M420.0 62V71" class="fig-ink-stroke" stroke-width="2.2"/><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">head only</text><rect x="617.0" y="70" width="26" height="40" rx="6" class="fig-target"/><circle cx="630.0" cy="58" r="11" class="fig-target"/><circle cx="630.0" cy="58" r="17" class="fig-accent-stroke" stroke-width="2" stroke-dasharray="4 3" fill="none"/><circle cx="666.0" cy="58" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M653.0 58H662.0M670.0 58H679.0M666.0 45V54M666.0 62V71" class="fig-ink-stroke" stroke-width="2.2"/></g><g transform="translate(0,1012)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Camera Height Offset</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">Vertical shift of the eyes. With</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">a head box 0 is the middle of</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">the head; without one it is the</text><text x="12" y="120" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">middle of the body.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">it sees from the chest</text><path d="M300.0 106H468.0" class="fig-grid-stroke" stroke-width="2"/><rect x="362.0" y="54" width="44" height="52" rx="14" class="fig-target"/><path d="M344.0 88H446.0" class="fig-cool-stroke" stroke-width="2.4" stroke-dasharray="5 4"/><circle cx="384.0" cy="88" r="5" class="fig-cool-fill"/><text x="448.0" y="92" class="fig-muted" text-anchor="start" font-size="8" font-weight="600">eyes</text><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">it sees from the head</text><path d="M546.0 106H714.0" class="fig-grid-stroke" stroke-width="2"/><rect x="608.0" y="54" width="44" height="52" rx="14" class="fig-target"/><path d="M590.0 62H692.0" class="fig-cool-stroke" stroke-width="2.4" stroke-dasharray="5 4"/><circle cx="630.0" cy="62" r="5" class="fig-cool-fill"/><text x="694.0" y="66" class="fig-muted" text-anchor="start" font-size="8" font-weight="600">eyes</text></g><g transform="translate(0,1172)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Hide Third Person Weapon</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">Hides the weapon on the</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">third-person model.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">shown</text><rect x="308.0" y="44" width="152" height="76" rx="5" class="fig-grid-stroke" stroke-width="1.6" fill="none"/><path d="M310.0 106H458.0" class="fig-grid-stroke" stroke-width="1.4" opacity="0.7"/><path d="M412.0 106L442.0 80" class="fig-muted-stroke" stroke-width="7" stroke-linecap="round" opacity="0.85"/><circle cx="384.0" cy="80" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M371.0 80H380.0M388.0 80H397.0M384.0 67V76M384.0 84V93" class="fig-ink-stroke" stroke-width="2.2"/><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">hidden</text><rect x="554.0" y="44" width="152" height="76" rx="5" class="fig-grid-stroke" stroke-width="1.6" fill="none"/><path d="M556.0 106H704.0" class="fig-grid-stroke" stroke-width="1.4" opacity="0.7"/><rect x="621.0" y="74" width="18" height="32" rx="7" class="fig-target"/><circle cx="630.0" cy="65" r="7" class="fig-target"/><circle cx="630.0" cy="80" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M617.0 80H626.0M634.0 80H643.0M630.0 67V76M630.0 84V93" class="fig-ink-stroke" stroke-width="2.2"/></g><g transform="translate(0,1332)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Third Person Camera</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">Plays the character from behind</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">rather than through its eyes.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">first person</text><rect x="308.0" y="44" width="152" height="76" rx="5" class="fig-grid-stroke" stroke-width="1.6" fill="none"/><path d="M310.0 106H458.0" class="fig-grid-stroke" stroke-width="1.4" opacity="0.7"/><path d="M412.0 106L442.0 80" class="fig-muted-stroke" stroke-width="7" stroke-linecap="round" opacity="0.85"/><circle cx="384.0" cy="80" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M371.0 80H380.0M388.0 80H397.0M384.0 67V76M384.0 84V93" class="fig-ink-stroke" stroke-width="2.2"/><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">third person</text><rect x="554.0" y="44" width="152" height="76" rx="5" class="fig-grid-stroke" stroke-width="1.6" fill="none"/><path d="M556.0 106H704.0" class="fig-grid-stroke" stroke-width="1.4" opacity="0.7"/><rect x="621.0" y="74" width="18" height="32" rx="7" class="fig-target"/><circle cx="630.0" cy="65" r="7" class="fig-target"/><circle cx="630.0" cy="80" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M617.0 80H626.0M634.0 80H643.0M630.0 67V76M630.0 84V93" class="fig-ink-stroke" stroke-width="2.2"/></g></svg>
