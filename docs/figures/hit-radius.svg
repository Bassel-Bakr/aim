<svg viewBox="0 0 760 290" class="fig-fit" role="img" aria-labelledby="fig-hitradius-title"><title id="fig-hitradius-title">Two panels with the same crosshair placed off-center. On the left the target itself is drawn larger, so the shot lands inside it. On the right the target is the original size but the shot has a wide radius, so it registers anyway.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimRadShot{0%{opacity:0}6%{opacity:1}52%{opacity:1}58%{opacity:0}100%{opacity:0}}.aim-rad-shot{opacity:0;animation-name:aimRadShot;animation-iteration-count:infinite;animation-duration:4.6s}@media (prefers-reduced-motion:reduce){.aim-rad-shot{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="218" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Bigger target</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">Boxes tab, body radius</tspan></text><circle cx="190" cy="150" r="26" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="5 5" fill="none"/><circle cx="190" cy="150" r="46" class="fig-target" opacity="0.9"/><g class="aim-rad-shot"><circle cx="228" cy="136" r="5" class="fig-accent-stroke" stroke-width="2.4" fill="none"/><circle cx="228" cy="136" r="3" class="fig-accent-fill"/></g><circle cx="228" cy="136" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M215 136H224M232 136H241M228 123V132M228 140V149" class="fig-ink-stroke" stroke-width="2.2"/><text x="190" y="222" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">the same miss counts as a hit</text><text x="190" y="244" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">you can see it is bigger</text><rect x="392" y="46" width="356" height="218" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Wider bullet</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">Effects tab, hitscan radius</tspan></text><circle cx="570" cy="150" r="26" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="5 5" fill="none"/><circle cx="570" cy="150" r="26" class="fig-target" opacity="1"/><g class="aim-rad-shot"><circle cx="608" cy="136" r="24" class="fig-accent-stroke" stroke-width="2.4" fill="none"/><circle cx="608" cy="136" r="3" class="fig-accent-fill"/></g><circle cx="608" cy="136" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M595 136H604M612 136H621M608 123V132M608 140V149" class="fig-ink-stroke" stroke-width="2.2"/><text x="570" y="222" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">the same miss counts as a hit</text><text x="570" y="244" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">harder to see coming</text></svg>
