<svg viewBox="0 0 760 290" class="fig-fit" role="img" aria-labelledby="fig-freeze-title"><title id="fig-freeze-title">Two panels of nine runs. On the left the scenario is edited twice, so the runs form three short unrelated climbs and no overall trend. On the right it is left alone and the nine runs form one rising line.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimFrzDot{0%{opacity:0}6%{opacity:1}100%{opacity:1}}.aim-frz-dot{opacity:0;animation-name:aimFrzDot;animation-iteration-count:infinite;animation-duration:6.4s}@keyframes aimFrzCut{0%{opacity:0}4%{opacity:1}100%{opacity:1}}.aim-frz-cut{opacity:0;animation-name:aimFrzCut;animation-iteration-count:infinite;animation-duration:6.4s}@media (prefers-reduced-motion:reduce){.aim-frz-dot,.aim-frz-cut{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="218" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Edited every session</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">three runs, then nothing</tspan></text><path d="M48 190H336" class="fig-grid-stroke" stroke-width="1.5" opacity="0.7"/><circle cx="64" cy="167.5" r="6" class="fig-target aim-frz-dot" style="animation-delay:0.00s"/><circle cx="98" cy="136.0" r="6" class="fig-target aim-frz-dot" style="animation-delay:0.20s"/><circle cx="132" cy="104.5" r="6" class="fig-target aim-frz-dot" style="animation-delay:0.40s"/><circle cx="166" cy="167.5" r="6" class="fig-target aim-frz-dot" style="animation-delay:0.60s"/><circle cx="200" cy="136.0" r="6" class="fig-target aim-frz-dot" style="animation-delay:0.80s"/><circle cx="234" cy="104.5" r="6" class="fig-target aim-frz-dot" style="animation-delay:1.00s"/><circle cx="268" cy="167.5" r="6" class="fig-target aim-frz-dot" style="animation-delay:1.20s"/><circle cx="302" cy="136.0" r="6" class="fig-target aim-frz-dot" style="animation-delay:1.40s"/><circle cx="336" cy="104.5" r="6" class="fig-target aim-frz-dot" style="animation-delay:1.60s"/><g class="aim-frz-cut" style="animation-delay:0.60s"><path d="M149 86V204" class="fig-tense-stroke" stroke-width="2" stroke-dasharray="4 4"/><text x="149" y="78" class="fig-tense-fill" text-anchor="middle" font-size="11" font-weight="700">edit</text></g><g class="aim-frz-cut" style="animation-delay:1.20s"><path d="M251 86V204" class="fig-tense-stroke" stroke-width="2" stroke-dasharray="4 4"/><text x="251" y="78" class="fig-tense-fill" text-anchor="middle" font-size="11" font-weight="700">edit</text></g><text x="190" y="232" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">no trend, three times</text><rect x="392" y="46" width="356" height="218" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Frozen after the build</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">nine runs of one thing</tspan></text><path d="M428 190H716" class="fig-grid-stroke" stroke-width="1.5" opacity="0.7"/><circle cx="444" cy="167.5" r="6" class="fig-target aim-frz-dot" style="animation-delay:0.00s"/><circle cx="478" cy="159.6" r="6" class="fig-target aim-frz-dot" style="animation-delay:0.20s"/><circle cx="512" cy="151.8" r="6" class="fig-target aim-frz-dot" style="animation-delay:0.40s"/><circle cx="546" cy="143.9" r="6" class="fig-target aim-frz-dot" style="animation-delay:0.60s"/><circle cx="580" cy="136.0" r="6" class="fig-target aim-frz-dot" style="animation-delay:0.80s"/><circle cx="614" cy="128.1" r="6" class="fig-target aim-frz-dot" style="animation-delay:1.00s"/><c