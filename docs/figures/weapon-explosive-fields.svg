:0}10%{opacity:1}40%{opacity:0}100%{opacity:0}}.aim-wexplosivefields4-1{opacity:0;animation-name:aimwexplosivefields4f1;animation-duration:4.0s;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){[class*='aim-wexplosivefields4-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@media (prefers-reduced-motion:reduce){[class*='aim-wexplosivefields5-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}</style><text x="12" y="26" class="fig-ink" text-anchor="start" font-size="16" font-weight="700">Explosives tab, every field</text><text x="12" y="44" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">Blast radius, damage and what stops it.</text><g transform="translate(0,52)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Explodes</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">Rounds detonate on impact.</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">Splash damage rewards being near</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">the target, which is the</text><text x="12" y="120" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">opposite of most aim drills.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">no</text><rect x="344.0" y="44" width="14" height="64" class="fig-grid-fill"/><path d="M444.0 76H360.0" class="fig-accent-stroke" stroke-width="2.6" stroke-linecap="round" opacity="0.8"/><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">yes</text><rect x="590.0" y="44" width="14" height="64" class="fig-grid-fill"/><path d="M690.0 76H606