(38.6px,-6.4px)}91.67%{transform:translate(40.2px,-6.7px)}93.75%{transform:translate(41.7px,-7.0px)}95.83%{transform:translate(43.1px,-7.2px)}97.92%{transform:translate(44.3px,-7.4px)}100%{transform:translate(45.3px,-7.6px)}}.aim-stagsfields5-0{animation-name:aimstagsfields5a0;animation-duration:4.0s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes aimstagsfields5a1{0%{transform:translate(-48.0px,8.0px)}8.333%{transform:translate(-48.0px,8.0px)}10.42%{transform:translate(-47.7px,7.9px)}12.5%{transform:translate(-38.0px,6.3px)}14.58%{transform:translate(-18.7px,3.1px)}16.67%{transform:translate(4.8px,-0.8px)}18.75%{transform:translate(27.3px,-4.5px)}20.83%{transform:translate(43.3px,-7.2px)}22.92%{transform:translate(48.0px,-8.0px)}100%{transform:translate(48.0px,-8.0px)}}.aim-stagsfields5-1{animation-name:aimstagsfields5a1;animation-duration:4.0s;animation-timing-function:linear;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){[class*='aim-stagsfields5-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@media (prefers-reduced-motion:reduce){[class*='aim-stagsfields6-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}</style><text x="12" y="26" class="fig-ink" text-anchor="start" font-size="16" font-weight="700">Tags tab, every field</text><text x="12" y="44" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">Whether anyone ever finds the scenario.</text><g transform="translate(0,52)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Tags</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">The words the browser searches</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">on. Empty, the scenario is</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">unfindable however good it is.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">nobody finds it</text><rect x="318.0" y="52" width="132" height="14" rx="4" class="fig-grid-fill" opacity="0.5"/><rect x="318.0" y="92" width="132" height="14" rx="4" class="fig-grid-fill" opacity="0.5"/><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">it turns up</text><rect x="564.0" y="52" width="132" height="14" rx="4" class="fig-grid-fill" opacity="0.5"/><rect x="564.0" y="72" width="132" height="14" rx="4" class="fig-accent-fill" opacity="0.95"/><rect x="564.0" y="92" width="132" height="14" rx="4" class="fig-grid-fill" opacity="0.5"/><text x="630.0" y="120" class="fig-muted" text-anchor="middle" font-size="10" font-weight="600">it turns up in search</text></g><g transform="translate(0,212)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Difficulty</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">The rating shown beside the</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">scenario. It sets what a reader</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">expects before they load it.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">gentle</text><rect x="319.0" y="64" width="18" height="24" rx="4" class="fig-accent-fill" opacity="1"/><rect x="347.0" y="64" width="18" height="24" rx="4" class="fig-accent-fill" opacity="1"/><rect x="375.0" y="64" width="18" height="24" rx="4" class="fig-grid-fill" opacity="0.45"/><rect x="403.0" y="64" width="18" height="24" rx="4" class="fig-grid-fill" opacity="0.45"/><rect x="431.0" y="64" width="18" height="24" rx="4" class="fig-grid-fill" opacity="0.45"/><text x="384.0" y="116" class="fig-muted" text-anchor="middle" font-size="10" font-weight="600">rated 2 of 5</text><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">hard</text><rect x="565.0" y="64" width="18" height="24" rx="4" class="fig-accent-fill" opacity="1"/><rect x="593.0" y="64" width="18" height="24" rx="4" class="fig-accent-fill" opacity="1"/><rect x="621.0" y="64" width="18" height="24" rx="4" class="fig-accent-fill" opacity="1"/><rect x="649.0" y="64" width="18" height="24" rx="4" class="fig-accent-fill" opacity="1"/><rect x="677.0" y="64" width="18" height="24" rx="4" class="fig-accent-fill" opacity="1"/><text x="630.0" y="116" class="fig-muted" text-anchor="middle" font-size="10" font-weight="600">rated 5 of 5</text></g><g transform="translate(0,372)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Description</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">What the scenario is for. Write</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">it as the weakness it isolates,</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">not as what it looks like: a</text><text x="12" y="120" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">reader hunting for a drill</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">blank</text><rect x="318.0" y="62" width="132" height="28" rx="5" class="fig-panel fig-grid-stroke" stroke-width="1.6"/><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">written</text><rect x="564.0" y="62" width="132" height="28" rx="5" class="fig-panel fig-grid-stroke" stroke-width="1.6"/><rect x="576.0" y="72" width="22" height="8" rx="3" class="fig-muted" opacity="0.75"/><rect x="606.0" y="72" width="18" height="8" rx="3" class="fig-muted" opacity="0.75"/><rect x="636.0" y="72" width="14" height="8" rx="3" class="fig-muted" opacity="0.75"/><text x="630.0" y="110" class="fig-muted" text-anchor="middle" font-size="10" font-weight="500">carries a name</text></g><g transform="translate(0,532)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Aim Type</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">The broad skill the drill</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">trains. It feeds the browser's</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">filters, so this is how the</text><text x="12" y="120" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">right reader reaches it.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">unset</text><rect x="320.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="324.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-stagsfields3-0" style="animation-delay:0.00s"/><rect x="354.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="388.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="422.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">clicking or tracking</text><rect x="566.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="570.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-stagsfields3-1" style="animation-delay:0.00s"/><rect x="600.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="604.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-stagsfields3-1" style="animation-delay:0.20s"/><rect x="634.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="638.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-stagsfields3-1" style="animation-delay:0.40s"/><rect x="668.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/></g><g transform="translate(0,692)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Aim Sub Type</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">The narrower skill under that</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">type. It is the difference</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">between a scenario found by the</text><text x="12" y="120" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">person who needs it and one</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">unset</text><rect x="320.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="324.0" y="67" width="18" height="18" rx="4" class="fig-accent-fil