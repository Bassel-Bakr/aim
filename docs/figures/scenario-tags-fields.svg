">it.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">a slide onto it</text><circle cx="432.0" cy="68" r="13" class="fig-target"/><g class="aim-stagsfields5-0"><circle cx="384.0" cy="76" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M371.0 76H380.0M388.0 76H397.0M384.0 63V72M384.0 80V89" class="fig-ink-stroke" stroke-width="2.2"/></g><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">one snap</text><circle cx="678.0" cy="68" r="13" class="fig-target"/><g class="aim-stagsfields5-1"><circle cx="630.0" cy="76" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M617.0 76H626.0M634.0 76H643.0M630.0 63V72M630.0 80V89" class="fig-ink-stroke" stroke-width="2.2"/></g></g><g transform="translate(0,1012)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Thumbnail</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">The picture shown in the</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">browser. It is the only thing a</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">reader sees before deciding</text><text x="12" y="120" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">whether to try the scenario.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">an empty tile</text><rect x="330.0" y="50" width="108" height="56" rx="6" class="fig-grid-fill" opacity="0.5"/><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anc