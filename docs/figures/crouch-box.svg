<svg viewBox="0 0 760 300" class="fig-fit" role="img" aria-labelledby="fig-crouchbox-title"><title id="fig-crouchbox-title">Two characters ducking inside a dashed outline of their standing height. Both shrink to the same crouched height, but the second reaches it in half the time.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimCrbDuck{0%{transform:scaleY(1)}30%{transform:scaleY(0.55)}70%{transform:scaleY(0.55)}100%{transform:scaleY(1)}}.aim-crb-body{transform-box:fill-box;transform-origin:center bottom;animation-name:aimCrbDuck;animation-iteration-count:infinite;animation-timing-function:linear}@media (prefers-reduced-motion:reduce){.aim-crb-body{animation-play-state:paused;animation-delay:-2.16s!important}}</style><rect x="12" y="46" width="356" height="218" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Rate 1</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">0.3 seconds to duck</tspan></text><path d="M80 218H300" class="fig-grid-stroke" stroke-width="3"/><rect x="160" y="114" width="60" height="104" rx="10" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="5 5" fill="none"/><rect x="164" y="118" width="52" height="100" rx="9" class="fig-target aim-crb-body" style="animation-duration:4.80s"/><text x="190" y="242" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">standing height</text><text x="190" y="260" class="fig-cool-fill" text-anchor="middle" font-size="12" font-weight="600">crouched multiplier</text><rect x="392" y="46" width="356" height="218" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Rate 2</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">0.15 seconds to duck</tspan></text><path d="M460 218H680" class="fig-grid-stroke" stroke-width="3"/><rect x="540" y="114" width="60" height="104" rx="10" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="5 5" fill="none"/><rect x="544" y="118" width="52" height="100" rx="9" class="fig-target aim-crb-body" style="animation-duration:2.40s"/><text x="570" y="242" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">standing height</text><text x="570" y="260" class="fig-cool-fill" text-anchor="middle" font-size="12" font-weight="600">crouched multiplier</text></svg>
