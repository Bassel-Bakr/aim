<svg viewBox="0 0 760 532" class="fig-fit" role="img" aria-labelledby="fig-route-title"><title id="fig-route-title">One path through a diagnostic chart, built up a step at a time from the top down. A cloud arrives first, naming the symptom: the crosshair sails past the target. An arrow draws downward from it and a red diamond arrives, naming the issue it points to, braking too late. A second arrow draws and a green rounded box arrives with the technique to change, commit and stop. A third arrow draws and a filled box arrives describing the scenario to play by its shape rather than by a name: one wall, two targets, short travel. A fourth arrow draws and a box with a double edge arrives with the result to expect, fewer corrections. Each of the five nodes has a different outline, so the kind of node can be read from its shape rather than from its colour. The path then clears and builds again.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimRteIn{0%{opacity:0.000;transform:translate(0px,12.00px)}0.8929%{opacity:0.043;transform:translate(0px,11.48px)}1.786%{opacity:0.156;transform:translate(0px,10.12px)}2.679%{opacity:0.316;transform:translate(0px,8.20px)}3.571%{opacity:0.500;transform:translate(0px,6.00px)}4.464%{opacity:0.684;transform:translate(0px,3.80px)}5.357%{opacity:0.844;transform:translate(0px,1.88px)}6.25%{opacity:0.957;transform:translate(0px,0.52px)}7.143%{opacity:1.000;transform:translate(0px,0.00px)}100%{opacity:1;transform:translate(0px,0px)}}@keyframes aimRteDraw{0%{stroke-dashoffset:20.00}1%{stroke-dashoffset:18.52}2%{stroke-dashoffset:14.81}3%{stroke-dashoffset:10.00}4%{stroke-dashoffset:5.19}5%{stroke-dashoffset:1.48}6%{stroke-dashoffset:0.00}100%{stroke-dashoffset:0}}@keyframes aimRteHead{0%{opacity:0}5.64%{opacity:0}6.36%{opacity:1}100%{opacity:1}}.aim-rte-in,.aim-rte-line,.aim-rte-head{animation-timing-function:linear;animation-iteration-count:infinite;animation-duration:7.0s}.aim-rte-in{opacity:0;animation-name:aimRteIn}.aim-rte-line{stroke-dashoffset:20;animation-name:aimRteDraw}.aim-rte-head{opacity:0;animation-name:aimRteHead}@media (prefers-reduced-motion:reduce){.aim-rte-in,.aim-rte-line,.aim-rte-head{opacity:1;stroke-dashoffset:0;transform:none;animation:none!important}}</style><rect x="12" y="46.0" width="736" height="468.0" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">One walk through the chart</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">five kinds of node, five shapes</tspan></text><path d="M380.0 130.0V150.0" class="fig-grid-stroke aim-rte-line" stroke-width="2" stroke-dasharray="20" style="animation-delay:0.63s"/><path d="M374.0 149.0L386.0 149.0L380.0 160.0Z" class="fig-grid-fill aim-rte-head" style="animation-delay:0.63s"/><path d="M380.0 244.0V264.0" class="fig-grid-stroke aim-rte-line" stroke-width="2" stroke-dasharray="20" style="animation-delay:1.68s"/><path d="M374.0 263.0L386.0 263.0L380.0 274.0Z" class="fig-grid-fill aim-rte-head" style="animation-delay:1.68s"/><path d="M380.0 328.0V348.0" class="fig-grid-stroke aim-rte-line" stroke-width="2" stroke-dasharray="20" style="animation-delay:2.73s"/><path d="M374.0 347.0L386.0 347.0L380.0 358.0Z" class="fig-grid-fill aim-rte-head" style="animation-delay:2.73s"/><path d="M380.0 412.0V432.0" class="fig-grid-stroke aim-rte-line" stroke-width="2" stroke-dasharray="20" style="animation-delay:3.78s"/><path d="M374.0 431.0L386.0 431.0L380.0 442.0Z" class="fig-grid-fill aim-rte-head" style="animation-delay:3.78s"/><g class="aim-rte-in" style="animation-delay:0.00s"><path d="M216.0 84.0a 52 22 0 0 1 104 0a 60 22 0 0 1 120 0a 52 22 0 0 1 104 0a 16 15 0 0 1 0 30a 55 16 0 0 1 -110 0a 54 16 0 0 1 -108 0a 55 16 0 0 1 -110 0a 16 15 0 0 1 0 -30Z" class="fig-panel fig-muted-stroke" stroke-width="2"/><text x="380.0" y="99.0" class="fig-ink" text-anchor="middle" font-size="16" font-weight="700" dominant-baseline="central">it sails past the target</text><text x="172.0" y="96.0" class="fig-ink" text-anchor="end" font-size="15" font-weight="700" dominant-baseline="central">Symptom</text><text x="588.0" y="96.0" class="fig-muted" text-anchor="start" font-size="13" font-weight="500" dominant-baseline="central">what you saw</text></g><g class="aim-rte-in" style="animation-delay:1.05s"><path d="M380.0 160.0L530.0 202.0L380.0 244.0L230.0 202.0Z" class="fig-panel fig-tense-stroke" stroke-width="2.4"/><text x="380.0" y="202.0" class="fig-tense-fill" text-anchor="middle" font-size="16" font-weight="700" dominant-baseline="central">braking too late</text><text x="172.0" y="202.0" class="fig-ink" text-anchor="end" font-size="15" font-weight="700" dominant-baseline="central">Issue</text><text x="588.0" y="202.0" class="fig-muted" text-anchor="start" font-size="13" font-weight="500" dominant-baseline="central">what it points to</text></g><g class="aim-rte-in" style="animation-delay:2.10s"><rect x="202.0" y="274.0" width="356.0" height="54.0" rx="26" class="fig-panel fig-balanced-stroke" stroke-width="2.4"/><text x="380.0" y="301.0" class="fig-balanced-fill" text-anchor="middle" font-size="16" font-weight="700" dominant-baseline="central">commit and stop</text><text x="172.0" y="301.0" class="fig-ink" text-anchor="end" font-size="15" font-weight="700" dominant-baseline="central">Technique</text><text x="588.0" y="301.0" class="fig-muted" text-anchor="start" font-size="13" font-weight="500" dominant-baseline="central">what to change</text></g><g class="aim-rte-in" style="animation-delay:3.15s"><rect x="202.0" y="358.0" width="356.0" height="54.0" class="fig-target"/><text x="380.0" y="385.0" class="fig-key-text" text-anchor="middle" font-size="15" font-weight="700" dominant-baseline="central">one wall · two targets · short travel</text><text x="172.0" y="385.0" class="fig-ink" text-anchor="end" font-size="15" font-weight="700" dominant-baseline="central">Scenario</text><text x="588.0" y="385.0" class="fig-muted" text-anchor="start" font-size="13" font-weight="500" dominant-baseline="central">what to play</text></g><g class="aim-rte-in" style="animation-delay:4.20s"><rect x="202.0" y="442.0" width="356.0" height="54.0" class="fig-panel fig-ink-stroke" stroke-width="2"/><rect x="207.0" y="447.0" width="346.0" height="44.0" class="fig-ink-stroke" fill="none" stroke-width="1.4"/><text x="380.0" y="469.0" class="fig-ink" text-anchor="middle" font-size="16" font-weight="700" dominant-baseline="central">fewer corrections</text><text x="172.0" y="469.0" class="fig-ink" text-anchor="end" font-size="15" font-weight="700" dominant-baseline="central">Result</text><text x="588.0" y="469.0" class="fig-muted" text-anchor="start" font-size="13" font-weight="500" dominant-baseline="central">what to expect</text></g></svg>
