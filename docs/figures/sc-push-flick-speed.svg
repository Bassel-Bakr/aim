<svg viewBox="0 0 600 180" class="fig-fit" role="img" aria-labelledby="fig-sc-push-flick-speed-title"><title id="fig-sc-push-flick-speed-title">The crosshair leaves fast. Its trail dots are strung far apart across the first stretch and bunch up at the target, where it sits still for the rest of the loop before the shot goes. Every dot is one tick of one clock, so where the dots crowd the crosshair was slow.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimSym2Runs0{0%{transform:translate(0px,0px)}2.381%{transform:translate(7.7px,0px)}4.762%{transform:translate(29.1px,0px)}7.143%{transform:translate(61.2px,0px)}9.524%{transform:translate(101.4px,0px)}11.9%{transform:translate(146.9px,0px)}14.29%{transform:translate(194.8px,0px)}16.67%{transform:translate(242.3px,0px)}19.05%{transform:translate(286.8px,0px)}21.43%{transform:translate(325.3px,0px)}23.81%{transform:translate(355.1px,0px)}26.19%{transform:translate(373.5px,0px)}28.57%{transform:translate(378px,0px)}100%{transform:translate(378px,0px)}}@keyframes aimSym2Shots0{0%{opacity:0}36%{opacity:0}36.5%{opacity:1}100%{opacity:1}}.aim-sym2-run,.aim-sym2-take,.aim-sym2-mark{animation-duration:3.8s;animation-timing-function:linear;animation-iteration-count:infinite;animation-delay:-1.6s}@media(prefers-reduced-motion:reduce){.aim-sym2-run,.aim-sym2-take{animation-play-state:paused}.aim-sym2-mark{animation:none!important;opacity:1!important}}</style><rect x="1" y="1" width="598" height="178" rx="12" class="fig-panel"/><text x="22" y="28"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Push the initial flick speed</tspan></text><text x="22" y="47" class="fig-muted fig-note" text-anchor="start" font-size="13" font-weight="500">the first move covers nearly all of it</text><path d="M72 106H540" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><path d="M92 97v18" class="fig-grid-stroke" stroke-width="1.5"/><path d="M92 98L130.7 98L223.3 98L334.3 98L428.4 98L469.9 98L470 98L470 98L470 98L470 98L470 98L470 98L470 98L470 98L470 98L470 98L470 98L470 98L470 98" class="fig-accent-stroke" stroke-width="1.5" fill="none" opacity=".28" stroke-linejoin="round"/><g class="fig-accent-fill" opacity=".5"><circle cx="130.7" cy="98" r="2.2"/><circle cx="223.3" cy="98" r="2.2"/><circle cx="334.3" cy="98" r="2.2"/><circle cx="428.4" cy="98" r="2.2"/><circle cx="469.9" cy="98" r="2.2"/><circle cx="470" cy="98" r="2.2"/><circle cx="470" cy="98" r="2.2"/><circle cx="470" cy="98" r="2.2"/><circle cx="470" cy="98" r="2.2"/><circle cx="470" cy="98" r="2.2"/><circle cx="470" cy="98" r="2.2"/><circle cx="470" cy="98" r="2.2"/><circle cx="470" cy="98" r="2.2"/><circle cx="470" cy="98" r="2.2"/><circle cx="470" cy="98" r="2.2"/><circle cx="470" cy="98" r="2.2"/><circle cx="470" cy="98" r="2.2"/><circle cx="470" cy="98" r="2.2"/></g><circle cx="470" cy="106" r="10" class="fig-target"/><g class="aim-sym2-mark" style="animation-name:aimSym2Shots0" opacity="0"><circle cx="470" cy="106" r="15" class="fig-ink-stroke" fill="none" stroke-width="2.4"/><path d="M470 121v9" class="fig-ink-stroke" stroke-width="2.4"/><text x="470.0" y="144" class="fig-muted" text-anchor="middle" font-size="12" font-weight="600">shot</text></g><g class="aim-sym2-run" style="animation-name:aimSym2Runs0"><circle cx="92" cy="106" r="8" class="fig-accent-stroke" stroke-width="2.2" fill="none"/><path d="M79 106H88M96 106H105M92 93V102M92 110V119" class="fig-accent-stroke" stroke-width="2.2"/></g><text x="22" y="170" class="fig-muted fig-caption" text-anchor="start" font-size="12" font-weight="600">Dots are equal ticks of one clock. They crowd where the hand was 