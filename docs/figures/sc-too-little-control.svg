<svg viewBox="0 0 600 164" class="fig-fit" role="img" aria-labelledby="fig-sc-too-little-control-title"><title id="fig-sc-too-little-control-title">Too little control. The crosshair leaves the start and carries 15 per cent of the distance past the target. There is no braking at all: the motion runs at speed and stops dead, with no correction after it. The crosshair shakes badly as it arrives. The trigger goes once the motion is done. A faint trail shows how far it got, and a ring or a crossed ring marks where the shot went: the shot misses. The bar underneath is real time on one scale, split into the flick, the braking and the settle, and this shot takes 134 milliseconds from the start to the trigger.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>.aim-iss-t-too_little_control,.aim-iss-m-too_little_control{animation-duration:3.4s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes aimIssTravel_too_little_control{0%{transform:translate(0px,0)}2.381%{transform:translate(5.064px,0)}4.762%{transform:translate(20.26px,0)}7.143%{transform:translate(45.58px,0)}9.524%{transform:translate(81.03px,0)}11.9%{transform:translate(122px,0)}14.29%{transform:translate(163px,0)}16.67%{transform:translate(204px,0)}19.05%{transform:translate(245px,0)}21.43%{transform:translate(286px,0)}23.81%{transform:translate(327px,0)}26.19%{transform:translate(367.9px,0)}28.57%{transform:translate(390.3px,-0.5959px)}30.95%{transform:translate(383.2px,-2.376px)}33.33%{transform:translate(392.4px,6.552px)}35.71%{transform:translate(404.5px,-1.234px)}38.1%{transform:translate(392.4px,-5.583px)}40.48%{transform:translate(377.8px,5.715px)}42.86%{transform:translate(387px,0.9973px)}45.24%{transform:translate(403.4px,-6.515px)}47.62%{transform:translate(397.6px,4.231px)}50%{transform:translate(379.9px,3.119px)}52.38%{transform:translate(382.2px,-6.735px)}54.76%{transform:translate(399.7px,2.139px)}57.14%{transform:translate(398.9px,3.608px)}59.52%{transform:translate(387.2px,-3.335px)}61.9%{transform:translate(386.9px,0)}64.29%{transform:translate(391.6px,0.839px)}66.67%{transform:translate(391px,0)}100%{transform:translate(391px,0)}}@keyframes aimIssFire_too_little_control{0%,35.71%{opacity:0}37.71%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.aim-iss-t-too_little_control{animation-play-state:paused;animation-delay:-0.936s!important}.aim-iss-m-too_little_control{animation:none!important;opacity:1!important}}</style><rect x="8" y="6" width="584" height="152" rx="12" class="fig-panel"/><text x="20" y="28"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Too little control</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">does not slow at all</tspan></text><path d="M62 82H560" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><path d="M80 68v28" class="fig-grid-stroke" stroke-width="1.5"/><path d="M80 82H471" class="fig-tense-stroke" stroke-width="8" opacity="0.2" fill="none" stroke-linecap="round"/><circle cx="420" cy="82" r="10" class="fig-target"/><text x="470.99999999999994" y="58" class="fig-tense-fill" text-anchor="middle" font-size="12" font-weight="700">sails past</text><g class="aim-iss-m-too_little_control" style="animation-name:aimIssFire_too_little_control;opacity:0"><path d="M476 72.27l17 17M493 72.27l-17 17" class="fig-tense-stroke" stroke-width="2.8" fill="none" stroke-linecap="round"/></g><g class="aim-iss-t-too_little_control" style="animation-name:aimIssTravel_too_little_control"><circle cx="80" cy="82" r="8" class="fig-tense-stroke" stroke-width="2.2" fill="none"/><path d="M67 82H76M84 82H93M80 69V78M80 86V95" class="fig-tense-stroke" stroke-width="2.2"/></g><rect x="80" y="112" width="133.2" height="14" rx="6" class="fig-ink-fill" opacity="0.7"/><text x="146.6" y="119" class="fig-surface" text-anchor="middle" font-size="11" font-weight="700" dominant-baseline="central">Flick</text><rect x="215.2" y="112" width="37" height="14" rx="6" class="fig-tense-fill" opacity="0.45"/><text x="263.2" y="123" class="fig-tense-fill" text-anchor="start" font-size="12" font-weight="600">134 ms</text><text x="20" y="148" class="fig-muted fig-caption" text-anchor="start" font-size="12" font-weight="600">shakes badly as it arrives</text><text x="580" y="148" class="fig-muted fig-caption" text-anchor="end" font-size="12" font-weight="600">shot misses long</text></svg>
