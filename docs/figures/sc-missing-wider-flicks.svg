<svg viewBox="0 0 600 164" class="fig-fit" role="img" aria-labelledby="fig-sc-missing-wider-flicks-title"><title id="fig-sc-missing-wider-flicks-title">Missing wider flicks. The crosshair leaves the start and carries 24 per cent of the distance past the target. There is no braking at all: the motion runs at speed and stops dead, with no correction after it. The crosshair shakes a little as it arrives. The trigger goes once the motion is done. A faint trail shows how far it got, and a ring or a crossed ring marks where the shot went: the shot misses. The bar underneath is real time on one scale, split into the flick, the braking and the settle, and this shot takes 134 milliseconds from the start to the trigger.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>.aim-iss-t-missing_wider_flicks,.aim-iss-m-missing_wider_flicks{animation-duration:3.4s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes aimIssTravel_missing_wider_flicks{0%{transform:translate(0px,0)}2.381%{transform:translate(5.461px,0)}4.762%{transform:translate(21.84px,0)}7.143%{transform:translate(49.15px,0)}9.524%{transform:translate(87.37px,0)}11.9%{transform:translate(131.6px,0)}14.29%{transform:translate(175.8px,0)}16.67%{transform:translate(220px,0)}19.05%{transform:translate(264.2px,0)}21.43%{transform:translate(308.3px,0)}23.81%{transform:translate(352.5px,0)}26.19%{transform:translate(396.7px,0)}28.57%{transform:translate(421px,-0.3974px)}30.95%{transform:translate(415.6px,3.085px)}33.33%{transform:translate(422.7px,-1.985px)}35.71%{transform:translate(432.1px,-3.65px)}38.1%{transform:translate(422.7px,4.921px)}40.48%{transform: