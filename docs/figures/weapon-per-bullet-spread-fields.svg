<svg viewBox="0 0 760 532" class="fig-fit" role="img" aria-labelledby="fig-wpbsfields-title"><title id="fig-wpbsfields-title">Per bullet spread, every field. One strip per field, each naming the setting, describing it, and demonstrating a low and a high state side by side.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimwpbsfields0n0{0%{opacity:0}5%{opacity:1}44%{opacity:1}50%{opacity:0}100%{opacity:0}}.aim-wpbsfields0-0{opacity:0;animation-name:aimwpbsfields0n0;animation-duration:4.0s;animation-iteration-count:infinite}@keyframes aimwpbsfields0n1{0%{opacity:0}5%{opacity:1}44%{opacity:1}50%{opacity:0}100%{opacity:0}}.aim-wpbsfields0-1{opacity:0;animation-name:aimwpbsfields0n1;animation-duration:4.0s;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){[class*='aim-wpbsfields0-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@keyframes aimwpbsfields1s0{0%{opacity:0}6%{opacity:1}72%{opacity:1}80%{opacity:0}100%{opacity:0}}.aim-wpbsfields1-0{opacity:0;animation-name:aimwpbsfields1s0;animation-duration:4.0s;animation-iteration-count:infinite}@keyframes aimwpbsfields1s1{0%{opacity:0}6%{opacity:1}72%{opacity:1}80%{opacity:0}100%{opacity:0}}.aim-wpbsfields1-1{opacity:0;animation-name:aimwpbsfields1s1;animation-duration:4.0s;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){[class*='aim-wpbsfields1-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@media (prefers-reduced-motion:reduce){[class*='aim-wpbsfields2-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}</style><text x="12" y="26" class="fig-ink" text-anchor="start" font-size="16" font-weight="700">Per bullet spread, every field</text><text x="12" y="44" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">A fixed pattern instead of a random cone.</text><g transform="translate(0,52)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Use Per Bullet Spread</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">A fixed pattern of offsets</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">rather than a random cone, which</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">is what a shotgun wants. A fixed</text><text x="12" y="120" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">pattern is learnable.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">random cone</text><circle cx="368.3" cy="78.7" r="4" class="fig-target aim-wpbsfields0-0" style="animation-delay:0.00s"/><circle cx="376.2" cy="82.2" r="4" class="fig-target aim-wpbsfields0-0" style="animation-delay:0.00s"/><circle cx="391.5" cy="49.9" r="4" class="fig-target aim-wpbsfields0-0" style="animation-delay:0.00s"/><circle cx="354.8" cy="96.2" r="4" class="fig-target aim-wpbsfields0-0" style="animation-delay:0.00s"/><circle cx="369.6" cy="60.1" r="4" class="fig-target aim-wpbsfields0-0" style="animation-delay:0.00s"/><circle cx="413.7" cy="74.2" r="4" class="fig-target aim-wpbsfields0-0" style="animation-delay:0.00s"/><circle cx="404.2" cy="74.6" r="4" class="fig-target aim-wpbsfields0-0" style="animation-delay:2.00s"/><circle cx="392.3" cy="55.0" r="4" class="fig-target aim-wpbsfields0-0" style="animation-delay:2.00s"/><circle cx="392.1" cy="98.1" r="4" class="fig-target aim-wpbsfields0-0" style="animation-delay:2.00s"/><