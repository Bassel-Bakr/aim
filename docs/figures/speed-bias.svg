<svg viewBox="0 0 760 300" class="fig-fit" role="img" aria-labelledby="fig-speedbias-title"><title id="fig-speedbias-title">Three panels, each showing the direction you look and the direction a forward-and-strafe input actually sends you. Below one the arrow leans toward the side, at one it sits at forty-five degrees, above one it leans toward straight ahead.</title><defs><marker id="fig-spb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="fig-accent-fill"/></marker></defs><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimSpbIn{0%{opacity:0}10%{opacity:1}100%{opacity:1}}.aim-spb-in{opacity:0;animation-name:aimSpbIn;animation-iteration-count:infinite;animation-duration:5.0s}@media (prefers-reduced-motion:reduce){.aim-spb-in{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="234" height="218" rx="12" class="fig-panel"/><text x="28" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Below 1</tspan></text><text x="129" y="278" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">more to the sides</text><path d="M129 200V96" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="5 5"/><text x="129" y="84" class="fig-muted" text-anchor="middle" font-size="11" font-weight="500">looking</text><g class="aim-spb-in" style="animation-delay:0.00s"><path d="M129 200L224.0 157.7" class="fig-accent-stroke" stroke-width="3.4" stroke-linecap="round" marker-end="url(#fig-spb-arrow)"/></g><circle cx="129" cy="200" r="7" class="fig-ink-fill"/><text x="129" y="228" class="fig-accent-text" text-anchor="middle" font-size="12" font-weight="700">66 degrees</text><rect x="263" y="46" width="234" height="218" rx="12" class="fig-panel"/><text x="279" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">1</tspan></text><text x="380" y="278" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">45 degrees, the default</text><path d="M380 200V96" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="5 5"/><text x="380" y="84" class="fig-muted" text-anchor="middle" font-size="11" font-weight="500">looking</text><g class="aim-spb-in" style="animation-delay:0.30s"><path d="M380 200L453.5 126.5" class="fig-accent-stroke" stroke-width="3.4" stroke-linecap="round" marker-end="url(#fig-spb-arrow)"/></g><circle cx="380" cy="200" r="7" class="fig-ink-fill"/><text x="380" y="228" class="fig-accent-text" text-anchor="middle" font-size="12" font-weight="700">45 degrees</text><rect x="514" y="46" width="234" height="218" rx="12" class="fig-panel"/><text x="530" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Above 1</tspan></text><text x="631" y="278" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">more forward and back</text><path d="M631 200V96" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="5 5"/><text x="631" y="84" class="fig-muted" text-anchor="middle" font-size="11" font-weight="500">looking</text><g class="aim-spb-in" style="animation-delay:0.60s"><path d="M631 200L673.3 105.0" class="fig-accent-stroke" stroke-width="3.4" stroke-linecap="round" marker-end="url(#fig-spb-arrow)"/></g><circle cx="631" cy="200" r="7" class="fig-ink-fill"/><text x="631" y="228" class="fig-accent-text" text-anchor="middle" font-size="12" font-weight="700">24 degrees</text></svg>
