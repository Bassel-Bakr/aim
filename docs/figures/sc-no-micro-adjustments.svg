<svg viewBox="0 0 600 164" class="fig-fit" role="img" aria-labelledby="fig-sc-no-micro-adjustments-title"><title id="fig-sc-no-micro-adjustments-title">Not doing micro adjustments. The crosshair leaves the start and stalls 7 per cent short of the target and never arrives. There is no braking at all: the motion runs at speed and stops dead, with no correction after it. The crosshair is steady. The trigger goes at 93 per cent of the shot, before the crosshair has settled. A faint trail shows how far it got, and a ring or a crossed ring marks where the shot went: the shot misses. The bar underneath is real time on one scale, split into the flick, the braking and the settle, and this shot takes 134 milliseconds from the start to the trigger.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>.aim-iss-t-no_micro_adjustments,.aim-iss-m-no_micro_adjustments{animation-duration:3.4s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes aimIssTravel_no_micro_adjustments{0%{transform:translate(0px,0)}2.381%{transform:translate(4.096px,0)}4.762%{transform:translate(16.38px,0)}7.143%{transform:translate(36.86px,0)}9.524%{transform:translate(65.53px,0)}11.9%{transform:translate(98.67px,0)}14.29%{transform:translate(131.8px,0)}16.67%{transform:translate(165px,0)}19.05%{transform:translate(198.1px,0)}21.43%{transform:translate(231.3px,0)}23.81%{transform:translate(264.4px,0)}26.19%{transform:translate(297.6px,0)}28.57%{transform:translate(316.2px,0)}100%{transform:translate(316.2px,0)}}@keyframes aimIssFire_no_micro_adjustments{0%,33.33%{opacity:0}35.33%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.aim-iss-t-no_micro_adjustments{animation-play-state:paused;animation-delay:-0.936s!important}.aim-iss-m-no_micro_adjustments{animation:none!important;opacity:1!important}}</style><rect x="8" y="6" width="584" height="152" rx="12" class="fig-panel"/><text x="20" y="28"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Not doing micro adjustments</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">does not slow at all</tspan></text><path d="M62 82H560" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><path d="M80 68v28" class="fig-grid-stroke" stroke-width="1.5"/><path d="M80 82H396.2" class="fig-loose-stroke" stroke-width="8" opacity="0.2" fill="none" stroke-linecap="round"/><circle cx="420" cy="82" r="10" class="fig-target"/><text x="396.2" y="58" class="fig-loose-fill" text-anchor="middle" font-size="12" font-weight="700">never gets there</text><g class="aim-iss-m-no_micro_adjustments" style="animation-name:aimIssFire_no_micro_adjustments;opacity:0"><path d="M387.7 73.5l17 17M404.7 73.5l-17 17" class="fig-loose-stroke" stroke-width="2.8" fill="none" stroke-linecap="round"/></g><g class="aim-iss-t-no_micro_adjustments" style="animation-name:aimIssTravel_no_micro_adjustments"><circle cx="80" cy="82" r="8" class="fig-loose-stroke" stroke-width="2.2" fill="none"/><path d="M67 82H76M84 82H93M80 69V78M80 86V95" class="fig-loose-stroke" stroke-width="2.2"/></g><rect x="80" y="112" width="133.2" height="14" rx="6" class="fig-ink-fill" opacity="0.7"/><text x="146.6" y="119" class="fig-surface" text-anchor="middle" font-size="11" font-weight="700" dominant-baseline="central">Flick</text><rect x="215.2" y="112" width="37" height="14" rx="6" class="fig-loose-fill" opacity="0.45"/><path d="M243.7 107v24" class="fig-ink-stroke" stroke-width="2"/><text x="263.2" y="123" class="fig-loose-fill" text-anchor="start" font-size="12" font-weight="600">134 ms</text><text x="20" y="148" class="fig-muted fig-caption" text-anchor="start" font-size="12" font-weight="600">steady as it arrives</text><text x="580" y="148" class="fig-muted fig-caption" text-anchor="end" font-size="12" font-weight="600">trigger at 93%, shot misses short</text></svg>
