nt-weight="700">never gets there</text><g class="aim-iss-m-decelerating_too_early" style="animation-name:aimIssFire_decelerating_too_early;opacity:0"><path d="M382.8 73.93l17 17M399.8 73.93l-17 17" class="fig-loose-stroke" stroke-width="2.8" fill="none" stroke-linecap="round"/></g><g class="aim-iss-t-decelerating_too_early" style="animation-name:aimIssTravel_decelerating_too_early"><circle cx="80" cy="82" r="8" class="fig-loose-stroke" stroke-width="2.2" fill="none"/><path d="M67 82H76M84 82H93M80 69V78M80 86V95" class="fig-loose-stroke" stroke-width="2.2"/></g><rect x="80" y="112" width="73.4" height="14" rx="6" class="fig-ink-fill" opacity="0.7"/><text x="116.7" y="119" class="fig-surface" text-anchor="middle" font-size="11" font-weight="700" dominant-baseline="central">Flick</text><rect x="155.4" y="112" width="264.5" height="14" rx="6" class="fig-loose-fill" opacity="1.0"/><text x="287.65" y="119" class="fig-surface" text-anchor="middle" font-size="11" font-weight="700" dominant-baseline="central">Brake</text><rect x="421.9" y="112" width="37" height="14" rx="6" class="fig-loose-fill" opacity="0.45"/><text x="469.9" y="123" class="fig-loose-fill" text-anchor="start" font-size="12" font-weight="600">293 ms</text><text x="20" y="148" class="fig-muted fig-caption" text-anchor="start" font-size="12" font-weight="600">shakes as it arrives</text><text x="580" y="148" class="fig-muted fig-caption" text-anchor="end" font-size="12" font-weight="600">shot misses short</text></svg>
