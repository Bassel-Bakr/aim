<svg viewBox="0 0 600 164" class="fig-fit" role="img" aria-labelledby="fig-sc-decelerating-too-early-title"><title id="fig-sc-decelerating-too-early-title">Decelerating too early. The crosshair leaves the start and stalls 8 per cent short of the target and never arrives. Braking starts far out, so the last stretch is a crawl. The crosshair shakes a little as it arrives. The trigger goes once the motion is done. A faint trail shows how far it got, and a ring or a crossed ring marks where the shot went: the shot misses. The bar underneath is real time on one scale, split into the flick, the braking and the settle, and this shot takes 293 milliseconds from the start to the trigger.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>.aim-iss-t-decelerating_too_early,.aim-iss-m-decelerating_too_early{animation-duration:3.4s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes aimIssTravel_decelerating_too_early{0%{transform:translate(0px,0)}2.381%{transform:translate(5.732px,0)}4.762%{transform:translate(22.93px,0)}7.143%{transform:translate(48.42px,0)}9.524%{transform:translate(74.29px,0)}11.9%{transform:translate(100.2px,0)}14.29%{transform:translate(126px,0)}16.67%{transform:translate(146.3px,0)}19.05%{transform:translate(161.6px,0.2745px)}21.43%{transform:translate(175.5px,0.7441px)}23.81%{transform:translate(188px,0.571px)}26.19%{transform:translate(199.8px,0)}28.57%{transform:translate(211.2px,-0.5358px)}30.95%{transform:translate(222.4px,-0.7488px)}33.33%{transform:translate(233.5px,-0.4743px)}35.71%{transform:translate(244.3px,0.1091px)}38.1%{transform:translate(254.5px,0.6215px)}40.48%{transform:t