<svg viewBox="0 0 600 178" class="fig-fit" role="img" aria-labelledby="fig-sc-controlled-bursts-title"><title id="fig-sc-controlled-bursts-title">Four flicks in two bursts of two. Inside a burst the crosshair goes straight from one target to the next. Between the bursts it sits still on the target far longer than any of the flicks take.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimTecControlledBurstsSweep{0%{transform:translate(0,0)}100%{transform:translate(484px,0)}}@keyframes aimTecControlledBurstsHit{0%{opacity:0;transform:scale(.35)}4%{opacity:.95;transform:scale(1)}18%{opacity:0;transform:scale(1.85)}100%{opacity:0;transform:scale(1.85)}}.aim-tec-controlled-bursts-m{animation-name:aimTecControlledBurstsHit;fill:none;stroke-width:2.4;opacity:0}@keyframes aimTecControlledBurstsFade{0%{opacity:0}2.55%{opacity:1}93.6%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes aimTecControlledBurstsGo{0%{transform:translate(0px,0)}2.632%{transform:translate(22px,0)}5.263%{transform:translate(42px,0)}7.895%{transform:translate(60px,0)}10.53%{transform:translate(72px,0)}13.16%{transform:translate(76px,0)}15.79%{transform:translate(80px,0)}18.42%{transform:translate(102px,0)}21.05%{transform:translate(122px,0)}23.68%{transform:translate(139px,0)}26.32%{transform:translate(149px,0)}28.95%{transform:translate(152px,0)}50%{transform:translate(152px,0)}52.63%{transform:translate(177px,0)}55.26%{transform:translate(215px,0)}57.89%{transform:translate(252px,0)}60.53%{transform:translate(286px,0)}63.16%{transform:translate(313px,0)}65.79%{transform:translate(333px,0)}68.42%{transform:translate(343px,0)}71.05%{transform:translate(344px,0)}73.68%{transform:translate(360px,0)}76.32%{transform:translate(381px,0)}78.95%{transform:translate(400px,0)}81.58%{transform:translate(413px,0)}84.21%{transform:translate(420px,0)}100%{transform:translate(420px,0)}}.aim-tec-controlled-bursts,.aim-tec-controlled-bursts-m{animation-duration:4.7s;animation-timing-function:linear;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){.aim-tec-controlled-bursts{animation-play-state:paused;animation-delay:-1.87s!important}.aim-tec-controlled-bursts-m{animation:none!important;opacity:1!important}}</style><rect x="8" y="8" width="584" height="162" rx="12" class="fig-panel"/><text x="24" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Controlled bursts</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">fast inside, still between</tspan></text><path d="M96 71V62H248V71" class="fig-grid-stroke" stroke-width="1.6" fill="none"/><text x="172.0" y="55" class="fig-muted fig-phase" text-anchor="middle" font-size="12" font-weight="600">burst</text><path d="M440 71V62H516V71" class="fig-grid-stroke" stroke-width="1.6" fill="none"/><text x="478.0" y="55" class="fig-muted fig-phase" text-anchor="middle" font-size="12" font-weight="600">burst</text><path d="M248 62H440" class="fig-grid-stroke" stroke-width="1.6" stroke-dasharray="3 5"/><text x="344.0" y="55" class="fig-muted fig-phase" text-anchor="middle" font-size="12" font-weight="600">pause</text><path d="M64 96H566" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><path d="M96 87v18" class="fig-grid-stroke" stroke-width="2"/><g class="fig-target"><circle cx="172" cy="96" r="11"/><circle cx="248" cy="96" r="11"/><circle cx="440" cy="96" r="11"/><circle cx="516" cy="96" r="11"/></g><g class="fig-muted fig-phase" text-anchor="middle" font-size="11" font-weight="600"><text x="172" y="118">1</text><text x="248" y="118">2</text><text x="440" y="118">3</text><text x="516" y="118">4</text