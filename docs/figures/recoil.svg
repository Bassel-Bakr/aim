<svg viewBox="0 0 760 300" class="fig-fit" role="img" aria-labelledby="fig-recoil-title"><title id="fig-recoil-title">Two panels firing two bursts each, with the shots joined into a climbing line. Under recoil, the two bursts climb along different lines. Under per shot recoil, both bursts climb along exactly the same line.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimRecMark{0%{opacity:0}3%{opacity:1}44%{opacity:1}50%{opacity:0}100%{opacity:0}}.aim-rec-mark{opacity:0;animation-name:aimRecMark;animation-iteration-count:infinite;animation-duration:4.8s}@media (prefers-reduced-motion:reduce){.aim-rec-mark{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="238" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Recoil</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">a new climb every burst</tspan></text><path d="M70 246H310" class="fig-grid-stroke" stroke-width="2" opacity="0.6"/><polyline points="190.0 246.0 189.8 219.3 165.3 204.6 162.9 183.2 171.4 167.2 209.1 150.5 169.2 129.3 208.7 108.7" class="fig-accent-stroke aim-rec-mark" stroke-width="2.4" fill="none" stroke-linejoin="round" style="animation-delay:0.00s"/><circle cx="190.0" cy="246.0" r="5" class="fig-target aim-rec-mark" style="animation-delay:0.00s"/><circle cx="189.8" cy="219.3" r="5" class="fig-target aim-rec-mark" style="animation-delay:0.03s"/><circle cx="165.3" cy="204.6" r="5" class="fig-target aim-rec-mark" style="animation-delay:0.06s"/><circle cx="162.9" cy="183.2" r="5" class="fig-target aim-rec-mark" style="animation-delay:0.09s"/><circle cx="171.4" cy="167.2" r="5" class="fig-target aim-rec-mark" style="animation-delay:0.12s"/><circle cx="209.1" cy="150.5" r="5" class="fig-target aim-rec-mark" style="animation-delay:0.15s"/><circle cx="169.2" cy="129.3" r="5" class="fig-target aim-rec-mark" style="animation-delay:0.18s"/><circle cx="208.7" cy="108.7" r="5" class="fig-target aim-rec-mark" style="animation-delay:0.21s"/><polyline points="190.0 246.0 197.6 218.9 173.8 204.0 170.0 182.0 161.2 163.2 181.0 145.8 171.2 123.6 179.0 108.9" class="fig-accent-stroke aim-rec-mark" stroke-width="2.4" fill="none" stroke-linejoin="round" style="animation-delay:2.40s"/><circle cx="190.0" cy="246.0" r="5" class="fig-target aim-rec-mark" style="animation-delay:2.40s"/><circle cx="197.6" cy="218.9" r="5" class="fig-target aim-rec-mark" style="animation-delay:2.43s"/><circle cx="173.8" cy="204.0" r="5" class="fig-target aim-rec-mark" style="animation-delay:2.46s"/><circle cx="170.0" cy="182.0" r="5" class="fig-target aim-rec-mark" style="animation-delay:2.49s"/><circle cx="161.2" cy="163.2" r="5" class="fig-target aim-rec-mark" style="animation-delay:2.52s"/><circle cx="181.0" cy="145.8" r="5" class="fig-target aim-rec-mark" style="animation-delay:2.55s"/><circle cx="171.2" cy="123.6" r="5" class="fig-target aim-rec-mark" style="animation-delay:2.58s"/><circle cx="179.0" cy="108.9" r="5" class="fig-target aim-rec-mark" style="animation-delay:2.61s"/><rect x="392" y="46" width="356" height="238" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Per shot recoil</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">the same climb, learnable</tspan></text><path d="M450 246H690" class="fig-grid-stroke" stroke-width="2" opacity="0.6"/><polyline points="570.0 246.0 573.4 227.0 576.8 208.0 580.2 189.0 583.6 170.0 587.0 151.0 590.4 132.0 593.8 113.0" class="fig-accent-stroke aim-rec-mark" stroke-width="2.4" fill=