<svg viewBox="0 0 600 194" class="fig-fit" role="img" aria-labelledby="fig-sc-proper-flicking-motion-title"><title id="fig-sc-proper-flicking-motion-title">Proper flicking motion, drawn as the same reach run twice on one clock. The upper run bows away from the straight line and hooks back onto the target. The lower run stays on the line. The marks on the clock below are when each run takes its shots, planted as the clock passes them, so the lower row is already finished while the upper run is still working.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimRes04bae9A{0%{transform:translate(0px,0px)}5.26%{transform:translate(2px,0px)}8.18%{transform:translate(17px,-1px)}11.7%{transform:translate(52px,-5px)}15.8%{transform:translate(109px,-11px)}24.5%{transform:translate(253px,-17px)}28.6%{transform:translate(311px,-15px)}32.1%{transform:translate(349px,-13px)}35%{transform:translate(366px,-12px)}38.5%{transform:translate(370px,-11px)}52%{transform:translate(360px,0px)}75.3%{transform:translate(360px,0px)}77.1%{transform:translate(360px,0px)}100%{transform:translate(360px,0px)}}@keyframes aimRes04bae9B{0%{transform:translate(0px,0px)}4.09%{transform:translate(0px,0px)}5.26%{transform:translate(8px,0px)}6.42%{transform:translate(24px,-1px)}8.18%{transform:translate(63px,-2px)}10.5%{transform:translate(132px,-5px)}14.6%{transform:translate(265px,-7px)}16.4%{transform:translate(313px,-6px)}18.1%{transform:translate(347px,-5px)}19.3%{transform:translate(360px,-4px)}21.6%{transform:translate(362px,-4px)}32.1%{transform:translate(360px,0px)}55.5%{transform:translate(360px,0px)}77.1%{transform:translate(360px,0px)}100%{transform:translate(360px,0px)}}@keyframes aimRes04bae9S{0%{transform:translateX(0px)}77.08%{transform:translateX(464px)}100%{transform:translateX(464px)}}.aim-res-04bae9{animation-duration:4.8s;animation-timing-function:linear;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){.aim-res-04bae9{animation-play-state:paused;animation-delay:-0.87s!important}.aim-res-04bae9-s{opacity:0}}</style><rect x="8" y="8" width="584" height="140" rx="12" class="fig-panel"/><text x="22" y="32"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Proper flicking motion</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">wasted movement</tspan></text><path d="M78 78H474" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><g class="fig-target"><circle cx="452" cy="78" r="9"/></g><text x="22" y="78.0" class="fig-tense-fill" text-anchor="start" font-size="12" font-weight="700" dominant-baseline="central">before</text><g class="aim-res-04bae9" style="animation-name:aimRes04bae9A"><circle cx="92.0" cy="78.0" r="8" class="fig-tense-stroke" stroke-width="2.2" fill="none"/><path d="M79.0 78.0H88.0M96.0 78.0H105.0M92.0 65.0V74.0M92.0 82.0V91.0" class="fig-tense-stroke" stroke-width="2.2"/></g><path d="M78 124H474" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><g class="fig-target"><circle cx="452" cy="124" r="9"/></g><text x="22" y="124.0" class="fig-balanced-fill" text-anchor="start" font-size="12" font-weight="700" dominant-baseline="central">after</text><g class="aim-res-04bae9" style="animation-name:aimRes04bae9B"><circle cx="92.0" cy="124.0" r="8" class="fig-balanced-stroke" stroke-width="2.2" fill="none"/><path d="M79.0 124.0H88.0M96.0 124.0H105.0M92.0 111.0V120.0M92.0 128.0V137.0" class="fig-balanced-stroke" stroke-width="2.2"/></g><path d="M417 155v9" class="fig-tense-stroke" stroke-width="2.6"/><path d="M271 164v9" class="fig-balanced-stroke" stroke-width="2.6"/><rect x="90" y="152" width="470" height="24" class="fig-surface aim-res-04bae9 aim-res-04bae9-s" style="animation-name:aimRes04bae9S"/><path d="M92 164H556" class="fig-grid-stroke" stroke-width="2"/><g class="aim-res-04bae9" style="animation-name:aimRes04bae9S"><circle cx="92" cy="164" r="4" class="fig-ink-fill"/></g><text x="92.0" y="188" class="fig-muted" text-anchor="start" font-size="12" font-weight="600">one clock, both runs</text></svg>
