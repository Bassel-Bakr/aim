<svg viewBox="0 0 600 164" class="fig-fit" role="img" aria-labelledby="fig-sc-dragging-initial-flick-title"><title id="fig-sc-dragging-initial-flick-title">Dragging the initial flick. The crosshair leaves the start and stalls 10 per cent short of the target and never arrives. Braking starts far out, so the last stretch is a crawl. The crosshair is steady. The trigger goes once the motion is done. A faint trail shows how far it got, and a ring or a crossed ring marks where the shot went: the shot misses. The bar underneath is real time on one scale, split into the flick, the braking and the settle, and this shot takes 293 milliseconds from the start to the trigger.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>.aim-iss-t-dragging_initial_flick,.aim-iss-m-dragging_initial_flick{animation-duration:3.4s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes aimIssTravel_dragging_initial_flick{0%{transform:translate(0px,0)}2.381%{transform:translate(5.607px,0)}4.762%{transform:translate(22.43px,0)}7.143%{transform:translate(47.37px,0)}9.524%{transform:translate(72.68px,0)}11.9%{transform:translate(97.99px,0)}14.29%{transform:translate(123.3px,0)}16.67%{transform:translate(142.8px,0)}19.05%{transform:translate(157.2px,0)}21.43%{transform:translate(170.9px,0)}23.81%{transform:translate(183.9px,0)}26.19%{transform:translate(196.3px,0)}28.57%{transform:translate(208px,0)}30.95%{transform:translate(219px,0)}33.33%{transform:translate(229.4px,0)}35.71%{transform:translate(239.1px,0)}38.1%{transform:translate(248.2px,0)}40.48%{transform:translate(256.6px,0)}42.86%{transform:translate(264.3px,0)}45.24%{transform:translate(271.4px,0)}47.62%{transform:translate(277.8px,0)}50%{transform:translate(283.6px,0)}52.38%{transform:translate(288.7px,0)}54.76%{transform:translate(293.2px,0)}57.14%{transform:translate(296.9px,0)}59.52%{transform:translate(300.1px,0)}61.9%{transform:translate(302.5px,0)}64.29%{transform:translate(304.3px,0)}66.67%{transform:translate(305.5px,0)}69.05%{transform:translate(306px,0)}100%{transform:translate(306px,0)}}@keyframes aimIssFire_dragging_initial_flick{0%,78.57%{opacity:0}80.57%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.aim-iss-t-dragging_initial_flick{animation-play-state:paused;animation-delay:-2.37s!important}.aim-iss-m-dragging_initial_flick{animation:none!important;opacity:1!important}}</style><rect x="8" y="6" width="584" height="152" rx="12" class="fig-panel"/><text x="20" y="28"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Dragging the initial flick</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">brakes far too early</tspan></text><path d="M62 82H560" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><path d="M80 68v28" class="fig-grid-stroke" stroke-width="1.5"/><path d="M80 82H386" class="fig-loose-stroke" stroke-width="8" opacity="0.2" fill="none" stroke-linecap="round"/><circle cx="420" cy="82" r="10" class="fig-target"/><text x="386.0" y="58" class="fig-loose-fill" text-anchor="middle" font-size="12" font-weight="700">never gets there</text><g class="aim-iss-m-dragging_initial_flick" style="animation-name:aimIssFire_dragging_initial_flick;opacity:0"><path d="M377.5 73.5l17 17M394.5 73.5l-17 17" class="fig-loose-stroke" stroke-width="2.8" fill="none" stroke-linecap="round"/></g><g class="aim-iss-t-dragging_initial_flick" style="animation-name:aimIssTravel_dragging_initial_flick"><circle cx="80" cy="82" r="8" class="fig-loose-stroke" stroke-width="2.2" fill="none"/><path d="M67 82H76M84 82H93M80 69V78M80 86V95" class="fig-loose-stroke" stroke-width="2.2"/></g><rect x="80" y="112" width="73.4" height="14" rx="6" class="fig-ink-fill" opacity="0.7"/><text x="116.7" y="119" class="fig-surface" text-anchor="middle" font-size="11" font-weight="700" dominant-baseline="central">Flick</text><rect x="155.4" y="112" width="264.5" height="14" rx="6" class="fig-loose-fill" opacity="1.0"/><text x="287.65" y="119" class="fig-surface" text-anchor="middle" font-size="11" font-weight="700" dominant-baseline="central">Brake</text><rect x="421.9" y="112" width="37" height="14" rx="6" class="fig-loose-fill" opacity="0.45"/><text x="469.9" y="123" class="fig-loose-fill" text-anchor="start" font-size="12" font-weight="600">293 ms</text><text x="20" y="148" class="fig-muted fig-caption" text-anchor="start" font-size="12" font-weight="600">steady as it arrives</text><text x="580" y="148" class="fig-muted fig-caption" text-anchor="end" font-size="12" font-weight="600">shot misses short</text></svg>
