ght="104" rx="6" class="fig-cool-stroke" stroke-width="2.4" fill="none" stroke-dasharray="7 5"/><text x="570" y="238" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">passes through the world</text></svg>
