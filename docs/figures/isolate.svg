<svg viewBox="0 0 760 300" class="fig-fit" role="img" aria-labelledby="fig-isolate-title"><title id="fig-isolate-title">On the left, three demands feed into a single score, so when the score moves the cause is unknown. On the right, the drill is split so two demands feed two separate scores, and a change in either is readable.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimIsoIn{0%{opacity:0}6%{opacity:1}100%{opacity:1}}.aim-iso-in{opacity:0;animation-name:aimIsoIn;animation-iteration-count:infinite;animation-duration:5.4s}@keyframes aimIsoOut{0%{opacity:0}30%{opacity:0}38%{opacity:1}100%{opacity:1}}.aim-iso-out{opacity:0;animation-name:aimIsoOut;animation-iteration-count:infinite;animation-duration:5.4s}@media (prefers-reduced-motion:reduce){.aim-iso-in,.aim-iso-out{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="238" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Three demands</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">one number, three reasons</tspan></text><g class="aim-iso-in" style="animation-delay:0.00s"><rect x="36" y="92" width="130" height="34" rx="8" class="fig-panel fig-grid-stroke" stroke-width="2"/><text x="101" y="109" class="fig-muted" text-anchor="middle" font-size="12" font-weight="600" dominant-baseline="central">acquisition</text></g><path d="M170 109L226 136" class="fig-grid-stroke" stroke-width="2" opacity="0.6"/><g class="aim-iso-in" style="animation-delay:0.40s"><rect x="36" y="136" width="130" height="34" rx="8" class="fig-panel fig-grid-stroke" stroke-width="2"/><text x="101" y="153" class="fig-muted" text-anchor="middle" font-size="12" font-weight="600" dominant-baseline="central">tracking</text></g><path d="M170 153L226 136" class="fig-grid-stroke" stroke-width="2" opacity="0.6"/><g class="aim-iso-in" style="animation-delay:0.80s"><rect x="36" y="180" width="130" height="34" rx="8" class="fig-panel fig-grid-stroke" stroke-width="2"/><text x="101" y="197" class="fig-muted" text-anchor="middle" font-size="12" font-weight="600" dominant-baseline="central">movement</text></g><path d="M170 197L226 136" class="fig-grid-stroke" stroke-width="2" opacity="0.6"/><g class="aim-iso-out"><text x="280" y="130" class="fig-tense-fill" text-anchor="middle" font-size="16" font-weight="700">one score</text><text x="280" y="154" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">moved: unknown</text></g><rect x="392" y="46" width="356" height="238" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Split in two</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">one reason each</tspan></text><g class="aim-iso-in" style="animation-delay:0.00s"><rect x="416" y="92" width="130" height="34" rx="8" class="fig-panel fig-grid-stroke" stroke-width="2"/><text x="481" y="109" class="fig-muted" text-anchor="middle" font-size="12" font-weight="600" dominant-baseline="central">acquisition</text></g><path d="M550 109H606" class="fig-grid-stroke" stroke-width="2" opacity="0.6"/><g class="aim-iso-in" style="animation-delay:0.40s"><rect x="416" y="136" width="130" height="34" rx="8" class="fig-panel fig-grid-stroke" stroke-width="2"/><text x="481" y="153" class="fig-muted" text-anchor="middle" font-size="12" font-weight="600" dominant-baseline="central">tracking</text></g><path d="M550 153H606" class="fig-grid-stroke" stroke-width="2" opacity="0.6"/><g class="aim-iso-out" style="animation-delay:0.00s"><text x="660" y="114" class="fig-balanced-fill" text-anchor="middle" font-size="15" font-weight="700">score A</text></g><g class="aim-iso-out" style="animation-delay:0.30s"><text x="660" y="158" class="fig-balanced-fill" text-anchor="middle" font-size="15" font-weight="700">score B</text></g><g class="aim-iso-out"><text x="660" y="204" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">moved: readable</text></g></svg>
