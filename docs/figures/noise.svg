<svg viewBox="0 0 760 290" class="fig-fit" role="img" aria-labelledby="fig-noise-title"><title id="fig-noise-title">Twelve scores from the same scenario appearing one at a time, scattered up and down so that neighbouring runs disagree. Once all twelve are shown, a rising line through them appears, which no single run would have revealed.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimNoiseDot{0%{opacity:0}3%{opacity:1}100%{opacity:1}}.aim-noise-dot{opacity:0;animation-name:aimNoiseDot;animation-iteration-count:infinite;animation-duration:6.0s}@keyframes aimNoiseLine{0%{opacity:0}74%{opacity:0}82%{opacity:1}100%{opacity:1}}.aim-noise-line{opacity:0;animation-name:aimNoiseLine;animation-iteration-count:infinite;animation-duration:6.0s}@media (prefers-reduced-motion:reduce){.aim-noise-dot,.aim-noise-line{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="736" height="228" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Twelve runs of the same scenario</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">the trend, not the run</tspan></text><circle cx="80.0" cy="232.1" r="7" class="fig-target aim-noise-dot" style="animation-delay:0.00s"/><circle cx="136.4" cy="227.7" r="7" class="fig-target aim-noise-dot" style="animation-delay:0.37s"/><circle cx="192.7" cy="219.1" r="7" class="fig-target aim-noise-dot" style="animation-delay:0.74s"/><circle cx="249.1" cy="171.4" r="7" class="fig-target aim-noise-dot" style="animation-delay:1.12s"/><circle cx="305.5" cy="192.2" r="7" class="fig-target aim-noise-dot" style="animation-delay:1.49s"/><circle cx="361.8" cy="177.9" r="7" class="fig-target aim-noise-dot" style="animation-delay:1.86s"/><circle cx="418.2" cy="177.7" r="7" class="fig-target aim-noise-dot" style="animation-delay:2.23s"/><circle cx="474.5" cy="151.3" r="7" class="fig-target aim-noise-dot" style="animation-delay:2.60s"/><circle cx="530.9" cy="148.9" r="7" class="fig-target aim-noise-dot" style="animation-delay:2.98s"/><circle cx="587.3" cy="156.4" r="7" class="fig-target aim-noise-dot" style="animation-delay:3.35s"/><circle cx="643.6" cy="139.1" r="7" class="fig-target aim-noise-dot" style="animation-delay:3.72s"/><circle cx="700.0" cy="145.7" r="7" class="fig-target aim-noise-dot" style="animation-delay:4.09s"/><path d="M80 210L700 148" class="fig-accent-stroke aim-noise-line" stroke-width="3" stroke-linecap="round"/><text x="80" y="252" class="fig-muted" text-anchor="start" font-size="13" font-weight="500">run 1</text><text x="700" y="252" class="fig-muted" text-anchor="end" font-size="13" font-weight="500">run 12</text></svg>
