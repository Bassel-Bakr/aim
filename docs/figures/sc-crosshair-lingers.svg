<svg viewBox="0 0 600 180" class="fig-fit" role="img" aria-labelledby="fig-sc-crosshair-lingers-title"><title id="fig-sc-crosshair-lingers-title">The crosshair slows early and finishes its travel just short of the target, then holds there. Its trail dots crowd into that last short stretch, and the shot goes from where it stopped rather than from the target. Every dot is one tick of one clock, so where the dots crowd the crosshair was slow.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimSym2Runs3{0%{transform:translate(0px,0px)}2.381%{transform:translate(14px,0px)}4.762%{transform:translate(50px,0px)}7.143%{transform:translate(98.5px,0px)}9.524%{transform:translate(150.4px,0px)}11.9%{transform:translate(196.4px,0px)}14.29%{transform:translate(227.2px,0px)}16.67%{transform:translate(234.9px,0px)}19.05%{transform:translate(239.5px,0px)}21.43%{transform:translate(248.6px,0px)}23.81%{transform:translate(260.7px,0px)}26.19%{transform:translate(274.2px,0px)}28.57%{transform:translate(287.7px,0.1px)}30.95%{transform:translate(299.5px,0.1px)}33.33%{transform:translate(308px,0px)}35.71%{transform:translate(311.6px,-0.1px)}38.1%{transform:translate(312.3px,-0.2px)}40.48%{transform:translate(314.4px,-0.2px)}42.86%{transform:translate(318px,0px)}45.24%{transform:translate(322.4px,0.2px)}47.62%{transform:translate(327.2px,0.3px)}50%{transform:translate(332.1px,0.3px)}52.38%{transform:translate(336.8px,0.1px)}54.76%{transform:translate(341.3px,-0.2px)}57.14%{transform:translate(345px,-0.3px)}59.52%{transform:translate(347.5px,-0.3px)}61.9%{transform:translate(348.4px,-0.1px)}64.29%{transform:translate(348.6px,0.1px)}66.67%{transform:translate(349.5px,0.3px)}69.05%{transform:translate(351.2px,0.3px)}71.43%{transform:translate(353.3px,0.2px)}73.81%{transform:translate(355.5px,0px)}76.19%{transform:translate(357.7px,-0.3px)}78.57%{transform:translate(359.9px,-0.3px)}80.95%{transform:translate(362px,-0.3px)}83.33%{transform:translate(364.1px,0px)}85.71%{transform:translate(365.7px,0.2px)}88.1%{transform:translate(366.5px,0.3px)}90.48%{transform:translate(366.6px,0.3px)}92.86%{transform:translate(366.5px,0.1px)}95.24%{transform:translate(366.6px,-0.2px)}97.62%{transform:translate(366.7px,-0.3px)}100%{transform:translate(366.8px,-0.3px)}}@keyframes aimSym2Shots3{0%{opacity:0}96%{opacity:0}96.5%{opacity:1}100%{opacity:1}}.aim-sym2-run,.aim-sym2-take,.aim-sym2-mark{animation-duration:3.8s;animation-timing-function:linear;animation-iteration-count:infinite;animation-delay:-1.6s}@media(prefers-reduced-motion:reduce){.aim-sym2-run,.aim-sym2-take{animation-play-state:paused}.aim-sym2-mark{animation:none!important;opacity:1!important}}</style><rect x="1" y="1" width="598" height="178" rx="12" class="fig-panel"/><text x="22" y="28"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Crosshair lingers, no micros</tspan></text><text x="22" y="47" class="fig-muted fig-note" text-anchor="start" font-size="13" font-weight="500">it stops a little short and stays there</text><path d="M72 106H540" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><path d="M92 97v18" class="fig-grid-stroke" stroke-width="1.5"/><path d="M92 98L157.2 98L274.3 98L326.9 98L344.4 98L375.3 98.1L400 98L404.8 97.8L412.8 98.1L424.1 98.3L434.6 97.8L440.3 97.8L441.5 98.3L446 98.1L451.1 97.7L456.1 98L458.6 98.3L458.5 97.9L458.8 97.7" class="fig-accent-stroke" stroke-width="1.5" fill="none" opacity=".28" stroke-linejoin="round"/><g class="fig-accent-fill" opacity=".5"><circle cx="157.2" cy="98" r="2.2"/><circle cx="274.3" cy="98" r="2.2"/><circle cx="326.9" cy="98" r="2.2"/><circle cx="344.4" cy="98" r="2.2"/