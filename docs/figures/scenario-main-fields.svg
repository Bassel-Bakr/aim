<svg viewBox="0 0 760 532" class="fig-fit" role="img" aria-labelledby="fig-smainfields-title"><title id="fig-smainfields-title">Scenario Main tab, every field. One strip per field, each naming the setting, describing it, and demonstrating a low and a high state side by side.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@media (prefers-reduced-motion:reduce){[class*='aim-smainfields0-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@keyframes aimsmainfields1o0{0%{opacity:0.15}12%{opacity:1}100%{opacity:1}}.aim-smainfields1-0{opacity:0.15;animation-name:aimsmainfields1o0;animation-duration:4.0s;animation-iteration-count:infinite}@keyframes aimsmainfields1o1{0%{opacity:0.15}12%{opacity:1}100%{opacity:1}}.aim-smainfields1-1{opacity:0.15;animation-name:aimsmainfields1o1;animation-duration:4.0s;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){[class*='aim-smainfields1-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}@keyframes aimsmainfields2o0{0%{opacity:0.15}12%{opacity:1}100%{opacity:1}}.aim-smainfields2-0{opacity:0.15;animation-name:aimsmainfields2o0;animation-duration:4.0s;animation-iteration-count:infinite}@keyframes aimsmainfields2o1{0%{opacity:0.15}12%{opacity:1}100%{opacity:1}}.aim-smainfields2-1{opacity:0.15;animation-name:aimsmainfields2o1;animation-duration:4.0s;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){[class*='aim-smainfields2-']{animation-play-state:paused;animation-delay:-1.20s!important;opacity:1}}</style><text x="12" y="26" class="fig-ink" text-anchor="start" font-size="16" font-weight="700">Scenario Main tab, every field</text><text x="12" y="44" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">The inventory: what may appear, not what does.</text><g transform="translate(0,52)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Scenario Name</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">What the scenario is called. It</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">is what a reader searches for</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">and what their score is filed</text><text x="12" y="120" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">under.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">unnamed</text><rect x="318.0" y="62" width="132" height="28" rx="5" class="fig-panel fig-grid-stroke" stroke-width="1.6"/><text x="384.0" y="110" class="fig-muted" text-anchor="middle" font-size="10" font-weight="500">blank</text><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">named</text><rect x="564.0" y="62" width="132" height="28" rx="5" class="fig-panel fig-grid-stroke" stroke-width="1.6"/><rect x="576.0" y="72" width="22" height="8" rx="3" class="fig-muted" opacity="0.75"/><rect x="606.0" y="72" width="18" height="8" rx="3" class="fig-muted" opacity="0.75"/><rect x="636.0" y="72" width="14" height="8" rx="3" class="fig-muted" opacity="0.75"/><text x="630.0" y="110" class="fig-muted" text-anchor="middle" font-size="10" font-weight="500">carries a name</text></g><g transform="translate(0,212)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Player Characters</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">The character profiles a player</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">may use in this scenario. Adding</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">one makes it available; it does</text><text x="12" y="120" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">not put it into a challenge run.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">none added</text><rect x="320.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="324.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-smainfields1-0" style="animation-delay:0.00s"/><rect x="354.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="388.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="422.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">a character</text><rect x="566.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="570.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-smainfields1-1" style="animation-delay:0.00s"/><rect x="600.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="604.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-smainfields1-1" style="animation-delay:0.20s"/><rect x="634.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="638.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-smainfields1-1" style="animation-delay:0.40s"/><rect x="668.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/></g><g transform="translate(0,372)"><text x="12" y="54" class="fig-ink" text-anchor="start" font-size="14" font-weight="700">Bots</text><text x="12" y="72" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">The bot profiles this scenario</text><text x="12" y="88" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">may spawn. Same rule: this is</text><text x="12" y="104" class="fig-muted" text-anchor="start" font-size="11" font-weight="500">the inventory, not the rules.</text><rect x="268" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="384.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">none added</text><rect x="320.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="324.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-smainfields2-0" style="animation-delay:0.00s"/><rect x="354.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="388.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="422.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="514" y="34" width="232" height="102" rx="8" class="fig-panel"/><text x="630.0" y="152" class="fig-muted" text-anchor="middle" font-size="11" font-weight="600">a bot</text><rect x="566.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="570.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-smainfields2-1" style="animation-delay:0.00s"/><rect x="600.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="604.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-smainfields2-1" style="animation-delay:0.20s"/><rect x="634.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/><rect x="638.0" y="67" width="18" height="18" rx="4" class="fig-accent-fill aim-smainfields2-1" style="animation-delay:0.40s"/><rect x="668.0" y="63" width="26" height="26" rx="6" class="fig-grid-stroke" stroke-width="1.8" fill="none"/></g></svg>
