<svg viewBox="0 0 760 300" class="fig-fit" role="img" aria-labelledby="fig-scoring-title"><title id="fig-scoring-title">The same nine shots, five hits and four misses, scored twice. A model paying only for hits reaches fifty. A model subtracting for misses reaches ten. The run was identical in both cases.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimScoreShot{0%{opacity:0}4%{opacity:1}100%{opacity:1}}.aim-score-shot{opacity:0;animation-name:aimScoreShot;animation-iteration-count:infinite;animation-duration:5.6s}@media (prefers-reduced-motion:reduce){.aim-score-shot{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="238" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Hits only</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">rewards volume</tspan></text><g class="aim-score-shot" style="animation-delay:0.00s"><circle cx="54" cy="126" r="9" class="fig-target"/><text x="54" y="162" class="fig-balanced-fill" text-anchor="middle" font-size="12" font-weight="700">+10</text></g><g class="aim-score-shot" style="animation-delay:0.42s"><path d="M81 119l14 14M95 119l-14 14" class="fig-muted-stroke" stroke-width="2.4"/><text x="88" y="162" class="fig-muted" text-anchor="middle" font-size="12" font-weight="700">0</text></g><g class="aim-score-shot" style="animation-delay:0.84s"><circle cx="122" cy="126" r="9" class="fig-target"/><text x="122" y="162" class="fig-balanced-fill" text-anchor="middle" font-size="12" font-weight="700">+10</text></g><g class="aim-score-shot" style="animation-delay:1.26s"><circle cx="156" cy="126" r="9" class="fig-target"/><text x="156" y="162" class="fig-balanced-fill" text-anchor="middle" font-size="12" font-weight="700">+10</text></g><g class="aim-score-shot" style="animation-delay:1.68s"><path d="M183 119l14 14M197 119l-14 14" class="fig-muted-stroke" stroke-width="2.4"/><text x="190" y="162" class="fig-muted" text-anchor="middle" font-size="12" font-weight="700">0</text></g><g class="aim-score-shot" style="animation-delay:2.10s"><circle cx="224" cy="126" r="9" class="fig-target"/><text x="224" y="162" class="fig-balanced-fill" text-anchor="middle" font-size="12" font-weight="700">+10</text></g><g class="aim-score-shot" style="animation-delay:2.52s"><path d="M251 119l14 14M265 119l-14 14" class="fig-muted-stroke" stroke-width="2.4"/><text x="258" y="162" class="fig-muted" text-anchor="middle" font-size="12" font-weight="700">0</text></g><g class="aim-score-shot" style="animation-delay:2.94s"><circle cx="292" cy="126" r="9" class="fig-target"/><text x="292" y="162" class="fig-balanced-fill" text-anchor="middle" font-size="12" font-weight="700">+10</text></g><g class="aim-score-shot" style="animation-delay:3.36s"><path d="M319 119l14 14M333 119l-14 14" class="fig-muted-stroke" stroke-width="2.4"/><text x="326" y="162" class="fig-muted" text-anchor="middle" font-size="12" font-weight="700">0</text></g><g class="aim-score-shot" style="animation-delay:4.03s"><text x="190" y="200" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">5 hits at +10</text><text x="190" y="232" class="fig-accent-text" text-anchor="middle" font-size="20" font-weight="700">total 50</text></g><rect x="392" y="46" width="356" height="238" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Hits minus misses</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">rewards restraint</tspan></text><g class="aim-score-shot" style="animation-delay:0.00s"><circle cx="434" cy="126" r="9" class="fig-target"/><text x="434" y="162" class="fig-balanced-fill" text-anchor="middle" font-size="12" font-weight="700">+10</text></g><g class="aim-score-shot" style="animation-delay:0.42s"><path d="M461 119l14 14M475 119l-14 14" class="fig-muted-stroke" stroke-width="2.4"/><text x="468" y="162" class="fig-tense-fill" text-anchor="middle" font-size="12" font-weight="700">-10</text></g><g class="aim-score-shot" style="animation-delay:0.84s"><circle cx="502" cy="126" r="9" class="fig-target"/><text x="502" y="162" class="fig-balanced-fill" text-anchor="middle" font-size="12" font-weight="700">+10</text></g><g class="aim-score-shot" style="animation-delay:1.26s"><circle cx="536" cy="126" r="9" class="fig-target"/><text x="536" y="162" class="fig-balanced-fill" text-anchor="middle" font-size="12" font-weight="700">+10</text></g><g class="aim-score-shot" style="animation-delay:1.68s"><path d="M563 119l14 14M577 119l-14 14" class="fig-muted-stroke" stroke-width="2.4"/><text x="570" y="162" class="fig-tense-fill" text-anchor="middle" font-size="12" font-weight="700">-10</text></g><g class="aim-score-shot" style="animation-delay:2.10s"><circle cx="604" cy="126" r="9" class="fig-target"/><text x="604" y="162" class="fig-balanced-fill" text-anchor="middle" font-size="12" font-weight="700">+10</text></g><g class="aim-score-shot" style="animation-delay:2.52s"><path d="M631 119l14 14M645 119l-14 14" class="fig-muted-stroke" stroke-width="2.4"/><text x="638" y="162" class="fig-tense-fill" text-anchor="middle" font-size="12" font-weight="700">-10</text></g><g class="aim-score-shot" style="animation-delay:2.94s"><circle cx="672" cy="126" r="9" class="fig-target"/><text x="672" y="162" class="fig-balanced-fill" text-anchor="middle" font-size="12" font-weight="700">+10</text></g><g class="aim-score-shot" style="animation-delay:3.36s"><path d="M699 119l14 14M713 119l-14 14" class="fig-muted-stroke" stroke-width="2.4"/><text x="706" y="162" class="fig-t