<svg viewBox="0 0 600 180" class="fig-fit" role="img" aria-labelledby="fig-sc-wider-flicks-ruin-pacing-title"><title id="fig-sc-wider-flicks-ruin-pacing-title">On a wide flick the crosshair carries out past the target and has to come back, so its trail loops out above the line and returns below it. Most of the loop goes on that return, and the shot waits for it. Every dot is one tick of one clock, so where the dots crowd the crosshair was slow.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimSym2Runs4{0%{transform:translate(0px,0px)}2.381%{transform:translate(9.3px,0px)}4.762%{transform:translate(34.9px,0px)}7.143%{transform:translate(73.5px,0px)}9.524%{transform:translate(121.7px,0px)}11.9%{transform:translate(176.3px,0px)}14.29%{transform:translate(233.7px,0px)}16.67%{transform:translate(290.8px,0px)}19.05%{transform:translate(344.1px,0px)}21.43%{transform:translate(390.4px,0px)}23.81%{transform:translate(426.2px,0.1px)}26.19%{transform:translate(448.1px,0.3px)}28.57%{transform:translate(453.3px,0.3px)}30.95%{transform:translate(450.3px,0.1px)}33.33%{transform:translate(444.2px,-0.4px)}35.71%{transform:translate(435.6px,-0.9px)}38.1%{transform:translate(425px,-1px)}40.48%{transform:translate(413.2px,-0.5px)}42.86%{transform:translate(401.9px,0.5px)}45.24%{transform:translate(392.4px,1.4px)}47.62%{transform:translate(385.2px,1.6px)}50%{transform:translate(380.2px,1px)}52.38%{transform:translate(378px,-0.2px)}54.76%{transform:translate(377.3px,-1.3px)}57.14%{transform:translate(377.4px,-1.7px)}59.52%{transform:translate(378.1px,-1.2px)}61.9%{transform:translate(378.8px,-0.1px)}64.29%{transform:translate(378.5px,1.1px)}66.67%{transform:translate(377.7px,1.7px)}69.05%{transform:translate(377.2px,1.4px)}71.43%{transform:translate(377.6px,0.4px)}73.81%{transform:translate(378.4px,-0.8px)}76.19%{transform:translate(378.8px,-1.7px)}78.57%{transform:translate(378.2px,-1.6px)}80.95%{transform:translate(377.4px,-0.7px)}83.33%{transform:translate(377.3px,0.5px)}85.71%{transform:translate(377.9px,1.5px)}88.1%{transform:translate(378.7px,1.7px)}90.48%{transform:translate(378.7px,1px)}92.86%{transform:translate(377.9px,-0.2px)}95.24%{transform:translate(377.3px,-1.3px)}97.62%{transform:translate(377.4px,-1.7px)}100%{transform:translate(378.3px,-1.3px)}}@keyframes aimSym2Shots4{0%{opacity:0}60%{opacity:0}60.5%{opacity:1}100%{opacity:1}}.aim-sym2-run,.aim-sym2-take,.aim-sym2-mark{animation-duration:3.8s;animation-timing-function:linear;animation-iteration-count:infinite;animation-delay:-1.6s}@media(prefers-reduced-motion:reduce){.aim-sym2-run,.aim-sym2-take{animation-play-state:paused}.aim-sym2-mark{animation:none!important;opacity:1!important}}</style><rect x="1" y="1" width="598" height="178" rx="12" class="fig-panel"/><text x="22" y="28"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Wider flicks ruin pacing</tspan></text><text x="22" y="47" class="fig-muted fig-note" text-anchor="start" font-size="13" font-weight="500">the wide one runs long, and the clock keeps running</text><path d="M72 106H540" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><path d="M92 97v18" class="fig-grid-stroke" stroke-width="1.5"/><path d="M92 98L138.5 98L249.6 98L382.8 98L495.7 98L545.4 98.3L536.2 113.6L513.1 113.1L487.3 115.1L472.2 115L469.2 112.4L470.6 97.5L469.7 99.7L469.9 98L470.5 96.3L469.3 98.5L470.8 99.6L469.4 97L470.3 96.7" class="fig-accent-stroke" stroke-width="1.5" fill="none" opacity=".28" stroke-linejoin="round"/><g class="fig-accent-fill" opacity=".5"><circle cx="138.5" cy="98" r="2.2"/><circle cx="249.6" cy="98" r="2.2"/><circle cx="382.8" cy="98" r="2.2"