<svg viewBox="0 0 760 300" class="fig-fit" role="img" aria-labelledby="fig-wiring-title"><title id="fig-wiring-title">A bot profile at the top pointing to a character profile, a dodge profile and an aim profile. A fourth box, the weapon list, hangs off the character profile rather than off the bot.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimWireIn{0%{opacity:0}8%{opacity:1}100%{opacity:1}}.aim-wire-in{opacity:0;animation-name:aimWireIn;animation-iteration-count:infinite;animation-duration:5.4s}@media (prefers-reduced-motion:reduce){.aim-wire-in{opacity:1;animation:none!important}}</style><defs><marker id="fig-wire-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="fig-grid-fill"/></marker></defs><g class="aim-wire-in" style="animation-delay:0.00s"><rect x="300" y="26" width="160" height="52" rx="10" class="fig-panel fig-ink-stroke" stroke-width="2"/><text x="380.0" y="48" class="fig-ink" text-anchor="middle" font-size="15" font-weight="700">Bot</text><text x="380.0" y="67" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">names the others</text></g><g class="aim-wire-in" style="animation-delay:0.40s"><path d="M380.0 78V104.0H135.0V130" class="fig-grid-stroke" stroke-width="2" fill="none" marker-end="url(#fig-wire-arrow)"/></g><g class="aim-wire-in" style="animation-delay:0.40s"><rect x="40" y="130" width="190" height="56" rx="10" class="fig-panel fig-ink-stroke" stroke-width="2"/><text x="135.0" y="152" class="fig-ink" text-anchor="middle" font-size="15" font-weight="700">Character</text><text x="135.0" y="1