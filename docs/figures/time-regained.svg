<svg viewBox="0 0 760 290" class="fig-fit" role="img" aria-labelledby="fig-timeregained-title"><title id="fig-timeregained-title">Two countdown bars. Without time regained the bar empties once and every run is the same length. With it set, three kills each add time, so the run stretches and two scores are no longer measured over the same clock.</title><defs><marker id="fig-trg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="fig-accent-fill"/></marker></defs><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimTrgTick{0%{transform:scaleX(1)}100%{transform:scaleX(0)}}.aim-trg-clock{transform-box:fill-box;transform-origin:left center;animation-name:aimTrgTick;animation-iteration-count:infinite;animation-duration:6.0s;animation-timing-function:linear}@keyframes aimTrgAdd{0%{opacity:0}4%{opacity:1}22%{opacity:1}30%{opacity:0}100%{opacity:0}}.aim-trg-add{opacity:0;animation-name:aimTrgAdd;animation-iteration-count:infinite;animation-duration:6.0s}@media (prefers-reduced-motion:reduce){.aim-trg-clock{animation:none!important;transform:none!important}.aim-trg-add{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="216" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Regain 0</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">every run is the same length</tspan></text><rect x="42" y="128" width="296" height="26" rx="8" class="fig-grid-fill" opacity="0.4"/><rect x="42" y="128" width="296" height="26" rx="8" class="fig-balanced-fill aim-trg-clock" style="animation-duration:6.00s"/><text x="190" y="118" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">time remaining</text><text x="190" y="244" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">two scores over one clock</text><rect x="392" y="46" width="356" height="216" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Regain set</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">a good run lasts longer</tspan></text><rect x="422" y="128" width="296" height="26" rx="8" class="fig-grid-fill" opacity="0.4"/><rect x="422" y="128" width="296" height="26" rx="8" class="fig-balanced-fill aim-trg-clock" style="animation-duration:11.04s"/><text x="570" y="118" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">time remaining</text><g class="aim-trg-add" style="animation-delay:1.80s"><path d="M510.8 170V190" class="fig-accent-stroke" stroke-width="2.4" marker-end="url(#fig-trg-arrow)"/><text x="510.8" y="208" class="fig-accent-text" text-anchor="middle" font-size="12" font-weight="700">+ kill</text></g><g class="aim-trg-add" style="animation-delay:3.30s"><path d="M584.8 170V190" class="fig-accent-stroke" stroke-width="2.4" marker-end="url(#fig-trg-arrow)"/><text x="584.8" y="208" class="fig-accent-text" text-anchor="middle" font-size="12" font-weight="700">+ kill</text></g><g class="aim-trg-add" style="animation-delay:4.68s"><path d="M652.9 170V190" class="fig-accent-stroke" stroke-width="2.4" marker-end="url(#fig-trg-arrow)"/><text x="652.88" y="208" class="fig-accent-text" text-anchor="middle" font-size="12" font-weight="700">+ kill</text></g><text x="570" y="244" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">two scores over different clocks</text></svg>
