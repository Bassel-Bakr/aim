<svg viewBox="0 0 760 250" role="img" aria-labelledby="fig-scale-title"><title id="fig-scale-title">A tension scale from too loose to too tight. Too loose lags behind and stops. Balanced is a firm hold and one continuous motion. Too tight jitters ahead, overcorrects and locks out.</title><defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="fig-grid-fill"/></marker></defs><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><rect x="43.0" y="92" width="220.7" height="16" rx="8" class="fig-loose-fill" opacity="0.85"/><text x="153.33333333333331" y="76" class="fig-ink" text-anchor="middle" font-size="18" font-weight="700">Too loose</text><text x="153.33333333333331" y="144" class="fig-muted" text-anchor="middle" font-size="17" font-weight="500">Lags behind the target</text><text x="153.33333333333331" y="172" class="fig-muted" text-anchor="middle" font-size="17" font-weight="500">Stops and restarts</text><text x="153.33333333333331" y="200" class="fig-muted" text-anchor="middle" font-size="17" font-weight="500">Feels sluggish</text><rect x="269.7" y="92" width="220.7" height="16" rx="8" class="fig-balanced-fill" opacity="1"/><text x="379.99999999999994" y="76" class="fig-ink" text-anchor="middle" font-size="18" font-weight="700">Balanced</text><text x="379.99999999999994" y="144" class="fig-muted" text-anchor="middle" font-size="17" font-weight="500">Firm, not hard, hold</text><text x="379.99999999999994" y="172" class="fig-muted" text-anchor="middle" font-size="17" font-weight="500">One continuous motion</text><text x="379.99999999999994" y="200" class="fig-muted" text-anchor="middle" font-size="17" font-weight="500">Releases after a flick</text><rect x="496.3" y="92" width="220.7" height="16" rx="8" class="fig-tense-fill" opacity="0.85"/><text x="606.6666666666666" y="76" class="fig-ink" text-anchor="middle" font-size="18" font-weight="700">Too tight</text><text x="606.6666666666666" y="144" class="fig-muted" text-anchor="middle" font-size="17" font-weight="500">Jitters ahead of the target</text><text x="606.6666666666666" y="172" class="fig-muted" text-anchor="middle" font-size="17" font-weight="500">Skips and overcorrects</text><text x="606.6666666666666" y="200" class="fig-muted" text-anchor="middle" font-size="17" font-weight="500">Tires fast, locks out</text><path d="M371.0 48 L389.0 48 L380.0 58 Z" class="fig-ink-fill"/><text x="40" y="22" class="fig-muted" text-anchor="start" font-size="13" font-weight="500">less grip force</text><text x="720" y="22" class="fig-muted" text-anchor="end" font-size="13" font-weight="500">more grip force</text><path d="M160 18 L600 18" class="fig-grid-stroke" stroke-width="1.5" marker-end="url(#fig-arrow)"/></svg>
