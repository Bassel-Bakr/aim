<svg viewBox="0 0 760 330" class="fig-fit" role="img" aria-labelledby="fig-aimcone-title"><title id="fig-aimcone-title">A bot with a shaded cone spreading out in front of it, marked as the range where it aims well. A crosshair moves down out of the cone and back, and a note says that stepping outside it means fighting a worse opponent.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>.aim-cone-anim{animation-timing-function:linear;animation-iteration-count:infinite;animation-duration:5.6s}@keyframes aimConeWarn{0%{opacity:0}30%{opacity:0}38%{opacity:1}62%{opacity:1}70%{opacity:0}100%{opacity:0}}.aim-cone-warn{opacity:0;animation-name:aimConeWarn;animation-iteration-count:infinite;animation-duration:5.6s}@media (prefers-reduced-motion:reduce){.aim-cone-anim{animation-play-state:paused;animation-delay:-0.67s!important}.aim-cone-warn{opacity:1;animation:none!important}}@keyframes aimConeYou{0%{transform:translate(0,0.0px)}2.083%{transform:translate(0,0.5px)}4.167%{transform:translate(0,1.9px)}6.25%{transform:translate(0,4.1px)}8.333%{transform:translate(0,7.1px)}10.42%{transform:translate(0,10.8px)}12.5%{transform:translate(0,15.0px)}14.58%{transform:translate(0,19.7px)}16.67%{transform:translate(0,24.9px)}18.75%{transform:translate(0,30.4px)}20.83%{transform:translate(0,36.1px)}22.92%{transform:translate(0,42.0px)}25%{transform:translate(0,48.0px)}27.08%{transform:translate(0,54.0px)}29.17%{transform:translate(0,59.9px)}31.25%{transform:translate(0,65.6px)}33.33%{transform:translate(0,71.1px)}35.42%{transform:translate(0,76.3px)}37.5%{transform:translate(0,81.0px)}39.58%{transform:translate(0,85.2px)}41.67%{transform:translate(0,88.9px)}43.75%{transform:translate(0,91.9px)}45.83%{transform:translate(0,94.1px)}47.92%{transform:translate(0,95.5px)}50%{transform:translate(0,96.0px)}52.08%{transform:translate(0,95.5px)}54.17%{transform:translate(0,94.1px)}56.25%{transform:translate(0,91.9px)}58.33%{transform:translate(0,88.9px)}60.42%{transform:translate(0,85.2px)}62.5%{transform:translate(0,81.0px)}64.58%{transform:translate(0,76.3px)}66.67%{transform:translate(0,71.1px)}68.75%{transform:translate(0,65.6px)}70.83%{transform:translate(0,59.9px)}72.92%{transform:translate(0,54.0px)}75%{transform:translate(0,48.0px)}77.08%{transform:translate(0,42.0px)}79.17%{transform:translate(0,36.1px)}81.25%{transform:translate(0,30.4px)}83.33%{transform:translate(0,24.9px)}85.42%{transform:translate(0,19.7px)}87.5%{transform:translate(0,15.0px)}89.58%{transform:translate(0,10.8px)}91.67%{transform:translate(0,7.1px)}93.75%{transform:translate(0,4.1px)}95.83%{transform:translate(0,1.9px)}97.92%{transform:translate(0,0.5px)}100%{transform:translate(0,0.0px)}}.aim-cone-you{animation-name:aimConeYou}</style><rect x="12" y="46" width="736" height="256" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Optimal aim FOV</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">where the bot is actually dangerous</tspan></text><path d="M176 168L628 82L628 214Z" class="fig-tense-fill" opacity="0.16"/><path d="M176 168L628 82M176 168L628 214" class="fig-tense-stroke" stroke-width="2" stroke-dasharray="6 5"/><text x="476" y="154" class="fig-tense-fill" text-anchor="middle" font-size="13" font-weight="700">inside: it aims well</text><text x="476" y="254" class="fig-muted" text-anchor="middle" font-size="13" font-weight="700">outside: the penalty degrades it</text><circle cx="176" cy="168" r="16" class="fig-target"/><text x="176" y="206" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">the bot</text><g class="ai