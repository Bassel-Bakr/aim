<svg viewBox="0 0 760 290" class="fig-fit" role="img" aria-labelledby="fig-adapt-title"><title id="fig-adapt-title">The same nine rising scores in two panels. Under static the difficulty line is flat, so the rise is improvement against a fixed bar. Under adapt the difficulty line rises alongside the scores, so the same rise says much less.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimAdpDot{0%{opacity:0}4%{opacity:1}100%{opacity:1}}.aim-adp-dot{opacity:0;animation-name:aimAdpDot;animation-iteration-count:infinite;animation-duration:6.0s}@media (prefers-reduced-motion:reduce){.aim-adp-dot{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="218" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Static</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">difficulty holds still</tspan></text><path d="M60 169.9H332" class="fig-balanced-stroke" stroke-width="2.4" stroke-dasharray="6 5"/><text x="190" y="254" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">difficulty</text><circle cx="60.0" cy="161.0" r="6" class="fig-target aim-adp-dot" style="animation-delay:0.00s"/><circle cx="94.0" cy="146.4" r="6" class="fig-target aim-adp-dot" style="animation-delay:0.42s"/><circle cx="128.0" cy="154.2" r="6" class="fig-target aim-adp-dot" style="animation-delay:0.84s"/><circle cx="162.0" cy="138.6" r="6" class="fig-target aim-adp-dot" style="animation-delay:1.26s"/><circle cx="196.0" cy="143.0" r="6" class="fig-target aim-adp-dot" style="animation-delay:1.68s"/><circle cx="230.0" cy="129.6" r="6" class="fig-target aim-adp-dot" style="animation-delay:2.10s"/><circle cx="264.0" cy="136.3" r="6" class="fig-target aim-adp-dot" style="animation-delay:2.52s"/><circle cx="298.0" cy="122.9" r="6" class="fig-target aim-adp-dot" style="animation-delay:2.94s"/><circle cx="332.0" cy="127.4" r="6" class="fig-target aim-adp-dot" style="animation-delay:3.36s"/><text x="190" y="232" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">your score rose against a fixed bar</text><rect x="392" y="46" width="356" height="218" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Adapt</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">difficulty chases you</tspan></text><polyline points="440.0 169.9 474.0 164.3 508.0 158.7 542.0 153.1 576.0 147.5 610.0 141.9 644.0 136.3 678.0 130.7 712.0 125.1" class="fig-tense-stroke" stroke-width="2.4" fill="none" stroke-dasharray="6 5"/><text x="570" y="254" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">difficulty</text><circle cx="440.0" cy="161.0" r="6" class="fig-target aim-adp-dot" style="animation-delay:0.00s"/><circle cx="474.0" cy="146.4" r="6" class="fig-target aim-adp-dot" style="animation-delay:0.42s"/><circle cx="508.0" cy="154.2" r="6" class="fig-target aim-adp-dot" style="animation-delay:0.84s"/><circle cx="542.0" cy="138.6" r="6" class="fig-target aim-adp-dot" style="animation-delay:1.26s"/><circle cx="576.0" cy="143.0" r="6" class="fig-target aim-adp-dot" style="animation-delay:1.68s"/><circle cx="610.0" cy="129.6" r="6" class="fig-target aim-adp-dot" style="animation-delay:2.10s"/><circle cx="644.0" cy="136.3" r="6" class="fig-target aim-adp-dot" style="animation-delay:2.52s"/><circle cx="678.0" cy="122.9" r="6" class="fig-target aim-adp-dot" style="animation-delay:2.94s"/><circle cx="712.0" cy="127.4" r="6" class="fig-target aim-adp-dot" style="animation-delay:3.36s"/><text x