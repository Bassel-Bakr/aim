<svg viewBox="0 0 760 290" class="fig-fit" role="img" aria-labelledby="fig-versions-title"><title id="fig-versions-title">Two second versions of the same scenario, each shown as five dials. In the first only one dial has moved and the result says what that dial does. In the second all five have moved and the result says nothing.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimVerIn{0%{opacity:0}8%{opacity:1}100%{opacity:1}}.aim-ver-in{opacity:0;animation-name:aimVerIn;animation-iteration-count:infinite;animation-duration:5.6s}@keyframes aimVerRead{0%{opacity:0}56%{opacity:0}64%{opacity:1}100%{opacity:1}}.aim-ver-read{opacity:0;animation-name:aimVerRead;animation-iteration-count:infinite;animation-duration:5.6s}@media (prefers-reduced-motion:reduce){.aim-ver-in,.aim-ver-read{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="218" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">One dial moved</tspan></text><text x="52" y="100" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">size</text><path d="M128 96H312" class="fig-grid-stroke" stroke-width="2" opacity="0.5"/><g class="aim-ver-in" style="animation-delay:0.00s"><circle cx="252" cy="96" r="7" class="fig-accent-fill"/></g><text x="52" y="130" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">spread</text><path d="M128 126H312" class="fig-grid-stroke" stroke-width="2" opacity="0.5"/><g class="aim-ver-in" style="animation-delay:0.12s"><circle cx="162" cy="126" r="7" class="fig-grid-fill"/></g><text x="52" y="160" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">speed</text><path d="M128 156H312" class="fig-grid-stroke" stroke-width="2" opacity="0.5"/><g class="aim-ver-in" style="animation-delay:0.24s"><circle cx="162" cy="156" r="7" class="fig-grid-fill"/></g><text x="52" y="190" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">bots</text><path d="M128 186H312" class="fig-grid-stroke" stroke-width="2" opacity="0.5"/><g class="aim-ver-in" style="animation-delay:0.36s"><circle cx="162" cy="186" r="7" class="fig-grid-fill"/></g><text x="52" y="220" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">time</text><path d="M128 216H312" class="fig-grid-stroke" stroke-width="2" opacity="0.5"/><g class="aim-ver-in" style="animation-delay:0.48s"><circle cx="162" cy="216" r="7" class="fig-grid-fill"/></g><g class="aim-ver-read"><text x="190" y="262" class="fig-balanced-fill" text-anchor="middle" font-size="14" font-weight="700">you learned what size does</text></g><rect x="392" y="46" width="356" height="218" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Five dials moved</tspan></text><text x="432" y="100" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">size</text><path d="M508 96H692" class="fig-grid-stroke" stroke-width="2" opacity="0.5"/><g class="aim-ver-in" style="animation-delay:0.00s"><circle cx="632" cy="96" r="7" class="fig-accent-fill"/></g><text x="432" y="130" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">spread</text><path d="M508 126H692" class="fig-grid-stroke" stroke-width="2" opacity="0.5"/><g class="aim-ver-in" style="animation-delay:0.12s"><circle cx="632" cy="126" r="7" class="fig-accent-fill"/></g><text x="432" y="160" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">speed</text><path d="M508 156H692" class="fig-grid-stroke" stroke-width="2" opacity="0.5"/><g class="aim-ver-in" style="animation-delay:0.24s"><circle cx="632" cy="156" r="7" class="fig-accent-fill"/></g><text x="432" y="190" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">bots</text><path d="M508 186H692" class="fig-grid-stroke" stroke-width="2" opacity="0.5"/><g class="aim-ver-in" style="animation-delay:0.36s"><circle cx="632" cy="186" r="7" class="fig-accent-fill"/></g><text x="432" y="220" class="fig-muted" text-anchor="start" font-size="12" font-weight="500">time</text><path d="M508 216H692" class="fig-grid-stroke" stroke-width="2" opacity="0.5"/><g class="aim-ver-in" style="animation-delay:0.48s"><circle cx="632" cy="216" r="7" class="fig-accent-fill"/></g><g class="aim-ver-read"><text x="570" y="262" class="fig-tense-fill" text-anchor="middle" font-size="14" font-weight="700">you learned nothing</text></g></svg>
