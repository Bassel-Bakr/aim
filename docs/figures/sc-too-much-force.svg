<svg viewBox="0 0 600 164" class="fig-fit" role="img" aria-labelledby="fig-sc-too-much-force-title"><title id="fig-sc-too-much-force-title">Too much force, brakes late. The crosshair leaves the start and carries 30 per cent of the distance past the target. Braking starts late, close to the target, so hauling the crosshair back is the longest part of the shot. The crosshair shakes a little as it arrives. The trigger goes once the motion is done. A faint trail shows how far it got, and a ring or a crossed ring marks where the shot went: the shot lands on the target. The bar underneath is real time on one scale, split into the flick, the braking and the settle, and this shot takes 198 milliseconds from the start to the trigger.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>.aim-iss-t-too_much_force,.aim-iss-m-too_much_force{animation-duration:3.4s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes aimIssTravel_too_much_force{0%{transform:translate(0px,0)}2.381%{transform:translate(10.87px,0)}4.762%{transform:translate(43.47px,0)}7.143%{transform:translate(96.98px,0)}9.524%{transform:translate(156.2px,0)}11.9%{transform:translate(215.4px,0)}14.29%{transform:translate(274.6px,0)}16.67%{transform:translate(333.8px,0)}19.05%{transform:translate(387.1px,-0.1619px)}21.43%{transform:translate(413.6px,-0.677px)}23.81%{transform:translate(434.6px,1.601px)}26.19%{transform:translate(445.9px,1.429px)}28.57%{transform:translate(443px,-1.709px)}30.95%{transform:translate(432.6px,-1.496px)}33.33%{transform:translate(421.8px,1.651px)}35.71%{transform:translate(413.4px,1.561px)}38.1%{transform:translate(404.3px,-1.589px)}40.48%{transform:translate(390.2px,-1.623px)}42.86%{transform:translate(371.9px,1.526px)}45.24%{transform:translate(355.5px,1.683px)}47.62%{transform:translate(346.5px,-1.46px)}50%{transform:translate(344.4px,-1.741px)}52.38%{transform:translate(344.5px,1.391px)}54.76%{transform:translate(341.5px,1.436px)}57.14%{transform:translate(338.2px,-0.7928px)}59.52%{transform:translate(338.3px,-0.7395px)}61.9%{transform:translate(339.9px,0.2502px)}64.29%{transform:translate(340px,0)}100%{transform:translate(340px,0)}}@keyframes aimIssFire_too_much_force{0%,52.38%{opacity:0}54.38%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.aim-iss-t-too_much_force{animation-play-state:paused;animation-delay:-0.918s!important}.aim-iss-m-too_much_force{animation:none!important;opacity:1!important}}</style><rect x="8" y="6" width="584" height="152" rx="12" class="fig-panel"/><text x="20" y="28"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Too much force</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">brakes late</tspan></text><path d="M62 82H560" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><path d="M80 68v28" class="fig-grid-stroke" stroke-width="1.5"/><path d="M80 82H522" class="fig-tense-stroke" stroke-width="8" opacity="0.2" fill="none" stroke-linecap="round"/><circle cx="420" cy="82" r="10" class="fig-target"/><path d="M522 69v26" class="fig-tense-stroke" stroke-width="2" stroke-dasharray="4 3" opacity="0.75"/><text x="522.0" y="58" class="fig-tense-fill" text-anchor="middle" font-size="12" font-weight="700">sails past</text><g class="aim-iss-m-too_much_force" style="animation-name:aimIssFire_too_much_force;opacity:0"><circle cx="424.5" cy="83.39" r="14" class="fig-balanced-stroke" fill="none" stroke-width="2.6"/></g><g class="aim-iss-t-too_much_force" style="animation-name:aimIssTravel_too_much_force"><circle cx="80" cy="82" r="8" class="fig-tense-stroke" stroke-width="2.2" fill="none"/><path d=