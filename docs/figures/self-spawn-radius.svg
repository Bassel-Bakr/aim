<svg viewBox="0 0 760 290" class="fig-fit" role="img" aria-labelledby="fig-selfradius-title"><title id="fig-selfradius-title">Two panels of six spawned targets. With the radius at zero some land close enough to overlap. With a radius set each target carries a marked exclusion ring and none of them cluster.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimSrdPop{0%{opacity:0;transform:scale(0.5)}5%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}.aim-srd-pop{opacity:0;animation-name:aimSrdPop;animation-iteration-count:infinite;animation-duration:5.0s}@media (prefers-reduced-motion:reduce){.aim-srd-pop{opacity:1;animation:none!important;transform:none!important}}</style><rect x="12" y="46" width="356" height="218" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Radius 0</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">two can share a flick</tspan></text><circle cx="220.0" cy="205.9" r="14" class="fig-target aim-srd-pop" style="animation-delay:0.00s;transform-origin:220.0px 205.9px"/><circle cx="178.9" cy="183.1" r="14" class="fig-target aim-srd-pop" style="animation-delay:0.16s;transform-origin:178.9px 183.1px"/><circle cx="301.9" cy="158.6" r="14" class="fig-target aim-srd-pop" style="animation-delay:0.32s;transform-origin:301.9px 158.6px"/><circle cx="249.9" cy="185.2" r="14" class="fig-target aim-srd-pop" style="animation-delay:0.48s;transform-origin:249.9px 185.2px"/><circle cx="281.7" cy="96.7" r="14" class="fig-target aim-srd-pop" style="animation-delay:0.64s;transform-origin:281.7px 96.7px"/><ci