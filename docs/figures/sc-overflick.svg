<svg viewBox="0 0 600 164" class="fig-fit" role="img" aria-labelledby="fig-sc-overflick-title"><title id="fig-sc-overflick-title">Overflick. The crosshair leaves the start and carries 22 per cent of the distance past the target. Braking starts late, close to the target, so hauling the crosshair back is the longest part of the shot. The crosshair is steady. The trigger goes once the motion is done. A faint trail shows how far it got, and a ring or a crossed ring marks where the shot went: the shot lands on the target. The bar underneath is real time on one scale, split into the flick, the braking and the settle, and this shot takes 180 milliseconds from the start to the trigger.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>.aim-iss-t-overflick,.aim-iss-m-overflick{animation-duration:3.4s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes aimIssTravel_overflick{0%{transform:translate(0px,0)}2.381%{transform:translate(10.2px,0)}4.762%{transform:translate(40.8px,0)}7.143%{transform:translate(91.01px,0)}9.524%{transform:translate(146.6px,0)}11.9%{transform:translate(202.1px,0)}14.29%{transform:translate(257.7px,0)}16.67%{transform:translate(313.3px,0)}19.05%{transform:translate(363.6px,0)}21.43%{transform:translate(389.7px,0)}23.81%{transform:translate(406.6px,0)}26.19%{transform:translate(414.3px,0)}28.57%{transform:translate(413.6px,0)}30.95%{transform:translate(407.7px,0)}33.33%{transform:translate(398.2px,0)}35.71%{transform:translate(386.3px,0)}38.1%{transform:translate(373.5px,0)}40.48%{transform:translate(361.1px,0)}42.86%{transform:translate(350.5px,0)}45.24%{transform:translate(343px,0)}47.62%{transform:translate(340px,0)}100%{transform:translate(340px,0)}}@keyframes aimIssFire_overflick{0%,47.62%{opacity:0}49.62%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.aim-iss-t-overflick{animation-play-state:paused;animation-delay:-0.918s!important}.aim-iss-m-overflick{animation:none!important;opacity:1!important}}</style><rect x="8" y="6" width="584" height="152" rx="12" class="fig-panel"/><text x="20" y="28"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Overflick</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">brakes late</tspan></text><path d="M62 82H560" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><path d="M80 68v28" class="fig-grid-stroke" stroke-width="1.5"/><path d="M80 82H494.8" class="fig-tense-stroke" stroke-width="8" opacity="0.2" fill="none" stroke-linecap="round"/><circle cx="420" cy="82" r="10" class="fig-target"/><path d="M494.8 69v26" class="fig-tense-stroke" stroke-width="2" stroke-dasharray="4 3" opacity="0.75"/><text x="494.8" y="58" class="fig-tense-fill" text-anchor="middle" font-size="12" font-weight="700">sails past</text><g class="aim-iss-m-overflick" style="animation-name:aimIssFire_overflick;opacity:0"><circle cx="420" cy="82" r="14" class="fig-balanced-stroke" fill="none" stroke-width="2.6"/></g><g class="aim-iss-t-overflick" style="animation-name:aimIssTravel_overflick"><circle cx="80" cy="82" r="8" class="fig-tense-stroke" stroke-width="2.2" fill="none"/><path d="M67 82H76M84 82H93M80 69V78M80 86V95" class="fig-tense-stroke" stroke-width="2.2"/></g><rect x="80" y="112" width="89" height="14" rx="6" class="fig-ink-fill" opacity="0.7"/><text x="124.5" y="119" class="fig-surface" text-anchor="middle" font-size="11" font-weight="700" dominant-baseline="central">Flick</text><rect x="171" y="112" width="39.6" height="14" rx="6" class="fig-tense-fill" opacity="1.0"/><rect x="212.6" y="112" width="99.92" height="14" rx="6" class="fig-tense-fill" opacity="0.45"/><text x="262.56" y="119" class="fig-ink" text-anchor="middle" font-size="11" font-weight="700" dominant-baseline="central">Settle</text><text x="323.52" y="123" class="fig-tense-fill" text-anchor="start" font-size="12" font-weight="600">180 ms</text><text x="20" y="148" class="fig-muted fig-caption" text-anchor="start" font-size="12" font-weight="600">steady as it arrives</text><text x="580" y="148" class="fig-muted fig-caption" text-anchor="end" font-size="12" font-weight="600">shot lands</text></svg>
