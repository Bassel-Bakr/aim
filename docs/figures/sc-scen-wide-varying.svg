}@keyframes aimScn3mwsHit{0%{opacity:0}3%{opacity:1}100%{opacity:1}}.aim-scn-3mws-hit{opacity:0;stroke-width:2;fill:none;animation-name:aimScn3mwsHit;animation-duration:2.4s;animation-timing-function:linear;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){.aim-scn-3mws{animation-play-state:paused;animation-delay:-0.69s!important}.aim-scn-3mws-hit{opacity:1;animation:none!important}}</style><rect x="12" y="34" width="576" height="138" rx="12" class="fig-panel"/><text x="28" y="24"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Wide flicks of varying distance</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">3 mid, wide</tspan></text><polygon points="130.1 85.2 267.6 85.4 492.7 100.6" class="fig-accent-stroke" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7"/><circle cx="130.1" cy="85.2" r="12" class="fig-target"/><circle cx="267.6" cy="85.4" r="12" class="fig-target"/><circle cx="492.7" cy="100.6" r="12" class="fig-target"/><circle cx="130.1" cy="85.2" r="16.5" class="fig-accent-stroke aim-scn-3mws-hit" style="animation-delay:0.62s"/><circle cx="267.6" cy="85.4" r="16.5" class="fig-accent-stroke aim-scn-3mws-hit" style="animation-delay:1.42s"/><circle cx="492.7" cy="100.6" r="16.5" class="fig-accent-stroke aim-scn-3mws-hit" style="animation-delay:2.22s"/><g class="aim-scn-3mws"><circle cx="492.6609746738816" cy="100.56512395046391" r="8" class="fig-accent-stroke" stroke-width="2.2" fill="none"/><path d="M479.6609746738816 100.56512395046391H488.6609746738816M496.6609746738816 100.56512395046391H505.6609746738816M492.6609746738816 87.56512395046391V96.56512395046391M492.6609746738816 104.56512395046391V113.56512395046391" class="fig-accent-stroke" stroke-width="2.2"/></g></svg>
