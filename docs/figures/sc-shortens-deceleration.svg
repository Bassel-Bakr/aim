<svg viewBox="0 0 600 194" class="fig-fit" role="img" aria-labelledby="fig-sc-shortens-deceleration-title"><title id="fig-sc-shortens-deceleration-title">Shortens the deceleration phase, drawn as the same reach run twice on one clock. The upper run starts slowing far out and crawls the shaded last stretch. The lower run brakes late, over a short stretch. The marks on the clock below are when each run takes its shots, planted as the clock passes them, so the lower row is already finished while the upper run is still working.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimRes3a743fA{0%{transform:translateX(0px)}4.67%{transform:translateX(2px)}6.42%{transform:translateX(20px)}8.76%{transform:translateX(62px)}12.3%{transform:translateX(136px)}14%{transform:translateX(164px)}15.8%{transform:translateX(178px)}22.2%{transform:translateX(186px)}29.2%{transform:translateX(211px)}42%{transform:translateX(279px)}52.6%{transform:translateX(333px)}59.6%{transform:translateX(355px)}66%{transform:translateX(360px)}77.1%{transform:translateX(360px)}100%{transform:translateX(360px)}}@keyframes aimRes3a743fB{0%{transform:translateX(0px)}4.09%{transform:translateX(0px)}5.26%{transform:translateX(9px)}6.42%{transform:translateX(30px)}8.18%{transform:translateX(75px)}12.3%{transform:translateX(201px)}14%{transform:translateX(243px)}15.2%{transform:translateX(260px)}16.4%{transform:translateX(265px)}20.4%{transform:translateX(274px)}26.9%{transform:translateX(308px)}33.9%{transform:translateX(349px)}38%{transform:translateX(360px)}61.3%{transform:translateX(360px)}77.1%{transform:translateX(360px)}100%{transform:translateX(360px)}}@keyframes aimRes3a743fS{0%{transform:translateX(0px)}77.08%{transform:translateX(464px)}100%{transform:translateX(464px)}}.aim-res-3a743f{animation-duration:4.8s;animation-timing-function:linear;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){.aim-res-3a743f{animation-play-state:paused;animation-delay:-1.57s!important}.aim-res-3a743f-s{opacity:0}}</style><rect x="8" y="8" width="584" height="140" rx="12" class="fig-panel"/><text x="22" y="32"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Shortens the deceleration phase</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">braking distance</tspan></text><path d="M78 78H474" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><rect x="271" y="65" width="181" height="26" rx="4" class="fig-tense-fill" opacity="0.14"/><g class="fig-target"><circle cx="452" cy="78" r="9"/></g><text x="22" y="78.0" class="fig-tense-fill" text-anchor="start" font-size="12" font-weight="700" dominant-baseline="central">before</text><g class="aim-res-3a743f" style="animation-name:aimRes3a743fA"><circle cx="92.0" cy="78.0" r="8" class="fig-tense-stroke" stroke-width="2.2" fill="none"/><path d="M79.0 78.0H88.0M96.0 78.0H105.0M92.0 65.0V74.0M92.0 82.0V91.0" class="fig-tense-stroke" stroke-width="2.2"/></g><path d="M78 124H474" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><rect x="357" y="111" width="95" height="26" rx="4" class="fig-balanced-fill" opacity="0.14"/><g class="fig-target"><circle cx="452" cy="124" r="9"/></g><text x="22" y="124.0" class="fig-balanced-fill" text-anchor="start" font-size="12" font-weight="700" dominant-baseline="central">after</text><g class="aim-res-3a743f" style="animation-name:aimRes3a743fB"><circle cx="92.0" cy="124.0" r="8" class="fig-balanced-stroke" stroke-width="2.2" fill="none"/><path d="M79.0 124.0H88.0M96.0 124.0H105.0M92.0 111.0V120.0M92.0 128.0V137.0" class="fig-balanced-stroke" stroke-width="2.2"/>