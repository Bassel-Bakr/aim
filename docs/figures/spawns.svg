<svg viewBox="0 0 760 300" class="fig-fit" role="img" aria-labelledby="fig-spawns-title"><title id="fig-spawns-title">Two panels sharing a spawn marker. With offsets at zero every target appears on the marker itself. With the offsets widened, targets appear one after another at scattered points inside a box around the marker.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimSpawnPop{0%{opacity:0;transform:scale(0.4)}4%{opacity:1;transform:scale(1)}14%{opacity:1;transform:scale(1)}18%{opacity:0;transform:scale(1)}100%{opacity:0}}.aim-spawn-pop{opacity:0;animation-name:aimSpawnPop;animation-iteration-count:infinite;animation-duration:5.0s}@media (prefers-reduced-motion:reduce){.aim-spawn-pop{opacity:1;animation:none!important;transform:none!important}}</style><rect x="12" y="46" width="356" height="238" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Offsets at zero</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">every target on the marker</tspan></text><path d="M181 177L190 168L199 177" class="fig-muted-stroke" stroke-width="2" fill="none"/><text x="190" y="264" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">spawn point</text><circle cx="190.0" cy="168.0" r="14" class="fig-target aim-spawn-pop" style="animation-delay:0.00s;transform-origin:190.0px 168.0px"/><circle cx="190.0" cy="168.0" r="14" class="fig-target aim-spawn-pop" style="animation-delay:0.83s;transform-origin:190.0px 168.0px"/><circle cx="190.0" cy="168.0" r="14" class="fig-target aim-spawn-pop" style="animation-delay:1.67s;transform-origin:190.0px 168.0px"/><circle cx="190.0" cy="168.0" r="14" class="fig-target aim-spawn-pop" style="animation-delay:2.50s;transform-origin:190.0px 168.0px"/><circle cx="190.0" cy="168.0" r="14" class="fig-target aim-spawn-pop" style="animation-delay:3.33s;transform-origin:190.0px 168.0px"/><circle cx="190.0" cy="168.0" r="14" class="fig-target aim-spawn-pop" style="animation-delay:4.17s;transform-origin:190.0px 168.0px"/><rect x="392" y="46" width="356" height="238" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Offsets widened</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">a target anywhere in the box</tspan></text><rect x="442" y="106" width="256" height="124" rx="8" class="fig-grid-stroke" stroke-width="2" stroke-dasharray="7 6" fill="none"/><path d="M561 177L570 168L579 177" class="fig-muted-stroke" stroke-width="2" fill="none"/><text x="570" y="264" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">spawn point</text><circle cx="539.5" cy="134.6" r="14" class="fig-target aim-spawn-pop" style="animation-delay:0.00s;transform-origin:539.5px 134.6px"/><circle cx="484.5" cy="219.3" r="14" class="fig-target aim-spawn-pop" style="animation-delay:0.83s;transform-origin:484.5px 219.3px"/><circle cx="590.0" cy="191.6" r="14" class="fig-target aim-spawn-pop" style="animation-delay:1.67s;transform-origin:590.0px 191.6px"/><circle cx="583.6" cy="153.6" r="14" class="fig-target aim-spawn-pop" style="animation-delay:2.50s;transform-origin:583.6px 153.6px"/><circle cx="629.3" cy="177.5" r="14" class="fig-target aim-spawn-pop" style="animation-delay:3.33s;transform-origin:629.3px 177.5px"/><circle cx="642.0" cy="188.0" r="14" class="fig-target aim-spawn-pop" style="animation-delay:4.17s;transform-origin:642.0px 188.0px"/></svg>
