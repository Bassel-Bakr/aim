<svg viewBox="0 0 760 290" class="fig-fit" role="img" aria-labelledby="fig-stage-title"><title id="fig-stage-title">Two difficulty scales running from easy to past you. While learning, the useful band sits toward the easy end, where the movement can come together. Once the skill is owned, the band sits near the far end, at the edge of what still holds.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimStgIn{0%{opacity:0}8%{opacity:1}100%{opacity:1}}.aim-stg-in{opacity:0;animation-name:aimStgIn;animation-iteration-count:infinite;animation-duration:5.2s}@media (prefers-reduced-motion:reduce){.aim-stg-in{opacity:1;animation:none!important}}</style><rect x="12" y="46" width="356" height="216" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Learning it</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">room to get it right</tspan></text><path d="M56 160H324" class="fig-grid-stroke" stroke-width="2"/><text x="56" y="194" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">easy</text><text x="324" y="194" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">past you</text><g class="aim-stg-in"><rect x="88.2" y="138" width="91.1" height="44" rx="8" class="fig-balanced-fill" opacity="0.22"/></g><g class="aim-stg-in" style="animation-delay:0.5s"><circle cx="136.4" cy="160" r="9" class="fig-accent-fill"/></g><text x="190" y="236" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">set it where the motion holds</text><rect x="392" y="46" width="356" height="216" rx="12" class="fig-panel"/><text x="412" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Owning it</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">work at the edge</tspan></text><path d="M436 160H704" class="fig-grid-stroke" stroke-width="2"/><text x="436" y="194" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">easy</text><text x="704" y="194" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">past you</text><g class="aim-stg-in"><rect x="591.4" y="138" width="85.8" height="44" rx="8" class="fig-balanced-fill" opacity="0.22"/></g><g class="aim-stg-in" style="animation-delay:0.5s"><circle cx="645.0" cy="160" r="9" class="fig-accent-fill"/></g><text x="570" y="236" class="fig-muted" text-anchor="middle" font-size="13" font-weight="500">set it where it just stops holding</text></svg>
