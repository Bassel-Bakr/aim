<svg viewBox="0 0 600 164" class="fig-fit" role="img" aria-labelledby="fig-sc-arm-too-tense-title"><title id="fig-sc-arm-too-tense-title">Arm too tense, bad micros. The crosshair leaves the start and carries 18 per cent of the distance past the target. Braking starts late, close to the target, so hauling the crosshair back is the longest part of the shot. The crosshair shakes badly as it arrives. The trigger goes once the motion is done. A faint trail shows how far it got, and a ring or a crossed ring marks where the shot went: the shot misses. The bar underneath is real time on one scale, split into the flick, the braking and the settle, and this shot takes 172 milliseconds from the start to the trigger.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>.aim-iss-t-arm_too_tense,.aim-iss-m-arm_too_tense{animation-duration:3.4s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes aimIssTravel_arm_too_tense{0%{transform:translate(0px,0)}2.381%{transform:translate(9.865px,0)}4.762%{transform:translate(39.46px,0)}7.143%{transform:translate(88.03px,0)}9.524%{transform:translate(141.8px,0)}11.9%{transform:translate(195.5px,0)}14.29%{transform:translate(249.2px,0)}16.67%{transform:translate(303px,0)}19.05%{transform:translate(350.3px,-0.4557px)}21.43%{transform:translate(373.5px,3.953px)}23.81%{transform:translate(406.1px,-0.9009px)}26.19%{transform:translate(410.7px,-7.176px)}28.57%{transform:translate(388.1px,6.519px)}30.95%{transform:translate(381.2px,2.156px)}33.33%{transform:translate(393.4px,-8.18px)}35.71%{transform:translate(387.9px,4.142px)}38.1%{transform:translate(355.8px,4.99px)}40.48%{transform:translate(334.8px,-7.985px)}42.86%{transform:translate(345.1px,1.158px)}45.24%{transform:translate(356.5px,7.093px)}47.62%{transform:translate(341.5px,-5.296px)}50%{transform:translate(330.4px,-1.198px)}52.38%{transform:translate(337.8px,3.265px)}54.76%{transform:translate(343px,-0.8589px)}57.14%{transform:translate(340px,0)}100%{transform:translate(340px,0)}}@keyframes aimIssFire_arm_too_tense{0%,45.24%{opacity:0}47.24%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.aim-iss-t-arm_too_tense{animation-play-state:paused;animation-delay:-0.918s!important}.aim-iss-m-arm_too_tense{animation:none!important;opacity:1!important}}</style><rect x="8" y="6" width="584" height="152" rx="12" class="fig-panel"/><text x="20" y="28"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Arm too tense</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">brakes late</tspan></text><path d="M62 82H560" class="fig-grid-stroke" stroke-width="1" stroke-dasharray="2 6"/><path d="M80 68v28" class="fig-grid-stroke" stroke-width="1.5"/><path d="M80 82H481.2" class="fig-tense-stroke" stroke-width="8" opacity="0.2" fill="none" stroke-linecap="round"/><circle cx="420" cy="82" r="10" class="fig-target"/><path d="M481.2 69v26" class="fig-tense-stroke" stroke-width="2" stroke-dasharray="4 3" opacity="0.75"/><text x="481.2" y="58" class="fig-tense-fill" text-anchor="middle" font-size="12" font-weight="700">sails past</text><g class="aim-iss-m-arm_too_tense" style="animation-name:aimIssFire_arm_too_tense;opacity:0"><path d="M428 80.59l17 17M445 80.59l-17 17" class="fig-tense-stroke" stroke-width="2.8" fill="none" stroke-linecap="round"/></g><g class="aim-iss-t-arm_too_tense" style="animation-name:aimIssTravel_arm_too_tense"><circle cx="80" cy="82" r="8" class="fig-tense-stroke" stroke-width="2.2" fill="none"/><path d="M67 82H76M84 82H93M80 69V78M80 86V95" class="fig-tense-stroke" stroke-width="2.2"/></g><rect x="80" y="112" width="89" height="14" rx="6" class="fig-ink-fill" opacity="0.7"/><text x="124.5" y="119" class="fig-surface" text-anchor="middle" font-size="11" font-weight="700" dominant-baseline="central">Flick</text><rect x="171" y="112" width="39.6" height="14" rx="6" class="fig-tense-fill" opacity="1.0"/><rect x="212.6" y="112" width="88.48" height="14" rx="6" class="fig-tense-fill" opacity="0.45"/><text x="256.84" y="119" class="fig-ink" text-anchor="middle" font-size="11" font-weight="700" dominant-baseline="central">Settle</text><text x="312.08" y="123" class="fig-tense-fill" text-anchor="start" font-size="12" font-weight="600">172 ms</text><text x="20" y="148" class="fig-muted fig-caption" text-anchor="start" font-size="12" font-weight="600">shakes badly as it arrives</text><text x="580" y="148" class="fig-muted fig-caption" text-anchor="end" font-size="12" font-weight="600">shot misses long</text></svg>
