<svg viewBox="0 0 600 180" class="fig-fit" role="img" aria-labelledby="fig-sc-cluster-approach-title"><title id="fig-sc-cluster-approach-title">Six targets in two groups. The crosshair clears the near group in short hops, makes one long crossing, and clears the far group the same way. Each target dims as it is taken, and the trail dots spread out only across the crossing. Every dot is one tick of one clock, so where the dots crowd the crosshair was slow.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimSym2Runs5{0%{transform:translate(0px,0px)}2.941%{transform:translate(14px,4px)}5.882%{transform:translate(40px,12px)}8.824%{transform:translate(52px,16px)}14.71%{transform:translate(52px,16px)}17.65%{transform:translate(64px,2px)}20.59%{transform:translate(83px,-18px)}23.53%{transform:translate(90px,-26px)}26.47%{transform:translate(90px,-26px)}29.41%{transform:translate(91px,-26px)}32.35%{transform:translate(106px,-13px)}35.29%{transform:translate(126px,3px)}38.24%{transform:translate(132px,8px)}41.18%{transform:translate(132px,8px)}44.12%{transform:translate(135px,8px)}47.06%{transform:translate(173px,4px)}50%{transform:translate(238px,-3px)}52.94%{transform:translate(308px,-10px)}55.88%{transform:translate(364px,-16px)}58.82%{transform:translate(384px,-18px)}64.71%{transform:translate(384px,-18px)}67.65%{transform:translate(397px,-4px)}70.59%{transform:translate(416px,16px)}73.53%{transform:translate(424px,24px)}76.47%{transform:translate(424px,24px)}79.41%{transform:translate(425px,24px)}82.35%{transform:translate(440px,12px)}85.29%{transform:translate(461px,-5px)}88.24%{transform:translate(468px,-10px)}100%{