<svg viewBox="0 0 600 458" class="fig-fit" role="img" aria-labelledby="fig-overflick-title"><title id="fig-overflick-title">One target at one distance, flicked to three ways at once. The tense arm throws the crosshair out fastest and brakes too late: it sails well past the target, hauls back, and the shot goes while it is still long. The loose arm fails the other way round, slowing far too early and dragging the last stretch at a crawl, so the trigger goes with the crosshair still short of the target, which it never reaches at all. The balanced arm travels once, settles on the target and stops there. A faint trail behind each crosshair keeps the furthest point it got to visible after it has moved on, and a ring or a crossed ring marks where each shot landed. The bar under each lane splits the shot into flick time and correction time, so what the two failures cost shows up as the longer second block.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>.aim-ovr-anim,.aim-ovr-mark{animation-duration:4.2s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes aimOvrLane0{0%{transform:translate(0.0px,0)}0.625%{transform:translate(2.0px,0)}1.25%{transform:translate(7.6px,0)}1.875%{transform:translate(16.6px,0)}2.5%{transform:translate(28.7px,0)}3.125%{transform:translate(43.6px,0)}3.75%{transform:translate(60.9px,0)}4.375%{transform:translate(80.3px,0)}5%{transform:translate(101.6px,0)}5.625%{transform:translate(124.4px,0)}6.25%{transform:translate(148.4px,0)}6.875%{transform:translate(173.2px,0)}7.5%{transform:translate(198.7px,0)}8.125%{transform:translate(224.4px,0)}8.75%{transform:translate(250.1px,0)}9.37