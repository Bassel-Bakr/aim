ite}@keyframes aimScn5mwsHit{0%{opacity:0}3%{opacity:1}100%{opacity:1}}.aim-scn-5mws-hit{opacity:0;stroke-width:2;fill:none;animation-name:aimScn5mwsHit;animation-duration:3.14s;animation-timing-function:linear;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){.aim-scn-5mws{animation-play-state:paused;animation-delay:-0.55s!important}.aim-scn-5mws-hit{opacity:1;animation:none!important}}</style><rect x="12" y="34" width="576" height="138" rx="12" class="fig-panel"/><text x="28" y="24"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Varying distance and size</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">5 mid, wide</tspan></text><polygon points="114.3 126.4 365.4 83.5 490.7 72.7 510.6 127.9 381.2 125.4" class="fig-accent-stroke" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7"/><circle cx="114.3" cy="126.4" r="12" class="fig-target"/><circle cx="365.4" cy="83.5" r="12" class="fig-target"/><circle cx="490.7" cy="72.7" r="12" class="fig-target"/><circle cx="510.6" cy="127.9" r="12" class="fig-target"/><circle cx="381.2" cy="125.4" r="12" class="fig-target"/><circle cx="114.3" cy="126.4" r="16.5" class="fig-accent-stroke aim-scn-5mws-hit" style="animation-delay:0.49s"/><circle cx="365.4" cy="83.5" r="16.5" class="fig-accent-stroke aim-scn-5mws-hit" style="animation-delay:1.12s"/><circle cx="490.7" cy="72.7" r="16.5" class="fig-accent-stroke aim-scn-5mws-hit" style="animation-delay:1.75s"/><circle cx="510.6" cy="127.9" r="16.5" class="fig-accent-stroke aim-scn-5mws-hit" style="animation-delay:2.37s"/><circle cx="381.2" cy="125.4" r="16.5" class="fig-accent-stroke aim-scn-5mws-hit" style="animation-delay:3.00s"/><g class="aim-scn-5mws"><circle cx="381.1965168693971" cy="125.43626142300144" r="8" class="fig-accent-stroke" stroke-width="2.2" fill="none"/><path d="M368.1965168693971 125.43626142300144H377.1965168693971M385.1965168693971 125.4362614