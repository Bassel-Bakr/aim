m-sfv-pop" style="animation-delay:0.72s"/><circle cx="594" cy="202" r="13" class="fig-target aim-sfv-pop" style="animation-delay:0.90s"/><circle cx="688" cy="186" r="13" class="fig-target aim-sfv-pop" style="animation-delay:1.08s"/></svg>
