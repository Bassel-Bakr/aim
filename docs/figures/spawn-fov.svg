<svg viewBox="0 0 760 320" class="fig-fit" role="img" aria-labelledby="fig-spawnfov-title"><title id="fig-spawnfov-title">Two panels with a player looking down a marked cone and seven spawn points around them. With the distance set, the spawns inside the cone fade out as blocked. With the distance left at zero every spawn stays available, because the field of view is never checked.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimSfvPop{0%{opacity:0}6%{opacity:1}100%{opacity:1}}.aim-sfv-pop{opacity:0;animation-name:aimSfvPop;animation-iteration-count:infinite;animation-duration:5.6s}@keyframes aimSfvBlock{0%{opacity:0}40%{opacity:0}48%{opacity:0.25}100%{opacity:0.25}}.aim-sfv-block{opacity:0;animation-name:aimSfvBlock;animation-iteration-count:infinite;animation-duration:5.6s}@media (prefers-reduced-motion:reduce){.aim-sfv-pop{opacity:1;animation:none!important}.aim-sfv-block{opacity:0.25;animation:none!important}}</style><rect x="12" y="46" width="356" height="234" rx="12" class="fig-panel"/><text x="32" y="30"><tspan font-size="16" font-weight="700" class="fig-ink fig-name">Distance set</tspan><tspan dx="10" font-size="13" font-weight="500" class="fig-muted fig-note">recommended 15 to 30 degrees</tspan></text><text x="190" y="302" class="fig-muted" text-anchor="middle" font-size="12" font-weight="500">spawns in your view are blocked</text><path d="M190 250L112 84L268 84Z" class="fig-cool-stroke" stroke-width="2" stroke-dasharray="6 5" fill="none" opacity="0.8"/><circle cx="190" cy="242" r="8" class="fig-ink-stroke" stroke-width="2.2" fill="none"/><path d="M177 242H186M194 242H203M190 229V238M190 246V255" clas