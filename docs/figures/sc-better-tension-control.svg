<svg viewBox="0 0 600 194" class="fig-fit" role="img" aria-labelledby="fig-sc-better-tension-control-title"><title id="fig-sc-better-tension-control-title">Better tension control, drawn as the same reach run twice on one clock. The upper run arrives and shakes around the target before it settles. The lower run arrives and holds still. The marks on the clock below are when each run takes its shots, planted as the clock passes them, so the lower row is already finished while the upper run is still working.</title><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:creator>Bassel Bakr</dc:creator><dc:source>https://github.com/Bassel-Bakr/aim</dc:source><cc:license rdf:resource="https://creativecommons.org/licenses/by-sa/4.0/"/></cc:Work></rdf:RDF></metadata><style>@keyframes aimResda9addA{0%{transform:translate(0px,0px)}4.67%{transform:translate(2px,0px)}5.84%{transform:translate(14px,0px)}7.59%{transform:translate(45px,0px)}9.34%{transform:translate(89px,0px)}15.2%{transform:translate(267px,0px)}16.9%{transform:translate(312px,0px)}18.7%{transform:translate(344px,0px)}19.9%{transform:translate(357px,0px)}21%{transform:translate(362px,3px)}22.2%{transform:translate(369px,6px)}23.4%{transform:translate(367px,-2px)}24.5%{transform:translate(359px,-6px)}26.3%{transform:translate(352px,4px)}27.4%{transform:translate(357px,5px)}29.2%{transform:translate(367px,-5px)}30.4%{transform:translate(366px,-2px)}32.1%{transform:translate(356px,5px)}33.9%{transform:translate(355px,-3px)}35%{transform:translate(360px,-4px)}36.8%{transform:translate(366px,4px)}39.7%{transform:translate(356px,-4px)}42%{transform:translate(360px,3px)}44.4%{transform:translate(363px,-3px)}47.9%{transform:translate(357px,1px)}50.2%{transform:translate(362px,-1px)}53.1%{transform:translate(359px,1px)}76.5%{transform:translate(360px,0px)}77.1%{transform:translate(360px,0px)}10