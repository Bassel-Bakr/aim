[project]
site_name = "Aim"
site_description = "Aim training concepts, routines, and a guide to the best existing resources."
site_url = "https://bassel-bakr.github.io/aim/"
repo_url = "https://github.com/Bassel-Bakr/aim"
repo_name = "Bassel-Bakr/aim"
edit_uri = "edit/main/docs/"
copyright = "Content licensed under <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a>"

extra_css = ["assets/stylesheets/aim.css"]
extra_javascript = ["assets/javascripts/aim-stats.js", "assets/javascripts/aim-tables.js",
                    "assets/javascripts/aim-hotspots.js"]

nav = [
  { "Home" = "index.md" },
  { "Wiki" = [
    "wiki/index.md",
    { "Getting Started" = [
      "wiki/getting-started/index.md",
      "wiki/getting-started/sensitivity.md",
      "wiki/getting-started/setup.md",
      "wiki/getting-started/aim-trainers.md",
    ] },
    { "Fundamentals" = [
      "wiki/fundamentals/index.md",
      "wiki/fundamentals/how-aim-works.md",
      "wiki/fundamentals/tension-management.md",
      "wiki/fundamentals/practice-principles.md",
      "wiki/fundamentals/transfer-to-games.md",
    ] },
    { "Categories" = [
      "wiki/categories/index.md",
      "wiki/categories/clicking.md",
      "wiki/categories/tracking.md",
      "wiki/categories/switching.md",
    ] },
    { "Training" = [
      "wiki/training/index.md",
      "wiki/training/routines.md",
      "wiki/training/benchmarks.md",
      "wiki/training/progress-and-plateaus.md",
      "wiki/training/health.md",
    ] },
    # The five pages above the trainer group are about what a scenario should demand and whether
    # it measures anything, which is the same question in any trainer. Everything below is one
    # trainer's editor, so it sits under that trainer's name: Aimlabs and Aimbeast have editors of
    # their own and get their own group when they are written.
    { "Making Scenarios" = [
      "wiki/making-scenarios/index.md",
      "wiki/making-scenarios/designing-around-a-weakness.md",
      "wiki/making-scenarios/designing-target-motion.md",
      "wiki/making-scenarios/tuning-difficulty.md",
      "wiki/making-scenarios/keeping-the-score-readable.md",
      "wiki/making-scenarios/testing-and-iterating.md",
      # The editors are named and ordered as the game's own Profile Manager tabs are: Char,
      # Weapon, Abilities, Bot, Dodge, Aim, with the Edit Scenario window first. A reader with the
      # game open reads the same words in the same order. Each page keeps its own title, so search
      # results and links still say Character Profile.
      { "KovaaK's" = [
        # First in the group, so navigation.indexes makes the group's own label open this page.
        "wiki/making-scenarios/kovaaks/index.md",
        "wiki/making-scenarios/kovaaks/making-a-scenario.md",
        { "Scenario" = "wiki/making-scenarios/kovaaks/edit-scenario.md" },
        { "Char" = "wiki/making-scenarios/kovaaks/character-profile.md" },
        { "Weapon" = "wiki/making-scenarios/kovaaks/weapon-profile.md" },
        { "Abilities" = "wiki/making-scenarios/kovaaks/ability-profile.md" },
        { "Bot" = "wiki/making-scenarios/kovaaks/bot-profile.md" },
        { "Dodge" = "wiki/making-scenarios/kovaaks/dodge-profile.md" },
        { "Aim" = "wiki/making-scenarios/kovaaks/aim-profile.md" },
        "wiki/making-scenarios/kovaaks/where-settings-live.md",
        "wiki/making-scenarios/kovaaks/sharing-to-the-workshop.md",
      ] },
    ] },
    { "Resources" = [
      "wiki/resources/index.md",
      { "Communities" = [
        "wiki/resources/communities/voltaic.md",
        "wiki/resources/communities/jade-palace.md",
        "wiki/resources/communities/revosect.md",
        "wiki/resources/communities/x76.md",
      ] },
      { "Trainers" = [
        "wiki/resources/trainers/kovaaks.md",
        "wiki/resources/trainers/aimlabs.md",
        "wiki/resources/trainers/aimbeast.md",
      ] },
      "wiki/resources/tools.md",
      "wiki/resources/guides.md",
    ] },
    { "Myths" = "wiki/myths.md" },
    { "Glossary" = "wiki/glossary.md" },
    { "References" = "wiki/references.md" },
    { "Tags" = "wiki/tags.md" },
  ] },
  { "Articles" = [
    "articles/index.md",
    "articles/metronome-method.md",
    "articles/weakness-targeted-static-flowchart.md",
  ] },
]

[project.theme]
name = "material"
custom_dir = "overrides"
favicon = "assets/favicon.svg"
icon.logo = "lucide/crosshair"
features = [
  "content.action.edit",
  "navigation.tabs",
  "navigation.indexes",
  "navigation.footer",
  "search.suggest",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

# Site integrations, written into every page by overrides/main.html. Each is left out while empty,
# so a fork deploying elsewhere sets its own values or clears them.
[project.extra]
# GoatCounter page views: the site code from <code>.goatcounter.com. It sets no cookies, so the
# site needs no consent banner.
goatcounter_code = "aim-wiki"
# Google Search Console ownership check for this site. A fork deploying elsewhere replaces it with
# its own code from Search Console (HTML tag method, the content value only), or empties it.
google_site_verification = "FGcY94GcYsusz2n50DU4UE4IOG4HTK8z-cnTo8a2M_s"

[project.plugins]
search = {}
tags = {}

# Pages that moved after the site was already live. Keep an entry here rather
# than letting an old link 404.
[project.plugins.redirects.redirect_maps]
"guides/index.md" = "articles/index.md"
"topics/index.md" = "articles/index.md"
"wiki/resources/links.md" = "wiki/resources/guides.md"
"links.md" = "wiki/resources/guides.md"
"wiki/skills/index.md" = "wiki/categories/index.md"
"wiki/skills/clicking.md" = "wiki/categories/clicking.md"
"wiki/skills/tracking.md" = "wiki/categories/tracking.md"
"wiki/skills/switching.md" = "wiki/categories/switching.md"
"wiki/fundamentals/tension.md" = "wiki/fundamentals/tension-management.md"
"wiki/techniques/underaiming.md" = "wiki/glossary.md"
"wiki/resources/tools/evxl.md" = "wiki/resources/tools.md"
"wiki/resources/tools/kova.md" = "wiki/resources/tools.md"
"wiki/resources/tools/kovobs.md" = "wiki/resources/tools.md"
"wiki/resources/tools/rawaccel.md" = "wiki/resources/tools.md"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
# Number footnotes in the order a page first cites them, not the order their definitions appear:
# references are defined by the aim_references extension, after the page's own text.
footnotes = { USE_DEFINITION_ORDER = false }
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.snippets.auto_append = ["includes/abbreviations.md"]
aim_figures = { folder = "docs/figures" }
aim_references = { registry = "references.yml" }
aim_related = {}
aim_sources = { registry = "references.yml" }
aim_stats = { registry = "references.yml" }
